  {key:'komponencloud', title:'Komponen dan Cloud', emoji:'☁️', tema:'Man TI', slide:'5-19', desc:'Komponen infrastruktur TI, model layanan dan deployment cloud.', html:"<!DOCTYPE html>\n<html lang=\"id\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Komponen dan Cloud<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&display=swap\" rel=\"stylesheet\">\n<style>\n:root{\n  box-sizing:border-box;\n  padding-top:env(safe-area-inset-top,0px);\n  padding-bottom:env(safe-area-inset-bottom,0px);\n  --bg:#FFF9F3; --card:#FFFFFF; --ink:#182255; --muted:#566086;\n  --accent:#F79039; --accent-2:#FEBD26;\n  --peach:#FCDDC2; --peach-2:#FBCCA4; --line:#F3D3B6;\n  --ok:#14805A; --ok-bg:#DDF4EA; --bad:#C23A3A; --bad-bg:#FBE1E1;\n  --term:#101636; --term-ink:#D9F7E8;\n}\n@media (prefers-color-scheme: dark){\n  :root:not([data-theme=\"light\"]){\n    --bg:#121731; --card:#1B2347; --ink:#F4EFE8; --muted:#AAB1D3;\n    --peach:#2A3263; --peach-2:#36407A; --line:#3A4580;\n    --ok:#4CD6A0; --ok-bg:#12382C; --bad:#FF8A8A; --bad-bg:#44202A;\n    --term:#0A0E24;\n  }\n}\n:root[data-theme=\"dark\"]{\n  --bg:#121731; --card:#1B2347; --ink:#F4EFE8; --muted:#AAB1D3;\n  --peach:#2A3263; --peach-2:#36407A; --line:#3A4580;\n  --ok:#4CD6A0; --ok-bg:#12382C; --bad:#FF8A8A; --bad-bg:#44202A;\n  --term:#0A0E24;\n}\nhtml{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}\n*,*::before,*::after{box-sizing:inherit}\nbody{margin:0;min-height:100%;background:var(--bg);color:var(--ink);\n  font-family:Arial,\"Helvetica Neue\",sans-serif;font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}\nh1,h2,h3{font-family:Montserrat,Arial,sans-serif;margin:0;line-height:1.2}\nbutton{font:inherit;color:inherit;cursor:pointer}\nbutton:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent-2);outline-offset:2px}\n.app{max-width:720px;margin:0 auto;padding:16px 14px 28px}\n\n/* menu */\n.hero{background:var(--accent);color:#fff;border-radius:22px;padding:22px 20px 20px;position:relative;overflow:hidden}\n.hero h1{font-size:clamp(26px,7vw,34px);font-weight:800;color:#fff;padding-right:84px}\n.hero p{margin:8px 0 0;color:#FFF3E6;padding-right:84px}\n.hero .decor{position:absolute;right:14px;top:14px;font-size:58px;line-height:1;transform:rotate(-6deg)}\n.levels{display:grid;gap:12px;margin-top:16px}\n.lvl{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;text-align:left;\n  background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px 16px;width:100%}\n.lvl:hover{border-color:var(--accent)}\n.lvl .no{width:46px;height:46px;border-radius:50%;background:var(--peach);display:grid;place-items:center;\n  font-family:Montserrat,Arial,sans-serif;font-weight:800;font-size:20px}\n.lvl h2{font-size:17px}\n.lvl p{margin:3px 0 0;color:var(--muted);font-size:14px}\n.stars{font-size:20px;letter-spacing:2px;color:var(--accent-2);white-space:nowrap}\n.stars .off{color:var(--line)}\n.foot{margin-top:18px;color:var(--muted);font-size:13px}\n\n/* bar */\n.bar{display:flex;align-items:center;gap:10px;margin-bottom:12px}\n.back{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:8px 12px;font-weight:700}\n.bar h2{font-size:18px;flex:1}\n.chip{background:var(--peach);border-radius:999px;padding:6px 14px;font-weight:700;font-size:14px;white-space:nowrap}\n.chip.warn{background:var(--bad-bg);color:var(--bad)}\n.chip.good{background:var(--ok-bg);color:var(--ok)}\n.status{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}\n.task{background:var(--peach);border-radius:14px;padding:12px 14px;margin-bottom:12px;font-size:15.5px}\n.hint{margin:0 0 12px;color:var(--muted);font-size:14.5px}\n.btn{border:0;border-radius:14px;padding:12px 18px;font-weight:700;background:var(--accent);color:#fff;flex:1}\n.btn.alt{background:var(--card);color:var(--ink);border:2px solid var(--line)}\n.btn.dark{background:var(--ink);color:var(--bg)}\n.btn:disabled{opacity:.5;cursor:default}\n.row-btns{display:flex;gap:10px;margin-top:14px}\n.msg{margin-top:12px;min-height:22px;font-weight:700;text-align:center}\n\n/* quiz */\n.qcard{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px}\n.qcard h3{font-size:17px;margin-bottom:6px}\n.ctx{margin:0 0 10px;font-size:15px}\n.clue{background:var(--peach);border-radius:12px;padding:10px 12px;margin:0 0 10px;font-size:14.5px}\n.clue b{display:block;margin-bottom:2px}\n.opts{display:grid;gap:10px;margin-top:12px}\n.opts.cols2{grid-template-columns:1fr 1fr}\n.opt{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:12px 14px;text-align:left;font-weight:700;font-size:15px}\n.opt:hover:not(:disabled){border-color:var(--accent)}\n.opt.right{background:var(--ok-bg);border-color:var(--ok)}\n.opt.wrong{background:var(--bad-bg);border-color:var(--bad)}\n.fb{margin-top:14px;border-radius:14px;padding:12px 14px;font-size:14.5px}\n.fb.ok{background:var(--ok-bg)} .fb.bad{background:var(--bad-bg)}\n.fb b{display:block;margin-bottom:2px}\n\n/* sorter */\n.spool{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:6px 0 8px;margin-bottom:8px}\n.spool .box{border:2px dashed var(--line);border-radius:16px;background:var(--card);padding:8px;display:flex;flex-wrap:wrap;gap:6px;\n  justify-content:center;max-height:34vh;overflow:auto;min-height:56px;align-items:center}\n.scard{border:2px solid var(--peach-2);background:var(--peach);border-radius:12px;padding:7px 11px;font-weight:700;font-size:14px;text-align:left}\n.scard.sel{outline:3px solid var(--accent-2);transform:translateY(-2px);border-color:var(--accent)}\n.scard.ok{background:var(--ok-bg);border-color:var(--ok)}\n.scard.bad{background:var(--bad-bg);border-color:var(--bad)}\n.spool .empty{color:var(--muted);font-size:14px}\n.bin{border:2px solid var(--line);background:var(--card);border-radius:16px;padding:9px 11px 10px;margin-bottom:8px;cursor:pointer}\n.bin.target{border-color:var(--accent);background:var(--peach)}\n.bin .bl{font-weight:800;font-size:14.5px}\n.bin .bs{font-weight:400;color:var(--muted);font-size:12.5px;margin-left:6px}\n.bin .items{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;min-height:6px}\n\n/* order */\n.slots{display:grid;gap:8px}\n.slot{display:flex;gap:10px;align-items:stretch;min-height:46px}\n.slot .n{flex:0 0 34px;border-radius:10px;background:var(--peach);display:grid;place-items:center;font-weight:800}\n.slot .c{flex:1;border:2px dashed var(--line);border-radius:12px;padding:8px 12px;display:flex;align-items:center;text-align:left;\n  background:var(--card);font-size:14.5px;min-height:46px}\n.slot .c.filled{border-style:solid;border-color:var(--peach-2);background:var(--peach);font-weight:700;cursor:pointer}\n.slot .c.locked{background:var(--card);border-color:var(--ink);cursor:default}\n.slot .c.ok{background:var(--ok-bg);border-color:var(--ok)}\n.slot .c.bad{background:var(--bad-bg);border-color:var(--bad)}\n.slot .lab{display:block;font-size:12px;color:var(--muted);font-weight:400}\n.opool{margin-top:12px;display:grid;gap:8px;padding:10px;border:2px dashed var(--line);border-radius:16px;background:var(--card)}\n.opool.g2{grid-template-columns:1fr 1fr}\n.ocard{border:2px solid var(--peach-2);background:var(--peach);border-radius:12px;padding:9px 12px;font-weight:700;font-size:14px;text-align:left}\n.opool .empty{color:var(--muted);font-size:14px;grid-column:1/-1;text-align:center}\n.reveal{margin-top:12px;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 14px}\n.reveal ol{margin:6px 0 0;padding-left:20px}\n.reveal li{margin-bottom:6px;font-size:14.5px}\n\n/* result */\n.result{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:24px 18px;text-align:center}\n.result .stars{font-size:46px;margin:6px 0 4px}\n.result h2{font-size:22px}\n.result p{color:var(--muted);margin:6px auto 0;max-width:44ch}\n.stat{display:flex;justify-content:center;gap:10px;margin:14px 0 4px;flex-wrap:wrap}\n.stat span{background:var(--peach);border-radius:999px;padding:6px 14px;font-weight:700;font-size:14px}\n.result .row-btns{flex-wrap:wrap}\n.result .row-btns .btn{min-width:130px}\n.extra{margin-top:14px;text-align:left}\n.note{margin-top:14px;font-size:12.5px;color:var(--muted);text-align:left}\n@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}\n\n\n<\/style>\n<\/head>\n<body>\n<div class=\"app\" id=\"view\"><\/div>\n<script>\n/* ===================== util umum ===================== */\nvar GAME = null;\nvar view = document.getElementById('view');\nvar timerId = null;\nfunction clearTimer(){ if (timerId){ clearInterval(timerId); timerId = null; } }\nfunction shuffle(a){\n  a = a.slice();\n  for (var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }\n  return a;\n}\nfunction pick(a){ return a[Math.floor(Math.random()*a.length)]; }\nfunction esc(s){ return String(s).replace(/&/g,'&amp;').replace(/<\/g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;'); }\nfunction eqArr(a,b){ if (a.length !== b.length) return false; for (var i=0;i<a.length;i++){ if (a[i]!==b[i]) return false; } return true; }\n\nfunction loadBest(){\n  try { var r = localStorage.getItem('best_' + GAME.key); if (r) return JSON.parse(r); } catch(e){}\n  return {1:0,2:0,3:0};\n}\nfunction saveBest(level, stars){\n  try {\n    var b = loadBest();\n    if (stars > (b[level]||0)) { b[level] = stars; localStorage.setItem('best_' + GAME.key, JSON.stringify(b)); }\n  } catch(e){}\n}\nfunction starsHTML(n){\n  var s = '<span class=\"stars\" aria-label=\"' + n + ' dari 3 bintang\">';\n  for (var i=1;i<=3;i++) s += i<=n ? '★' : '<span class=\"off\">★<\/span>';\n  return s + '<\/span>';\n}\nfunction barHTML(title, chip){\n  return '<div class=\"bar\"><button class=\"back\" id=\"bk\">&larr; Menu<\/button><h2>' + title + '<\/h2>' + (chip||'') + '<\/div>';\n}\nfunction bindBack(){ var b = document.getElementById('bk'); if (b) b.onclick = showMenu; }\nfunction levelTitle(n){ return 'Level ' + n + ': ' + ['Mudah','Sedang','Sulit'][n-1]; }\n\n/* ===================== menu ===================== */\nfunction showMenu(){\n  clearTimer();\n  var best = loadBest(), h = '';\n  h += '<div class=\"hero\"><div class=\"decor\" aria-hidden=\"true\">' + GAME.emoji + '<\/div><h1>' + GAME.title + '<\/h1><p>' + GAME.intro + '<\/p><\/div><div class=\"levels\">';\n  GAME.levels.forEach(function(l, i){\n    h += '<button class=\"lvl\" data-l=\"' + (i+1) + '\"><span class=\"no\">' + (i+1) + '<\/span><span><h2>' + l[0] + '<\/h2><p>' + l[1] + '<\/p><\/span>' + starsHTML(best[i+1]||0) + '<\/button>';\n  });\n  h += '<\/div><p class=\"foot\">Semua level terbuka. Mulai dari mana saja. ' + GAME.foot + '<\/p>';\n  view.innerHTML = h;\n  Array.prototype.forEach.call(view.querySelectorAll('.lvl'), function(b){\n    b.addEventListener('click', function(){ GAME.start(+b.dataset.l); });\n  });\n}\n\n/* ===================== hasil ===================== */\nfunction showResult(r){\n  clearTimer();\n  var h = '<div class=\"result\">' + starsHTML(r.stars) + '<h2>' + r.title + '<\/h2><p>' + r.text + '<\/p>';\n  if (r.stats && r.stats.length) h += '<div class=\"stat\">' + r.stats.map(function(s){ return '<span>' + s + '<\/span>'; }).join('') + '<\/div>';\n  if (r.extra) h += '<div class=\"extra\">' + r.extra + '<\/div>';\n  h += '<div class=\"row-btns\"><button class=\"btn alt\" id=\"rm\">Menu<\/button><button class=\"btn\" id=\"ra\">Main lagi<\/button>' +\n       (r.level < 3 && r.stars > 0 ? '<button class=\"btn dark\" id=\"rn\">Level ' + (r.level+1) + '<\/button>' : '') + '<\/div>';\n  if (r.note) h += '<p class=\"note\">' + r.note + '<\/p>';\n  view.innerHTML = h + '<\/div>';\n  document.getElementById('rm').onclick = showMenu;\n  document.getElementById('ra').onclick = function(){ GAME.start(r.level); };\n  var rn = document.getElementById('rn');\n  if (rn) rn.onclick = function(){ GAME.start(r.level + 1); };\n}\nfunction starsBy(v, hi, mid, lo){ return v >= hi ? 3 : (v >= mid ? 2 : (v >= lo ? 1 : 0)); }\nfunction starsLow(v, a, b){ return v <= a ? 3 : (v <= b ? 2 : 1); }   /* makin kecil makin baik */\n\n/* ===================== komponen: kuis pilihan ===================== */\n/* cfg: {level,title,qs:[{ctx,clue,cluelabel,prompt,opts:[{k,t,fb}],ans,why}],perQ,cols,finish(score,total)} */\nfunction runQuiz(cfg){\n  clearTimer();\n  var qs = cfg.qs, idx = 0, score = 0, answered = false, left = 0;\n  function render(){\n    clearTimer(); answered = false;\n    var q = qs[idx];\n    var h = barHTML(cfg.title, '<span class=\"chip\">Soal ' + (idx+1) + '/' + qs.length + '<\/span>');\n    h += '<div class=\"status\"><span class=\"chip\">Skor: ' + score + '<\/span>' + (cfg.perQ ? '<span class=\"chip\" id=\"tchip\">' + cfg.perQ + ' dtk<\/span>' : '') + '<\/div>';\n    h += '<div class=\"qcard\">';\n    if (q.ctx) h += '<p class=\"ctx\">' + q.ctx + '<\/p>';\n    if (q.clue) h += '<div class=\"clue\"><b>' + (q.cluelabel || 'Temuan') + '<\/b>' + q.clue + '<\/div>';\n    h += '<h3>' + q.prompt + '<\/h3><div class=\"opts' + (cfg.cols === 2 ? ' cols2' : '') + '\">';\n    q.opts.forEach(function(o){ h += '<button class=\"opt\" data-k=\"' + o.k + '\">' + o.t + '<\/button>'; });\n    h += '<\/div><div id=\"fb\"><\/div><\/div>';\n    view.innerHTML = h;\n    bindBack();\n    Array.prototype.forEach.call(view.querySelectorAll('.opt'), function(b){\n      b.addEventListener('click', function(){ answer(b.dataset.k); });\n    });\n    if (cfg.perQ) {\n      left = cfg.perQ;\n      timerId = setInterval(function(){\n        left--;\n        var c = document.getElementById('tchip');\n        if (c) { c.textContent = left + ' dtk'; c.className = 'chip' + (left <= 5 ? ' warn' : ''); }\n        if (left <= 0) { clearTimer(); answer(null); }\n      }, 1000);\n    }\n  }\n  function answer(k){\n    if (answered) return;\n    answered = true; clearTimer();\n    var q = qs[idx];\n    var right = (k !== null && String(k) === String(q.ans));\n    if (right) score++;\n    var chosen = null, correct = null;\n    q.opts.forEach(function(o){ if (String(o.k) === String(k)) chosen = o; if (String(o.k) === String(q.ans)) correct = o; });\n    Array.prototype.forEach.call(view.querySelectorAll('.opt'), function(b){\n      b.disabled = true;\n      if (String(b.dataset.k) === String(q.ans)) b.classList.add('right');\n      else if (k !== null && b.dataset.k === String(k)) b.classList.add('wrong');\n    });\n    var txt = '';\n    if (k === null) txt += 'Waktu habis. ';\n    if (!right && chosen && chosen.fb) txt += chosen.fb + ' ';\n    if (!right && correct) txt += 'Jawaban tepat: ' + correct.t + '. ';\n    if (right && correct && correct.fb) txt += correct.fb + ' ';\n    if (q.why) txt += q.why;\n    var last = idx === qs.length - 1;\n    document.getElementById('fb').innerHTML =\n      '<div class=\"fb ' + (right ? 'ok' : 'bad') + '\"><b>' + (right ? 'Benar' : (k === null ? 'Waktu habis' : 'Belum tepat')) + '<\/b>' + txt + '<\/div>' +\n      '<div class=\"row-btns\"><button class=\"btn\" id=\"nx\">' + (last ? 'Lihat hasil' : 'Lanjut') + '<\/button><\/div>';\n    var nx = document.getElementById('nx');\n    nx.onclick = function(){ if (last) cfg.finish(score, qs.length); else { idx++; render(); } };\n    nx.focus();\n  }\n  render();\n}\n\n/* ===================== komponen: urutkan ===================== */\n/* cfg: {level,title,task,items:[{id,t}] (urutan benar),labels,locked:[idx],feedback:'live'|'marks'|'count',timer,g2,reveal,\n         onDone(res),onTimeout(res)} */\nfunction runOrder(cfg){\n  clearTimer();\n  var items = cfg.items, n = items.length, byId = {};\n  items.forEach(function(it){ byId[it.id] = it; });\n  var st = {slots:[], locked:{}, done:false, mistakes:0, checks:0, left:cfg.timer || 0, msg:'', marks:null};\n  for (var i=0;i<n;i++) st.slots.push(null);\n  (cfg.locked || []).forEach(function(i){ st.slots[i] = items[i].id; st.locked[i] = true; });\n  var poolOrder = shuffle(items.map(function(it){ return it.id; })).filter(function(id){ return st.slots.indexOf(id) < 0; });\n  var fbk = cfg.feedback;\n\n  view.innerHTML = barHTML(cfg.title, '') + '<div id=\"stage\"><\/div>';\n  bindBack();\n  var stage = document.getElementById('stage');\n\n  function chipHTML(){\n    if (cfg.timer) return '<span class=\"chip\" id=\"tchip\">' + st.left + ' dtk<\/span>';\n    if (fbk === 'live') return '<span class=\"chip\" id=\"mchip\">Salah: ' + st.mistakes + '<\/span>';\n    return '<span class=\"chip\" id=\"mchip\">Periksa: ' + st.checks + 'x<\/span>';\n  }\n  function draw(){\n    var h = '<div class=\"status\">' + chipHTML() + '<\/div><div class=\"task\">' + cfg.task + '<\/div><div class=\"slots\" id=\"slots\">';\n    for (var i=0;i<n;i++){\n      var id = st.slots[i], cls = 'c';\n      if (id) {\n        cls += st.locked[i] ? ' locked' : ' filled';\n        if (!st.locked[i]) {\n          if (fbk === 'live') cls += (id === items[i].id ? ' ok' : ' bad');\n          else if (st.marks) cls += (st.marks[i] ? ' ok' : ' bad');\n        }\n      }\n      h += '<div class=\"slot\" data-i=\"' + i + '\"><div class=\"n\">' + (i+1) + '<\/div><div class=\"' + cls + '\">';\n      if (id) h += '<span>' + (cfg.labels && cfg.showLabels ? '<span class=\"lab\">' + cfg.labels[i] + '<\/span>' : '') + esc(byId[id].t) + (st.locked[i] ? ' <span class=\"lab\" style=\"display:inline\">(terkunci)<\/span>' : '') + '<\/span>';\n      else h += '<span class=\"lab\" style=\"color:var(--muted)\">Tap kartu di bawah<\/span>';\n      h += '<\/div><\/div>';\n    }\n    h += '<\/div><div class=\"opool' + (cfg.g2 ? ' g2' : '') + '\" id=\"opool\">';\n    var inPool = poolOrder.filter(function(id){ return st.slots.indexOf(id) < 0; });\n    if (!inPool.length) h += '<span class=\"empty\">Semua kartu sudah dipasang<\/span>';\n    inPool.forEach(function(id){ h += '<button class=\"ocard\" data-id=\"' + id + '\">' + esc(byId[id].t) + '<\/button>'; });\n    h += '<\/div><div class=\"row-btns\"><button class=\"btn alt\" id=\"rs\">Ulangi<\/button>' +\n         (fbk !== 'live' ? '<button class=\"btn\" id=\"ck\">Periksa<\/button>' : '') + '<\/div><div class=\"msg\" id=\"msg\"><\/div>';\n    stage.innerHTML = h;\n    document.getElementById('msg').textContent = st.msg;\n    document.getElementById('rs').onclick = function(){\n      if (st.done) return;\n      for (var i=0;i<n;i++) if (!st.locked[i]) st.slots[i] = null;\n      st.msg = ''; st.marks = null; draw();\n    };\n    var ck = document.getElementById('ck');\n    if (ck) ck.onclick = check;\n  }\n  function firstEmpty(){ for (var i=0;i<n;i++) if (st.slots[i] === null) return i; return -1; }\n  function allCorrect(){ for (var i=0;i<n;i++) if (st.slots[i] !== items[i].id) return false; return true; }\n\n  stage.addEventListener('click', function(e){\n    if (st.done) return;\n    var oc = e.target.closest('.ocard');\n    if (oc) {\n      var i = firstEmpty();\n      if (i < 0) return;\n      st.slots[i] = oc.dataset.id; st.msg = ''; st.marks = null;\n      if (fbk === 'live' && oc.dataset.id !== items[i].id) st.mistakes++;\n      draw();\n      if (fbk === 'live') {\n        if (allCorrect()) finish();\n        else if (firstEmpty() < 0) { st.msg = 'Tap kartu yang merah untuk mengembalikannya, lalu coba lagi.'; draw(); }\n      }\n      return;\n    }\n    var sl = e.target.closest('.slot');\n    if (sl) {\n      var j = +sl.dataset.i;\n      if (st.slots[j] && !st.locked[j]) { st.slots[j] = null; st.msg = ''; st.marks = null; draw(); }\n    }\n  });\n\n  function check(){\n    if (st.done) return;\n    if (firstEmpty() >= 0) { st.msg = 'Isi semua posisi dulu.'; draw(); return; }\n    st.checks++;\n    var ok = 0, marks = [];\n    for (var i=0;i<n;i++){ var m = st.slots[i] === items[i].id; marks.push(m); if (m) ok++; }\n    if (ok === n) { finish(); return; }\n    st.marks = fbk === 'marks' ? marks : null;\n    st.msg = ok + ' dari ' + n + ' posisi sudah benar. Coba lagi.';\n    draw();\n  }\n  function finish(){\n    if (st.done) return;\n    st.done = true; clearTimer();\n    var res = {mistakes:st.mistakes, checks:st.checks, left:st.left, ok:true};\n    if (cfg.reveal) {\n      var h = '<div class=\"reveal\"><b>Urutan yang benar<\/b><ol>';\n      items.forEach(function(it, i){ h += '<li>' + (cfg.labels ? '<b>' + cfg.labels[i] + ':<\/b> ' : '') + esc(it.t) + '<\/li>'; });\n      h += '<\/ol><\/div><div class=\"row-btns\"><button class=\"btn\" id=\"go\">Lanjut<\/button><\/div>';\n      stage.innerHTML = '<div class=\"status\"><span class=\"chip good\">Urutan benar<\/span><\/div>' + h;\n      document.getElementById('go').onclick = function(){ cfg.onDone(res); };\n    } else cfg.onDone(res);\n  }\n  if (cfg.timer) {\n    timerId = setInterval(function(){\n      if (st.done) return;\n      st.left--;\n      var c = document.getElementById('tchip');\n      if (c) { c.textContent = st.left + ' dtk'; c.className = 'chip' + (st.left <= 15 ? ' warn' : ''); }\n      if (st.left <= 0) { st.left = 0; st.done = true; clearTimer(); if (cfg.onTimeout) cfg.onTimeout({checks:st.checks}); }\n    }, 1000);\n  }\n  draw();\n}\n\n/* ===================== komponen: sortir ke kotak ===================== */\n/* cfg: {level,title,task,bins:[{id,label,short,sub}],cards:[{id,t,bin}],hideNames,feedback:'live'|'check',onDone(res)} */\nfunction runSorter(cfg){\n  clearTimer();\n  var st = {place:{}, sel:null, mistakes:0, checks:0, done:false, msg:'', marks:null};\n  var cards = shuffle(cfg.cards), byId = {};\n  cfg.cards.forEach(function(c){ byId[c.id] = c; });\n  var live = cfg.feedback === 'live';\n  view.innerHTML = barHTML(cfg.title, '') + '<div id=\"stage\"><\/div>';\n  bindBack();\n  var stage = document.getElementById('stage');\n\n  function draw(){\n    var h = '<div class=\"status\"><span class=\"chip\" id=\"mchip\">' + (live ? 'Salah: ' + st.mistakes : 'Periksa: ' + st.checks + 'x') + '<\/span><\/div>';\n    h += '<div class=\"task\">' + cfg.task + '<\/div>';\n    h += '<div class=\"spool\"><div class=\"box\" id=\"pool\">';\n    var rest = cards.filter(function(c){ return !st.place[c.id]; });\n    if (!rest.length) h += '<span class=\"empty\">Semua kartu sudah dipasang<\/span>';\n    rest.forEach(function(c){ h += '<button class=\"scard' + (st.sel === c.id ? ' sel' : '') + '\" data-id=\"' + c.id + '\">' + esc(c.t) + '<\/button>'; });\n    h += '<\/div><\/div><div id=\"bins\">';\n    cfg.bins.forEach(function(b){\n      h += '<div class=\"bin' + (st.sel ? ' target' : '') + '\" data-bin=\"' + b.id + '\"><div class=\"bl\">' + (cfg.hideNames ? b.short : b.label) +\n           (!cfg.hideNames && b.sub ? '<span class=\"bs\">' + b.sub + '<\/span>' : '') + '<\/div><div class=\"items\">';\n      cards.filter(function(c){ return st.place[c.id] === b.id; }).forEach(function(c){\n        var cls = 'scard';\n        if (live) cls += (c.bin === b.id ? ' ok' : ' bad');\n        else if (st.marks) cls += (c.bin === b.id ? ' ok' : ' bad');\n        h += '<button class=\"' + cls + '\" data-placed=\"' + c.id + '\">' + esc(c.t) + '<\/button>';\n      });\n      h += '<\/div><\/div>';\n    });\n    h += '<\/div>' + (live ? '' : '<div class=\"row-btns\"><button class=\"btn alt\" id=\"rs\">Ulangi<\/button><button class=\"btn\" id=\"ck\">Periksa<\/button><\/div>') +\n         '<div class=\"msg\" id=\"msg\"><\/div>';\n    stage.innerHTML = h;\n    document.getElementById('msg').textContent = st.msg;\n    var rs = document.getElementById('rs');\n    if (rs) rs.onclick = function(){ if (st.done) return; st.place = {}; st.sel = null; st.msg = ''; st.marks = null; draw(); };\n    var ck = document.getElementById('ck');\n    if (ck) ck.onclick = check;\n  }\n  function allPlaced(){ return cards.every(function(c){ return st.place[c.id]; }); }\n  function allRight(){ return cards.every(function(c){ return st.place[c.id] === c.bin; }); }\n\n  stage.addEventListener('click', function(e){\n    if (st.done) return;\n    var c = e.target.closest('#pool [data-id]');\n    if (c) { st.sel = (st.sel === c.dataset.id) ? null : c.dataset.id; draw(); return; }\n    var bin = e.target.closest('[data-bin]');\n    var pc = e.target.closest('[data-placed]');\n    if (pc && !st.sel) { delete st.place[pc.dataset.placed]; st.msg = ''; st.marks = null; draw(); return; }\n    if (bin && st.sel) {\n      var card = byId[st.sel];\n      st.place[card.id] = bin.dataset.bin;\n      if (live && card.bin !== bin.dataset.bin) st.mistakes++;\n      st.sel = null; st.msg = ''; st.marks = null;\n      draw();\n      if (live) {\n        if (allRight()) finish();\n        else if (allPlaced()) { st.msg = 'Tap kartu yang merah untuk memindahkannya, lalu coba lagi.'; draw(); }\n      }\n    }\n  });\n  function check(){\n    if (st.done) return;\n    if (!allPlaced()) { st.msg = 'Pasang semua kartu dulu.'; draw(); return; }\n    st.checks++;\n    var ok = cards.filter(function(c){ return st.place[c.id] === c.bin; }).length;\n    if (ok === cards.length) { finish(); return; }\n    st.marks = true;\n    st.msg = ok + ' dari ' + cards.length + ' kartu sudah di tempat yang benar.';\n    draw();\n  }\n  function finish(){\n    if (st.done) return;\n    st.done = true;\n    cfg.onDone({mistakes:st.mistakes, checks:st.checks});\n  }\n  draw();\n}\n\n/* ===================== Komponen dan Cloud ===================== */\nvar K4_PERQ = 25;   /* detik per soal di Level 3 */\n/* Data soal disalin dari TAMBAH_GAME_MANTI_3_4.md. */\n/* helper kuis: bentuk satu soal untuk runQuiz. Kunci opsi berupa huruf. */\nfunction mkQ(ctx, prompt, optTexts, ansText, why, fixed){\n  var texts = fixed ? optTexts.slice() : shuffle(optTexts);\n  var opts = texts.map(function(t, i){ return {k:String.fromCharCode(97 + i), t:t}; });\n  var hit = opts.filter(function(o){ return o.t === ansText; });\n  if (hit.length !== 1) throw new Error('Jawaban tidak ditemukan tepat satu kali: ' + ansText);\n  return {ctx:ctx, prompt:prompt, opts:opts, ans:hit[0].k, why:why};\n}\n\nvar K4_BINS = [\n  {id:'hardware',  label:'Hardware',            short:'Hardware'},\n  {id:'software',  label:'Software',            short:'Software'},\n  {id:'jaringan',  label:'Jaringan Komputer',   short:'Jaringan Komputer'},\n  {id:'data',      label:'Data',                short:'Data'},\n  {id:'fasilitas', label:'Fasilitas Fisik',     short:'Fasilitas Fisik'},\n  {id:'cloud',     label:'Platform Cloud',      short:'Platform Cloud'},\n  {id:'keamanan',  label:'Keamanan Informasi',  short:'Keamanan Informasi'},\n  {id:'storage',   label:'Storage dan Backup',  short:'Storage dan Backup'}\n];\n/* Level 1: ambil 1 acak per komponen (8 kartu). Variasi sengaja dipilih supaya tidak ambigu antar komponen. */\nvar K4_KOMP = {\n  hardware: ['Server', 'Komputer'],\n  software: ['Sistem operasi', 'Aplikasi bisnis', 'Middleware'],\n  jaringan: ['LAN dan WAN', 'Koneksi internet'],\n  data:     ['Database', 'File sistem', 'Data warehouse'],\n  fasilitas:['Ruang server', 'UPS', 'Sistem pendingin'],\n  cloud:    ['Layanan komputasi berbasis internet yang tersedia on-demand', 'Layanan infrastruktur, platform, dan aplikasi lewat internet'],\n  keamanan: ['Firewall', 'Antivirus', 'Enkripsi', 'Sistem deteksi intrusi'],\n  storage:  ['SAN', 'NAS', 'Solusi backup']\n};\nfunction k4L1Cards(){\n  return K4_BINS.map(function(b, i){ return {id:'c' + i, t:pick(K4_KOMP[b.id]), bin:b.id}; });\n}\n\n/* Level 2: dua ronde sortir, 2 kartu acak per kotak (6 kartu per ronde). */\nvar K4_LAYANAN_BINS = [\n  {id:'iaas', label:'IaaS', sub:'Infrastructure as a Service', short:'IaaS'},\n  {id:'paas', label:'PaaS', sub:'Platform as a Service',       short:'PaaS'},\n  {id:'saas', label:'SaaS', sub:'Software as a Service',       short:'SaaS'}\n];\nvar K4_LAYANAN = {\n  iaas:['Server virtual, storage, dan jaringan disewa dari penyedia', 'Pengguna mengelola sendiri OS dan aplikasinya', 'Migrasi data center ke cloud'],\n  paas:['Platform pengembangan aplikasi tanpa kelola infrastruktur', 'Developer membangun aplikasi tanpa mengurus server atau jaringan', 'Platform untuk mengembangkan dan menjalankan aplikasi di cloud'],\n  saas:['Aplikasi siap pakai lewat internet, misalnya email', 'CRM yang siap dipakai lewat internet', 'Pengguna tinggal memakai aplikasi tanpa mengelola infrastruktur dan platformnya']\n};\nvar K4_DEPLOY_BINS = [\n  {id:'public',  label:'Public cloud',  short:'Public cloud'},\n  {id:'private', label:'Private cloud', short:'Private cloud'},\n  {id:'hybrid',  label:'Hybrid cloud',  short:'Hybrid cloud'}\n];\nvar K4_DEPLOY = {\n  public: ['Infrastruktur dimiliki dan dikelola provider', 'Biaya rendah dan skalabilitas tinggi', 'Cocok untuk startup'],\n  private:['Infrastruktur khusus untuk satu organisasi', 'Kontrol penuh dan keamanan tinggi', 'Ideal untuk data sensitif'],\n  hybrid: ['Gabungan public dan private cloud yang terintegrasi', 'Workload dapat dipindahkan sesuai kebutuhan', 'Cocok untuk kebutuhan dinamis dan regulasi ketat']\n};\nfunction k4SortCards(pool){\n  var out = [], n = 0;\n  Object.keys(pool).forEach(function(bin){\n    shuffle(pool[bin]).slice(0, 2).forEach(function(t){ out.push({id:'c' + (n++), t:t, bin:bin}); });\n  });\n  return out;\n}\n\n/* Level 3: bank soal, 1 soal dari tiap 8 keluarga. a = jawaban benar, o = opsi khusus, w = penjelasan. */\nvar K4_OPTS = {\n  cloudchar:['On-Demand Self-Service', 'Broad Network Access', 'Resource Pooling', 'Rapid Elasticity', 'Measured Service'],\n  tren:['Platform Digital Seluler', 'Grid Computing', 'Hardware Virtualization', 'Prosesor Hemat Daya'],\n  evolusi:['Era Mainframe (1970-1980)', 'Era PC/LAN (1980-1990)', 'Era Internet (1990-2000)', 'Era Virtualisasi (2000-2010)', 'Era Cloud Computing dan Mobile (2010-2020)'],\n  definisi si ini dari ITIL 4.'},\n    {p:'Infrastruktur TI adalah komponen sistem yang menyediakan fondasi untuk membangun, menyampaikan, dan mengelola layanan TI bagi pelanggan, mitra, dan karyawan.', a:'Gartner', w:'Definisi ini dari Gartner.'}\n  ],\n  komponen:[\n    {p:'Ruang server mati total karena listrik padam dan tidak ada UPS.', a:'Fasilitas Fisik', o:['Fasilitas Fisik', 'Software', 'Data', 'Platform Cloud'], w:'Data center, ruang server, sistem pendingin, dan UPS termasuk Fasilitas Fisik.'},\n    {p:'Data survei tidak bisa dipulihkan karena tidak ada solusi backup.', a:'Storage dan Backup', o:['Storage dan Backup', 'Jaringan Komputer', 'Software', 'Fasilitas Fisik'], w:'SAN, NAS, dan solusi backup menjamin ketersediaan dan pemulihan data.'},\n    {p:'Akses tidak sah ke server diblokir oleh firewall dan sistem deteksi intrusi.', a:'Keamanan Informasi', o:['Keamanan Informasi', 'Hardware', 'Data', 'Platform Cloud'], w:'Firewall, antivirus, enkripsi, dan sistem deteksi intrusi termasuk Keamanan Informasi.'},\n    {p:'Sistem operasi, aplikasi bisnis, dan middleware yang menjalankan layanan.', a:'Software', o:['Software', 'Hardware', 'Data', 'Jaringan Komputer'], w:'Sistem operasi, aplikasi bisnis, middleware, dan perangkat lunak pendukung termasuk Software.'},\n    {p:'Database, file sistem, dan data warehouse organisasi.', a:'Data', o:['Data', 'Hardware', 'Jaringan Komputer', 'Fasilitas Fisik'], w:'Aset informasi yang dikelola, disimpan, dan diproses termasuk database, file sistem, dan data warehouse.'}\n  ],\n  layanan:[\n    {p:'Sebuah instansi memindahkan data center ke cloud dan mengelola sendiri OS dan aplikasinya.', a:'IaaS', w:'IaaS menyediakan infrastruktur dasar, sedangkan pengguna mengelola OS dan aplikasi sendiri. Cocok untuk migrasi data center.'},\n    {p:'Tim developer membangun aplikasi tanpa harus mengelola infrastruktur.', a:'PaaS', w:'PaaS adalah platform pengembangan aplikasi tanpa kelola infrastruktur.'},\n    {p:'Pegawai memakai email dan CRM siap pakai lewat internet.', a:'SaaS', w:'SaaS adalah aplikasi siap pakai lewat internet, misalnya email dan CRM.'}\n  ],\n  deployment:[\n    {p:'Sebuah startup butuh biaya rendah dan skalabilitas tinggi.', a:'Public cloud', w:'Public cloud: infrastruktur dimiliki provider, biaya rendah, skalabilitas tinggi, cocok untuk startup.'},\n    {p:'Data sensitif yang butuh kontrol penuh dan keamanan tinggi.', a:'Private cloud', w:'Private cloud: infrastruktur khusus organisasi, kontrol penuh, keamanan tinggi, ideal untuk data sensitif.'},\n    {p:'Organisasi dengan kebutuhan dinamis dan regulasi ketat ingin memindahkan workload sesuai kebutuhan.', a:'Hybrid cloud', w:'Hybrid cloud menggabungkan public dan private cloud secara terintegrasi, dengan workload yang dapat dipindahkan.'}\n  ],\n  teknis:[\n    {p:'Pada diagram Virtualization vs Containerization, model mana yang menjalankan container lewat Container Engine di atas Host OS, tanpa Guest OS pada tiap instans?', a:'Containerized',\n     o:['Bare Metal', 'Virtualized', 'Containerized', 'Containerized on Virtualized'], fixed:true,\n     w:'Pada Containerized, container berbagi Host OS lewat Container Engine. Pada Virtualized dan Containerized on Virtualized, ada Guest OS di dalam VM.'},\n    {p:'Pada model Virtualized, lapisan apa yang menjalankan beberapa VM di atas server fisik?', a:'Hypervisor',\n     o:['Hypervisor', 'Container Engine', 'Middleware', 'Data warehouse'],\n     w:'Hypervisor menjalankan beberapa VM, masing-masing dengan Guest OS sendiri.'},\n    {p:'Pada studi kasus MLOps, tim mengumpulkan dan membersihkan data historis, misalnya data inflasi bulanan. Fase apa ini?', a:'Data preparation', o:K4_MLOPS, fixed:true,\n     w:'Fase 1 MLOps: data preparation, yaitu mengumpulkan dan membersihkan data historis.'},\n    {p:'Tim melatih model machine learning dengan algoritma time-series. Fase MLOps apa ini?', a:'Training model', o:K4_MLOPS, fixed:true,\n     w:'Fase 2 MLOps: training model.'},\n    {p:'Model dipublikasikan lewat API endpoint, dashboard internal, aplikasi mobile, atau laporan otomatis. Fase MLOps apa ini?', a:'Deployment', o:K4_MLOPS, fixed:true,\n     w:'Fase 4 MLOps: deployment, dengan keluaran seperti API endpoint, dashboard internal, aplikasi mobile, dan laporan otomatis.'},\n    {p:'Model dilatih ulang saat data baru tersedia supaya tetap akurat. Fase MLOps apa ini?', a:'Retraining otomatis', o:K4_MLOPS, fixed:true,\n     w:'Fase 6 MLOps: retraining otomatis agar model tetap akurat.'}\n  ]\n};\nfunction k4Bank(fam){\n  var e = pick(K4_BANK[fam]);\n  var opts = e.o || K4_OPTS[fam];\n  var fixed = e.fixed !== undefined ? e.fixed : !!K4_FIXED[fam];\n  return K4_ASK[fam] ? mkQ(e.p, K4_ASK[fam], opts, e.a, e.w, fixed) : mkQ(null, e.p, opts, e.a, e.w, fixed);\n}\n/* 8 soal: tepat 1 dari tiap keluarga, lalu diacak. */\nfunction k4BuildL3(){\n  return shuffle(['cloudchar', 'tren', 'evolusi', 'definisi', 'komponen', 'layanan', 'deployment', 'teknis'].map(k4Bank));\n}\n\n\nGAME = {\n  key:'komponencloud', title:'Komponen dan Cloud', emoji:'☁️',\n  intro:'Kenali komponen infrastruktur TI, model layanan cloud, dan contoh penerapannya di BPS.',\n  levels:[['Mudah','Cocokkan 8 contoh ke 8 komponen infrastruktur TI'],\n          ['Sedang','Sortir model layanan (IaaS, PaaS, SaaS), lalu model deployment cloud'],\n          ['Sulit','8 soal skenario acak dari seluruh materi (' + K4_PERQ + ' detik per soal)']],\n  foot:'Rujukan: Slide Manajemen Infrastruktur TI hal. 5-19.',\n  start:function(level){\n    if (level === 1) {\n      runSorter({level:1, title:levelTitle(1), feedback:'live', bins:K4_BINS, cards:k4L1Cards(),\n        task:'Tap contoh, lalu tap komponen infrastruktur TI yang tepat. Tap kartu di kotak untuk memindahkannya.',\n        onDone:function(r){\n          var s = starsLow(r.mistakes, 1, 4); saveBest(1, s);\n          showResult({level:1, stars:s, title:'Semua komponen tepat!', text: s === 3 ? 'Rapi. Delapan komponen sudah hafal.' : 'Berhasil. Ulangi untuk lebih tepat.', stats:['Salah letak: ' + r.mistakes]});\n        }});\n    } else if (level === 2) {\n      var checks = 0;\n      var round2 = function(){\n        runSorter({level:2, title:levelTitle(2) + ' (2/2)', feedback:'check', bins:K4_DEPLOY_BINS, cards:k4SortCards(K4_DEPLOY),\n          task:'Tempatkan 6 ciri ke model deployment cloud yang tepat, lalu tap Periksa.',\n          onDone:function(r){\n            checks += r.checks;\n            var s = starsLow(checks, 2, 4); saveBest(2, s);\n            showResult({level:2, stars:s, title:'Dua ronde selesai!', text: s === 3 ? 'Rapi. Model layanan dan deployment cloud sudah lancar.' : 'Berhasil. Ulangi supaya sekali jalan.', stats:['Pemeriksaan: ' + checks + 'x']});\n          }});\n      };\n      runSorter({level:2, title:levelTitle(2) + ' (1/2)', feedback:'check', bins:K4_LAYANAN_BINS, cards:k4SortCards(K4_LAYANAN),\n        task:'Tempatkan 6 ciri ke model layanan cloud yang tepat, lalu tap Periksa.',\n        onDone:function(r){ checks = r.checks; round2(); }});\n    } else {\n      runQuiz({level:3, title:levelTitle(3), qs:k4BuildL3(), perQ:K4_PERQ,\n        finish:function(score, total){\n          var s = starsBy(score, 7, 5, 3); saveBest(3, s);\n          showResult({level:3, stars:s, title:'Skor ' + score + ' dari ' + total,\n            text: s === 3 ? 'Hampir sempurna. Komponen, cloud, dan tren sudah dikuasai.' : (s >= 1 ? 'Bagus. Ulangi dan perhatikan karakteristik cloud serta model layanan.' : 'Ulangi dulu Level 1 dan 2, lalu coba lagi.'),\n            stats:[]});\n        }});\n    }\n  }\n};\nshowMenu();\n\n<\/script>\n<\/body>\n<\/html>\n"},
  {key:'lifecycle', title:'Sortir Lifecycle', emoji:'♻️', tema:'Man TI', slide:'20-21', desc:'Kelompokkan kegiatan ke fase lifecycle aset TI.', html:"<!DOCTYPE html>\n<html lang=\"id\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Sortir Lifecycle<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&display=swap\" rel=\"stylesheet\">\n<style>\n:root{\n  box-sizing:border-box;\n  padding-top:env(safe-area-inset-top,0px);\n  padding-bottom:env(safe-area-inset-bottom,0px);\n  --bg:#FFF9F3; --card:#FFFFFF; --ink:#182255; --muted:#566086;\n  --accent:#F79039; --accent-2:#FEBD26;\n  --peach:#FCDDC2; --peach-2:#FBCCA4; --line:#F3D3B6;\n  --ok:#14805A; --ok-bg:#DDF4EA; --bad:#C23A3A; --bad-bg:#FBE1E1;\n  --term:#101636; --term-ink:#D9F7E8;\n}\n@media (prefers-color-scheme: dark){\n  :root:not([data-theme=\"light\"]){\n    --bg:#121731; --card:#1B2347; --ink:#F4EFE8; --muted:#AAB1D3;\n    --peach:#2A3263; --peach-2:#36407A; --line:#3A4580;\n    --ok:#4CD6A0; --ok-bg:#12382C; --bad:#FF8A8A; --bad-bg:#44202A;\n    --term:#0A0E24;\n  }\n}\n:root[data-theme=\"dark\"]{\n  --bg:#121731; --card:#1B2347; --ink:#F4EFE8; --muted:#AAB1D3;\n  --peach:#2A3263; --peach-2:#36407A; --line:#3A4580;\n  --ok:#4CD6A0; --ok-bg:#12382C; --bad:#FF8A8A; --bad-bg:#44202A;\n  --term:#0A0E24;\n}\nhtml{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}\n*,*::before,*::after{box-sizing:inherit}\nbody{margin:0;min-height:100%;background:var(--bg);color:var(--ink);\n  font-family:Arial,\"Helvetica Neue\",sans-serif;font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}\nh1,h2,h3{font-family:Montserrat,Arial,sans-serif;margin:0;line-height:1.2}\nbutton{font:inherit;color:inherit;cursor:pointer}\nbutton:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent-2);outline-offset:2px}\n.app{max-width:720px;margin:0 auto;padding:16px 14px 28px}\n\n/* menu */\n.hero{background:var(--accent);color:#fff;border-radius:22px;padding:22px 20px 20px;position:relative;overflow:hidden}\n.hero h1{font-size:clamp(26px,7vw,34px);font-weight:800;color:#fff;padding-right:84px}\n.hero p{margin:8px 0 0;color:#FFF3E6;padding-right:84px}\n.hero .decor{position:absolute;right:14px;top:14px;font-size:58px;line-height:1;transform:rotate(-6deg)}\n.levels{display:grid;gap:12px;margin-top:16px}\n.lvl{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;text-align:left;\n  background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px 16px;width:100%}\n.lvl:hover{border-color:var(--accent)}\n.lvl .no{width:46px;height:46px;border-radius:50%;background:var(--peach);display:grid;place-items:center;\n  font-family:Montserrat,Arial,sans-serif;font-weight:800;font-size:20px}\n.lvl h2{font-size:17px}\n.lvl p{margin:3px 0 0;color:var(--muted);font-size:14px}\n.stars{font-size:20px;letter-spacing:2px;color:var(--accent-2);white-space:nowrap}\n.stars .off{color:var(--line)}\n.foot{margin-top:18px;color:var(--muted);font-size:13px}\n\n/* bar */\n.bar{display:flex;align-items:center;gap:10px;margin-bottom:12px}\n.back{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:8px 12px;font-weight:700}\n.bar h2{font-size:18px;flex:1}\n.chip{background:var(--peach);border-radius:999px;padding:6px 14px;font-weight:700;font-size:14px;white-space:nowrap}\n.chip.warn{background:var(--bad-bg);color:var(--bad)}\n.chip.good{background:var(--ok-bg);color:var(--ok)}\n.status{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}\n.task{background:var(--peach);border-radius:14px;padding:12px 14px;margin-bottom:12px;font-size:15.5px}\n.hint{margin:0 0 12px;color:var(--muted);font-size:14.5px}\n.btn{border:0;border-radius:14px;padding:12px 18px;font-weight:700;background:var(--accent);color:#fff;flex:1}\n.btn.alt{background:var(--card);color:var(--ink);border:2px solid var(--line)}\n.btn.dark{background:var(--ink);color:var(--bg)}\n.btn:disabled{opacity:.5;cursor:default}\n.row-btns{display:flex;gap:10px;margin-top:14px}\n.msg{margin-top:12px;min-height:22px;font-weight:700;text-align:center}\n\n/* quiz */\n.qcard{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px}\n.qcard h3{font-size:17px;margin-bottom:6px}\n.ctx{margin:0 0 10px;font-size:15px}\n.clue{background:var(--peach);border-radius:12px;padding:10px 12px;margin:0 0 10px;font-size:14.5px}\n.clue b{display:block;margin-bottom:2px}\n.opts{display:grid;gap:10px;margin-top:12px}\n.opts.cols2{grid-template-columns:1fr 1fr}\n.opt{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:12px 14px;text-align:left;font-weight:700;font-size:15px}\n.opt:hover:not(:disabled){border-color:var(--accent)}\n.opt.right{background:var(--ok-bg);border-color:var(--ok)}\n.opt.wrong{background:var(--bad-bg);border-color:var(--bad)}\n.fb{margin-top:14px;border-radius:14px;padding:12px 14px;font-size:14.5px}\n.fb.ok{background:var(--ok-bg)} .fb.bad{background:var(--bad-bg)}\n.fb b{display:block;margin-bottom:2px}\n\n/* sorter */\n.spool{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:6px 0 8px;margin-bottom:8px}\n.spool .box{border:2px dashed var(--line);border-radius:16px;background:var(--card);padding:8px;display:flex;flex-wrap:wrap;gap:6px;\n  justify-content:center;max-height:34vh;overflow:auto;min-height:56px;align-items:center}\n.scard{border:2px solid var(--peach-2);background:var(--peach);border-radius:12px;padding:7px 11px;font-weight:700;font-size:14px;text-align:left}\n.scard.sel{outline:3px solid var(--accent-2);transform:translateY(-2px);border-color:var(--accent)}\n.scard.ok{background:var(--ok-bg);border-color:var(--ok)}\n.scard.bad{background:var(--bad-bg);border-color:var(--bad)}\n.spool .empty{color:var(--muted);font-size:14px}\n.bin{border:2px solid var(--line);background:var(--card);border-radius:16px;padding:9px 11px 10px;margin-bottom:8px;cursor:pointer}\n.bin.target{border-color:var(--accent);background:var(--peach)}\n.bin .bl{font-weight:800;font-size:14.5px}\n.bin .bs{font-weight:400;color:var(--muted);font-size:12.5px;margin-left:6px}\n.bin .items{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;min-height:6px}\n\n/* order */\n.slots{display:grid;gap:8px}\n.slot{display:flex;gap:10px;align-items:stretch;min-height:46px}\n.slot .n{flex:0 0 34px;border-radius:10px;background:var(--peach);display:grid;place-items:center;font-weight:800}\n.slot .c{flex:1;border:2px dashed var(--line);border-radius:12px;padding:8px 12px;display:flex;align-items:center;text-align:left;\n  background:var(--card);font-size:14.5px;min-height:46px}\n.slot .c.filled{border-style:solid;border-color:var(--peach-2);background:var(--peach);font-weight:700;cursor:pointer}\n.slot .c.locked{background:var(--card);border-color:var(--ink);cursor:default}\n.slot .c.ok{background:var(--ok-bg);border-color:var(--ok)}\n.slot .c.bad{background:var(--bad-bg);border-color:var(--bad)}\n.slot .lab{display:block;font-size:12px;color:var(--muted);font-weight:400}\n.opool{margin-top:12px;display:grid;gap:8px;padding:10px;border:2px dashed var(--line);border-radius:16px;background:var(--card)}\n.opool.g2{grid-template-columns:1fr 1fr}\n.ocard{border:2px solid var(--peach-2);background:var(--peach);border-radius:12px;padding:9px 12px;font-weight:700;font-size:14px;text-align:left}\n.opool .empty{color:var(--muted);font-size:14px;grid-column:1/-1;text-align:center}\n.reveal{margin-top:12px;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 14px}\n.reveal ol{margin:6px 0 0;padding-left:20px}\n.reveal li{margin-bottom:6px;font-size:14.5px}\n\n/* result */\n.result{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:24px 18px;text-align:center}\n.result .stars{font-size:46px;margin:6px 0 4px}\n.result h2{font-size:22px}\n.result p{color:var(--muted);margin:6px auto 0;max-width:44ch}\n.stat{display:flex;justify-content:center;gap:10px;margin:14px 0 4px;flex-wrap:wrap}\n.stat span{background:var(--peach);border-radius:999px;padding:6px 14px;font-weight:700;font-size:14px}\n.result .row-btns{flex-wrap:wrap}\n.result .row-btns .btn{min-width:130px}\n.extra{margin-top:14px;text-align:left}\n.note{margin-top:14px;font-size:12.5px;color:var(--muted);text-align:left}\n@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}\n\n\n<\/style>\n<\/head>\n<body>\n<div class=\"app\" id=\"view\"><\/div>\n<script>\n/* ===================== util umum ===================== */\nvar GAME = null;\nvar view = document.getElementById('view');\nvar timerId = null;\nfunction clearTimer(){ if (timerId){ clearInterval(timerId); timerId = null; } }\nfunction shuffle(a){\n  a = a.slice();\n  for (var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }\n  return a;\n}\nfunction pick(a){ return a[Math.floor(Math.random()*a.length)]; }\nfunction esc(s){ return String(s).replace(/&/g,'&amp;').replace(/<\/g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;'); }\nfunction eqArr(a,b){ if (a.length !== b.length) return false; for (var i=0;i<a.length;i++){ if (a[i]!==b[i]) return false; } return true; }\n\nfunction loadBest(){\n  try { var r = localStorage.getItem('best_' + GAME.key); if (r) return JSON.parse(r); } catch(e){}\n  return {1:0,2:0,3:0};\n}\nfunction saveBest(level, stars){\n  try {\n    var b = loadBest();\n    if (stars > (b[level]||0)) { b[level] = stars; localStorage.setItem('best_' + GAME.key, JSON.stringify(b)); }\n  } catch(e){}\n}\nfunction starsHTML(n){\n  var s = '<span class=\"stars\" aria-label=\"' + n + ' dari 3 bintang\">';\n  for (var i=1;i<=3;i++) s += i<=n ? '★' : '<span class=\"off\">★<\/span>';\n  return s + '<\/span>';\n}\nfunction barHTML(title, chip){\n  return '<div class=\"bar\"><button class=\"back\" id=\"bk\">&larr; Menu<\/button><h2>' + title + '<\/h2>' + (chip||'') + '<\/div>';\n}\nfunction bindBack(){ var b = document.getElementById('bk'); if (b) b.onclick = showMenu; }\nfunction levelTitle(n){ return 'Level ' + n + ': ' + ['Mudah','Sedang','Sulit'][n-1]; }\n\n/* ===================== menu ===================== */\nfunction showMenu(){\n  clearTimer();\n  var best = loadBest(), h = '';\n  h += '<div class=\"hero\"><div class=\"decor\" aria-hidden=\"true\">' + GAME.emoji + '<\/div><h1>' + GAME.title + '<\/h1><p>' + GAME.intro + '<\/p><\/div><div class=\"levels\">';\n  GAME.levels.forEach(function(l, i){\n    h += '<button class=\"lvl\" data-l=\"' + (i+1) + '\"><span class=\"no\">' + (i+1) + '<\/span><span><h2>' + l[0] + '<\/h2><p>' + l[1] + '<\/p><\/span>' + starsHTML(best[i+1]||0) + '<\/button>';\n  });\n  h += '<\/div><p class=\"foot\">Semua level terbuka. Mulai dari mana saja. ' + GAME.foot + '<\/p>';\n  view.innerHTML = h;\n  Array.prototype.forEach.call(view.querySelectorAll('.lvl'), function(b){\n    b.addEventListener('click', function(){ GAME.start(+b.dataset.l); });\n  });\n}\n\n/* ===================== hasil ===================== */\nfunction showResult(r){\n  clearTimer();\n  var h = '<div class=\"result\">' + starsHTML(r.stars) + '<h2>' + r.title + '<\/h2><p>' + r.text + '<\/p>';\n  if (r.stats && r.stats.length) h += '<div class=\"stat\">' + r.stats.map(function(s){ return '<span>' + s + '<\/span>'; }).join('') + '<\/div>';\n  if (r.extra) h += '<div class=\"extra\">' + r.extra + '<\/div>';\n  h += '<div class=\"row-btns\"><button class=\"btn alt\" id=\"rm\">Menu<\/button><button class=\"btn\" id=\"ra\">Main lagi<\/button>' +\n       (r.level < 3 && r.stars > 0 ? '<button class=\"btn dark\" id=\"rn\">Level ' + (r.level+1) + '<\/button>' : '') + '<\/div>';\n  if (r.note) h += '<p class=\"note\">' + r.note + '<\/p>';\n  view.innerHTML = h + '<\/div>';\n  document.getElementById('rm').onclick = showMenu;\n  document.getElementById('ra').onclick = function(){ GAME.start(r.level); };\n  var rn = document.getElementById('rn');\n  if (rn) rn.onclick = function(){ GAME.start(r.level + 1); };\n}\nfunction starsBy(v, hi, mid, lo){ return v >= hi ? 3 : (v >= mid ? 2 : (v >= lo ? 1 : 0)); }\nfunction starsLow(v, a, b){ return v <= a ? 3 : (v <= b ? 2 : 1); }   /* makin kecil makin baik */\n\n/* ===================== komponen: kuis pilihan ===================== */\n/* cfg: {level,title,qs:[{ctx,clue,cluelabel,prompt,opts:[{k,t,fb}],ans,why}],perQ,cols,finish(score,total)} */\nfunction runQuiz(cfg){\n  clearTimer();\n  var qs = cfg.qs, idx = 0, score = 0, answered = false, left = 0;\n  function render(){\n    clearTimer(); answered = false;\n    var q = qs[idx];\n    var h = barHTML(cfg.title, '<span class=\"chip\">Soal ' + (idx+1) + '/' + qs.length + '<\/span>');\n    h += '<div class=\"status\"><span class=\"chip\">Skor: ' + score + '<\/span>' + (cfg.perQ ? '<span class=\"chip\" id=\"tchip\">' + cfg.perQ + ' dtk<\/span>' : '') + '<\/div>';\n    h += '<div class=\"qcard\">';\n    if (q.ctx) h += '<p class=\"ctx\">' + q.ctx + '<\/p>';\n    if (q.clue) h += '<div class=\"clue\"><b>' + (q.cluelabel || 'Temuan') + '<\/b>' + q.clue + '<\/div>';\n    h += '<h3>' + q.prompt + '<\/h3><div class=\"opts' + (cfg.cols === 2 ? ' cols2' : '') + '\">';\n    q.opts.forEach(function(o){ h += '<button class=\"opt\" data-k=\"' + o.k + '\">' + o.t + '<\/button>'; });\n    h += '<\/div><div id=\"fb\"><\/div><\/div>';\n    view.innerHTML = h;\n    bindBack();\n    Array.prototype.forEach.call(view.querySelectorAll('.opt'), function(b){\n      b.addEventListener('click', function(){ answer(b.dataset.k); });\n    });\n    if (cfg.perQ) {\n      left = cfg.perQ;\n      timerId = setInterval(function(){\n        left--;\n        var c = document.getElementById('tchip');\n        if (c) { c.textContent = left + ' dtk'; c.className = 'chip' + (left <= 5 ? ' warn' : ''); }\n        if (left <= 0) { clearTimer(); answer(null); }\n      }, 1000);\n    }\n  }\n  function answer(k){\n    if (answered) return;\n    answered = true; clearTimer();\n    var q = qs[idx];\n    var right = (k !== null && String(k) === String(q.ans));\n    if (right) score++;\n    var chosen = null, correct = null;\n    q.opts.forEach(function(o){ if (String(o.k) === String(k)) chosen = o; if (String(o.k) === String(q.ans)) correct = o; });\n    Array.prototype.forEach.call(view.querySelectorAll('.opt'), function(b){\n      b.disabled = true;\n      if (String(b.dataset.k) === String(q.ans)) b.classList.add('right');\n      else if (k !== null && b.dataset.k === String(k)) b.classList.add('wrong');\n    });\n    var txt = '';\n    if (k === null) txt += 'Waktu habis. ';\n    if (!right && chosen && chosen.fb) txt += chosen.fb + ' ';\n    if (!right && correct) txt += 'Jawaban tepat: ' + correct.t + '. ';\n    if (right && correct && correct.fb) txt += correct.fb + ' ';\n    if (q.why) txt += q.why;\n    var last = idx === qs.length - 1;\n    document.getElementById('fb').innerHTML =\n      '<div class=\"fb ' + (right ? 'ok' : 'bad') + '\"><b>' + (right ? 'Benar' : (k === null ? 'Waktu habis' : 'Belum tepat')) + '<\/b>' + txt + '<\/div>' +\n      '<div class=\"row-btns\"><button class=\"btn\" id=\"nx\">' + (last ? 'Lihat hasil' : 'Lanjut') + '<\/button><\/div>';\n    var nx = document.getElementById('nx');\n    nx.onclick = function(){ if (last) cfg.finish(score, qs.length); else { idx++; render(); } };\n    nx.focus();\n  }\n  render();\n}\n\n/* ===================== komponen: urutkan ===================== */\n/* cfg: {level,title,task,items:[{id,t}] (urutan benar),labels,locked:[idx],feedback:'live'|'marks'|'count',timer,g2,reveal,\n         onDone(res),onTimeout(res)} */\nfunction runOrder(cfg){\n  clearTimer();\n  var items = cfg.items, n = items.length, byId = {};\n  items.forEach(function(it){ byId[it.id] = it; });\n  var st = {slots:[], locked:{}, done:false, mistakes:0, checks:0, left:cfg.timer || 0, msg:'', marks:null};\n  for (var i=0;i<n;i++) st.slots.push(null);\n  (cfg.locked || []).forEach(function(i){ st.slots[i] = items[i].id; st.locked[i] = true; });\n  var poolOrder = shuffle(items.map(function(it){ return it.id; })).filter(function(id){ return st.slots.indexOf(id) < 0; });\n  var fbk = cfg.feedback;\n\n  view.innerHTML = barHTML(cfg.title, '') + '<div id=\"stage\"><\/div>';\n  bindBack();\n  var stage = document.getElementById('stage');\n\n  function chipHTML(){\n    if (cfg.timer) return '<span class=\"chip\" id=\"tchip\">' + st.left + ' dtk<\/span>';\n    if (fbk === 'live') return '<span class=\"chip\" id=\"mchip\">Salah: ' + st.mistakes + '<\/span>';\n    return '<span class=\"chip\" id=\"mchip\">Periksa: ' + st.checks + 'x<\/span>';\n  }\n  function draw(){\n    var h = '<div class=\"status\">' + chipHTML() + '<\/div><div class=\"task\">' + cfg.task + '<\/div><div class=\"slots\" id=\"slots\">';\n    for (var i=0;i<n;i++){\n      var id = st.slots[i], cls = 'c';\n      if (id) {\n        cls += st.locked[i] ? ' locked' : ' filled';\n        if (!st.locked[i]) {\n          if (fbk === 'live') cls += (id === items[i].id ? ' ok' : ' bad');\n          else if (st.marks) cls += (st.marks[i] ? ' ok' : ' bad');\n        }\n      }\n      h += '<div class=\"slot\" data-i=\"' + i + '\"><div class=\"n\">' + (i+1) + '<\/div><div class=\"' + cls + '\">';\n      if (id) h += '<span>' + (cfg.labels && cfg.showLabels ? '<span class=\"lab\">' + cfg.labels[i] + '<\/span>' : '') + esc(byId[id].t) + (st.locked[i] ? ' <span class=\"lab\" style=\"display:inline\">(terkunci)<\/span>' : '') + '<\/span>';\n      else h += '<span class=\"lab\" style=\"color:var(--muted)\">Tap kartu di bawah<\/span>';\n      h += '<\/div><\/div>';\n    }\n    h += '<\/div><div class=\"opool' + (cfg.g2 ? ' g2' : '') + '\" id=\"opool\">';\n    var inPool = poolOrder.filter(function(id){ return st.slots.indexOf(id) < 0; });\n    if (!inPool.length) h += '<span class=\"empty\">Semua kartu sudah dipasang<\/span>';\n    inPool.forEach(function(id){ h += '<button class=\"ocard\" data-id=\"' + id + '\">' + esc(byId[id].t) + '<\/button>'; });\n    h += '<\/div><div class=\"row-btns\"><button class=\"btn alt\" id=\"rs\">Ulangi<\/button>' +\n         (fbk !== 'live' ? '<button class=\"btn\" id=\"ck\">Periksa<\/button>' : '') + '<\/div><div class=\"msg\" id=\"msg\"><\/div>';\n    stage.innerHTML = h;\n    document.getElementById('msg').textContent = st.msg;\n    document.getElementById('rs').onclick = function(){\n      if (st.done) return;\n      for (var i=0;i<n;i++) if (!st.locked[i]) st.slots[i] = null;\n      st.msg = ''; st.marks = null; draw();\n    };\n    var ck = document.getElementById('ck');\n    if (ck) ck.onclick = check;\n  }\n  function firstEmpty(){ for (var i=0;i<n;i++) if (st.slots[i] === null) return i; return -1; }\n  function allCorrect(){ for (var i=0;i<n;i++) if (st.slots[i] !== items[i].id) return false; return true; }\n\n  stage.addEventListener('click', function(e){\n    if (st.done) return;\n    var oc = e.target.closest('.ocard');\n    if (oc) {\n      var i = firstEmpty();\n      if (i < 0) return;\n      st.slots[i] = oc.dataset.id; st.msg = ''; st.marks = null;\n      if (fbk === 'live' && oc.dataset.id !== items[i].id) st.mistakes++;\n      draw();\n      if (fbk === 'live') {\n        if (allCorrect()) finish();\n        else if (firstEmpty() < 0) { st.msg = 'Tap kartu yang merah untuk mengembalikannya, lalu coba lagi.'; draw(); }\n      }\n      return;\n    }\n    var sl = e.target.closest('.slot');\n    if (sl) {\n      var j = +sl.dataset.i;\n      if (st.slots[j] && !st.locked[j]) { st.slots[j] = null; st.msg = ''; st.marks = null; draw(); }\n    }\n  });\n\n  function check(){\n    if (st.done) return;\n    if (firstEmpty() >= 0) { st.msg = 'Isi semua posisi dulu.'; draw(); return; }\n    st.checks++;\n    var ok = 0, marks = [];\n    for (var i=0;i<n;i++){ var m = st.slots[i] === items[i].id; marks.push(m); if (m) ok++; }\n    if (ok === n) { finish(); return; }\n    st.marks = fbk === 'marks' ? marks : null;\n    st.msg = ok + ' dari ' + n + ' posisi sudah benar. Coba lagi.';\n    draw();\n  }\n  function finish(){\n    if (st.done) return;\n    st.done = true; clearTimer();\n    var res = {mistakes:st.mistakes, checks:st.checks, left:st.left, ok:true};\n    if (cfg.reveal) {\n      var h = '<div class=\"reveal\"><b>Urutan yang benar<\/b><ol>';\n      items.forEach(function(it, i){ h += '<li>' + (cfg.labels ? '<b>' + cfg.labels[i] + ':<\/b> ' : '') + esc(it.t) + '<\/li>'; });\n      h += '<\/ol><\/div><div class=\"row-btns\"><button class=\"btn\" id=\"go\">Lanjut<\/button><\/div>';\n      stage.innerHTML = '<div class=\"status\"><span class=\"chip good\">Urutan benar<\/span><\/div>' + h;\n      document.getElementById('go').onclick = function(){ cfg.onDone(res); };\n    } else cfg.onDone(res);\n  }\n  if (cfg.timer) {\n    timerId = setInterval(function(){\n      if (st.done) return;\n      st.left--;\n      var c = document.getElementById('tchip');\n      if (c) { c.textContent = st.left + ' dtk'; c.className = 'chip' + (st.left <= 15 ? ' warn' : ''); }\n      if (st.left <= 0) { st.left = 0; st.done = true; clearTimer(); if (cfg.onTimeout) cfg.onTimeout({checks:st.checks}); }\n    }, 1000);\n  }\n  draw();\n}\n\n/* ===================== komponen: sortir ke kotak ===================== */\n/* cfg: {level,title,task,bins:[{id,label,short,sub}],cards:[{id,t,bin}],hideNames,feedback:'live'|'check',onDone(res)} */\nfunction runSorter(cfg){\n  clearTimer();\n  var st = {place:{}, sel:null, mistakes:0, checks:0, done:false, msg:'', marks:null};\n  var cards = shuffle(cfg.cards), byId = {};\n  cfg.cards.forEach(function(c){ byId[c.id] = c; });\n  var live = cfg.feedback === 'live';\n  view.innerHTML = barHTML(cfg.title, '') + '<div id=\"stage\"><\/div>';\n  bindBack();\n  var stage = document.getElementById('stage');\n\n  function draw(){\n    var h = '<div class=\"status\"><span class=\"chip\" id=\"mchip\">' + (live ? 'Salah: ' + st.mistakes : 'Periksa: ' + st.checks + 'x') + '<\/span><\/div>';\n    h += '<div class=\"task\">' + cfg.task + '<\/div>';\n    h += '<div class=\"spool\"><div class=\"box\" id=\"pool\">';\n    var rest = cards.filter(function(c){ return !st.place[c.id]; });\n    if (!rest.length) h += '<span class=\"empty\">Semua kartu sudah dipasang<\/span>';\n    rest.forEach(function(c){ h += '<button class=\"scard' + (st.sel === c.id ? ' sel' : '') + '\" data-id=\"' + c.id + '\">' + esc(c.t) + '<\/button>'; });\n    h += '<\/div><\/div><div id=\"bins\">';\n    cfg.bins.forEach(function(b){\n      h += '<div class=\"bin' + (st.sel ? ' target' : '') + '\" data-bin=\"' + b.id + '\"><div class=\"bl\">' + (cfg.hideNames ? b.short : b.label) +\n           (!cfg.hideNames && b.sub ? '<span class=\"bs\">' + b.sub + '<\/span>' : '') + '<\/div><div class=\"items\">';\n      cards.filter(function(c){ return st.place[c.id] === b.id; }).forEach(function(c){\n        var cls = 'scard';\n        if (live) cls += (c.bin === b.id ? ' ok' : ' bad');\n        else if (st.marks) cls += (c.bin === b.id ? ' ok' : ' bad');\n        h += '<button class=\"' + cls + '\" data-placed=\"' + c.id + '\">' + esc(c.t) + '<\/button>';\n      });\n      h += '<\/div><\/div>';\n    });\n    h += '<\/div>' + (live ? '' : '<div class=\"row-btns\"><button class=\"btn alt\" id=\"rs\">Ulangi<\/button><button class=\"btn\" id=\"ck\">Periksa<\/button><\/div>') +\n         '<div class=\"msg\" id=\"msg\"><\/div>';\n    stage.innerHTML = h;\n    document.getElementById('msg').textContent = st.msg;\n    var rs = document.getElementById('rs');\n    if (rs) rs.onclick = function(){ if (st.done) return; st.place = {}; st.sel = null; st.msg = ''; st.marks = null; draw(); };\n    var ck = document.getElementById('ck');\n    if (ck) ck.onclick = check;\n  }\n  function allPlaced(){ return cards.every(function(c){ return st.place[c.id]; }); }\n  function allRight(){ return cards.every(function(c){ return st.place[c.id] === c.bin; }); }\n\n  stage.addEventListener('click', function(e){\n    if (st.done) return;\n    var c = e.target.closest('#pool [data-id]');\n    if (c) { st.sel = (st.sel === c.dataset.id) ? null : c.dataset.id; draw(); return; }\n    var bin = e.target.closest('[data-bin]');\n    var pc = e.target.closest('[data-placed]');\n    if (pc && !st.sel) { delete st.place[pc.dataset.placed]; st.msg = ''; st.marks = null; draw(); return; }\n    if (bin && st.sel) {\n      var card = byId[st.sel];\n      st.place[card.id] = bin.dataset.bin;\n      if (live && card.bin !== bin.dataset.bin) st.mistakes++;\n      st.sel = null; st.msg = ''; st.marks = null;\n      draw();\n      if (live) {\n        if (allRight()) finish();\n        else if (allPlaced()) { st.msg = 'Tap kartu yang merah untuk memindahkannya, lalu coba lagi.'; draw(); }\n      }\n    }\n  });\n  function check(){\n    if (st.done) return;\n    if (!allPlaced()) { st.msg = 'Pasang semua kartu dulu.'; draw(); return; }\n    st.checks++;\n    var ok = cards.filter(function(c){ return st.place[c.id] === c.bin; }).length;\n    if (ok === cards.length) { finish(); return; }\n    st.marks = true;\n    st.msg = ok + ' dari ' + cards.length + ' kartu sudah di tempat yang benar.';\n    draw();\n  }\n  function finish(){\n    if (st.done) return;\n    st.done = true;\n    cfg.onDone({mistakes:st.mistakes, checks:st.checks});\n  }\n  draw();\n}\n\n/* ===================== Sortir Lifecycle ===================== */\nvar PH = [\n  {id:'plan',   label:'Pengadaan', sub:'Plan + Procure', short:'Pengadaan'},\n  {id:'deploy', label:'Penyebaran', sub:'Deploy', short:'Penyebaran'},\n  {id:'use',    label:'Penggunaan', sub:'Use', short:'Penggunaan'},\n  {id:'maint',  label:'Pemeliharaan', sub:'Maintain', short:'Pemeliharaan'},\n  {id:'decom',  label:'Penonaktifan', sub:'Decommission', short:'Penonaktifan'},\n  {id:'reuse',  label:'Pakai ulang atau nilai sisa', sub:'Reuse / Salvage', short:'Reuse / Salvage'}\n];\nvar C = {\n  kak:   {t:'Menetapkan kebutuhan dan menyusun KAK', bin:'plan'},\n  beli:  {t:'Membeli perangkat dari penyedia terpilih', bin:'plan'},\n  terima:{t:'Penerima memastikan barang benar-benar diterima', bin:'plan'},\n  pasang:{t:'Memasang dan mengonfigurasi perangkat di lokasi', bin:'deploy'},\n  catat: {t:'Mencatat lokasi, penanggung jawab, vendor, dan garansi aset', bin:'deploy'},\n  pantau:{t:'Memantau tingkat pemakaian aset', bin:'use'},\n  pindah:{t:'Memindahkan aset yang jarang dipakai ke unit yang lebih membutuhkan', bin:'use'},\n  update:{t:'Memperbarui perangkat lunak dan mengubah konfigurasinya', bin:'maint'},\n  tambah:{t:'Menambah komponen, misalnya memori', bin:'maint'},\n  off:   {t:'Menyatakan perangkat tidak lagi digunakan', bin:'decom'},\n  pakai: {t:'Perangkat nonaktif dipakai ulang oleh unit lain', bin:'reuse'},\n  sisa:  {t:'Mencatat nilai sisa perangkat sampai pemanfaatannya selesai', bin:'reuse'}\n};\nfunction cardsOf(keys){ return keys.map(function(k){ return {id:k, t:C[k].t, bin:C[k].bin}; }); }\n\nvar SC = [\n  {t:'Penerima mengecek barang yang datang sesuai pesanan, lalu sistem memberi sinyal ke bagian pembayaran.', a:'plan', why:'Konfirmasi penerimaan dan pembayaran terjadi di tahap pengadaan (modul hal. 16).'},\n  {t:'Server baru dicatat lokasi rak, penanggung jawab, dan masa garansinya.', a:'deploy', why:'Data lokasi, penanggung jawab, konfigurasi, vendor, dan garansi diperbarui pada fase penyebaran.'},\n  {t:'Server mahal yang jarang dipakai dipindahkan ke unit yang lebih membutuhkan.', a:'use', why:'Fase penggunaan tidak statis: data pemakaian dipakai untuk mengoptimalkan pemanfaatan aset.'},\n  {t:'Setelah pembaruan perangkat lunak, data konfigurasi di sistem manajemen aset ikut diperbarui.', a:'maint', why:'Peningkatan atau perubahan aset (misalnya pembaruan software) masuk Maintain, dan informasi konfigurasinya harus diperbarui.'},\n  {t:'Memori server ditambah supaya kinerjanya meningkat.', a:'maint', why:'Penambahan komponen adalah peningkatan aset, jadi termasuk Maintain.'},\n  {t:'Laptop lama sudah tidak dipakai, tetapi unit lain masih mau memakainya.', a:'reuse', why:'Aset yang dinonaktifkan kadang masih bisa dimanfaatkan kembali (reuse).'},\n  {t:'Perangkat nonaktif tidak bisa dipakai lagi, tetapi masih punya nilai sisa yang harus dicatat.', a:'reuse', why:'Bila tidak bisa dipakai ulang, nilai sisanya (salvage) dicatat dan dikelola sampai pemanfaatannya selesai.'},\n  {t:'Perangkat dinyatakan tidak lagi digunakan dan dikeluarkan dari operasional.', a:'decom', why:'Saat aset tidak lagi digunakan, ia memasuki fase penonaktifan.'},\n  {t:'Perangkat lunak operasional memperbarui tingkat pemakaian aset secara berkala.', a:'use', why:'Memantau pemakaian terjadi selama fase penggunaan.'},\n  {t:'Menyusun KAK dan HPS sebelum perangkat dibeli.', a:'plan', why:'Perencanaan kebutuhan dan penyusunan dokumen adalah bagian Plan + Procure.'}\n];\n\nGAME = {\n  key:'lifecycle', title:'Sortir Lifecycle', emoji:'♻️',\n  intro:'Tempatkan kegiatan ke fase siklus hidup infrastruktur TI yang tepat.',\n  levels:[['Mudah','8 kegiatan ke 5 fase, langsung ada tanda benar atau salah'],['Sedang','12 kegiatan ke 6 fase, periksa di akhir'],['Sulit','8 kasus abu-abu, pilih fase yang paling tepat']],\n  foot:'Rujukan: Modul Manajemen Infrastruktur TI hal. 16-17 dan diagram lifecycle di slide.',\n  start:function(level){\n    if (level === 1) {\n      runSorter({level:1, title:levelTitle(1), feedback:'live', bins:PH.slice(0,5),\n        cards:cardsOf(['kak','beli','pasang','catat','pantau','update','tambah','off']),\n        task:'Tap kegiatan, lalu tap fase yang tepat. Tap kartu di kotak untuk memindahkannya.',\n        onDone:function(r){\n          var s = starsLow(r.mistakes, 1, 4); saveBest(1, s);\n          showResult({level:1, stars:s, title:'Semua tepat!', text: s === 3 ? 'Rapi. Alur lifecycle sudah jelas.' : 'Berhasil. Ulangi untuk lebih tepat.', stats:['Salah letak: ' + r.mistakes]});\n        }});\n    } else if (level === 2) {\n      runSorter({level:2, title:levelTitle(2), feedback:'check', bins:PH, cards:cardsOf(Object.keys(C)),\n        task:'Tempatkan 12 kegiatan ke 6 fase, lalu tap Periksa.',\n        onDone:function(r){\n          var s = starsLow(r.checks, 2, 4); saveBest(2, s);\n          showResult({level:2, stars:s, title:'Semua kegiatan tepat!', text: s === 3 ? 'Rapi. Termasuk reuse dan salvage.' : 'Berhasil. Ulangi supaya lebih sekali jalan.', stats:['Pemeriksaan: ' + r.checks + 'x']});\n        }});\n    } else {\n      var qs = shuffle(SC).slice(0, 8).map(function(s){\n        return {prompt:s.t, ctx:'Fase mana yang paling tepat?', opts:PH.map(function(p){ return {k:p.id, t:p.label + ' (' + p.sub + ')'}; }), ans:s.a, why:s.why};\n      });\n      runQuiz({level:3, title:levelTitle(3), qs:qs,\n        finish:function(score, total){\n          var s = starsBy(score, 7, 5, 3); saveBest(3, s);\n          showResult({level:3, stars:s, title:'Skor ' + score + ' dari ' + total,\n            text: s === 3 ? 'Hampir sempurna. Kasus abu-abu pun bisa dibaca.' : 'Bagus. Perhatikan beda Use, Maintain, dan Reuse atau Salvage.', stats:[],\n            note:'Pengelompokan Maintain, Reuse, dan Salvage mengikuti diagram lifecycle di slide.'});\n        }});\n    }\n  }\n};\nshowMenu();\n\n<\/script>\n<\/body>\n<\/html>\n"},
  {key:'pengadaan', title:'Urutan Pengadaan', emoji:'📋', tema:'Man TI', slide:'32-33', desc:'Susun tahapan pengadaan TI dengan benar.', html:"<!DOCTYPE html>\n<html lang=\"id\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Urutan Pengadaan<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&display=swap\" rel=\"stylesheet\">\n<style>\n:root{\n  box-sizing:border-box;\n  padding-top:env(safe-area-inset-top,0px);\n  padding-bottom:env(safe-area-inset-bottom,0px);\n  --bg:#FFF9F3; --card:#FFFFFF; --ink:#182255; --muted:#566086;\n  --accent:#F79039; --accent-2:#FEBD26;\n  --peach:#FCDDC2; --peach-2:#FBCCA4; --line:#F3D3B6;\n  --ok:#14805A; --ok-bg:#DDF4EA; --bad:#C23A3A; --bad-bg:#FBE1E1;\n  --term:#101636; --term-ink:#D9F7E8;\n}\n@media (prefers-color-scheme: dark){\n  :root:not([data-theme=\"light\"]){\n    --bg:#121731; --card:#1B2347; --ink:#F4EFE8; --muted:#AAB1D3;\n    --peach:#2A3263; --peach-2:#36407A; --line:#3A4580;\n    --ok:#4CD6A0; --ok-bg:#12382C; --bad:#FF8A8A; --bad-bg:#44202A;\n    --term:#0A0E24;\n  }\n}\n:root[data-theme=\"dark\"]{\n  --bg:#121731; --card:#1B2347; --ink:#F4EFE8; --muted:#AAB1D3;\n  --peach:#2A3263; --peach-2:#36407A; --line:#3A4580;\n  --ok:#4CD6A0; --ok-bg:#12382C; --bad:#FF8A8A; --bad-bg:#44202A;\n  --term:#0A0E24;\n}\nhtml{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}\n*,*::before,*::after{box-sizing:inherit}\nbody{margin:0;min-height:100%;background:var(--bg);color:var(--ink);\n  font-family:Arial,\"Helvetica Neue\",sans-serif;font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}\nh1,h2,h3{font-family:Montserrat,Arial,sans-serif;margin:0;line-height:1.2}\nbutton{font:inherit;color:inherit;cursor:pointer}\nbutton:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent-2);outline-offset:2px}\n.app{max-width:720px;margin:0 auto;padding:16px 14px 28px}\n\n/* menu */\n.hero{background:var(--accent);color:#fff;border-radius:22px;padding:22px 20px 20px;position:relative;overflow:hidden}\n.hero h1{font-size:clamp(26px,7vw,34px);font-weight:800;color:#fff;padding-right:84px}\n.hero p{margin:8px 0 0;color:#FFF3E6;padding-right:84px}\n.hero .decor{position:absolute;right:14px;top:14px;font-size:58px;line-height:1;transform:rotate(-6deg)}\n.levels{display:grid;gap:12px;margin-top:16px}\n.lvl{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;text-align:left;\n  background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px 16px;width:100%}\n.lvl:hover{border-color:var(--accent)}\n.lvl .no{width:46px;height:46px;border-radius:50%;background:var(--peach);display:grid;place-items:center;\n  font-family:Montserrat,Arial,sans-serif;font-weight:800;font-size:20px}\n.lvl h2{font-size:17px}\n.lvl p{margin:3px 0 0;color:var(--muted);font-size:14px}\n.stars{font-size:20px;letter-spacing:2px;color:var(--accent-2);white-space:nowrap}\n.stars .off{color:var(--line)}\n.foot{margin-top:18px;color:var(--muted);font-size:13px}\n\n/* bar */\n.bar{display:flex;align-items:center;gap:10px;margin-bottom:12px}\n.back{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:8px 12px;font-weight:700}\n.bar h2{font-size:18px;flex:1}\n.chip{background:var(--peach);border-radius:999px;padding:6px 14px;font-weight:700;font-size:14px;white-space:nowrap}\n.chip.warn{background:var(--bad-bg);color:var(--bad)}\n.chip.good{background:var(--ok-bg);color:var(--ok)}\n.status{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}\n.task{background:var(--peach);border-radius:14px;padding:12px 14px;margin-bottom:12px;font-size:15.5px}\n.hint{margin:0 0 12px;color:var(--muted);font-size:14.5px}\n.btn{border:0;border-radius:14px;padding:12px 18px;font-weight:700;background:var(--accent);color:#fff;flex:1}\n.btn.alt{background:var(--card);color:var(--ink);border:2px solid var(--line)}\n.btn.dark{background:var(--ink);color:var(--bg)}\n.btn:disabled{opacity:.5;cursor:default}\n.row-btns{display:flex;gap:10px;margin-top:14px}\n.msg{margin-top:12px;min-height:22px;font-weight:700;text-align:center}\n\n/* quiz */\n.qcard{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px}\n.qcard h3{font-size:17px;margin-bottom:6px}\n.ctx{margin:0 0 10px;font-size:15px}\n.clue{background:var(--peach);border-radius:12px;padding:10px 12px;margin:0 0 10px;font-size:14.5px}\n.clue b{display:block;margin-bottom:2px}\n.opts{display:grid;gap:10px;margin-top:12px}\n.opts.cols2{grid-template-columns:1fr 1fr}\n.opt{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:12px 14px;text-align:left;font-weight:700;font-size:15px}\n.opt:hover:not(:disabled){border-color:var(--accent)}\n.opt.right{background:var(--ok-bg);border-color:var(--ok)}\n.opt.wrong{background:var(--bad-bg);border-color:var(--bad)}\n.fb{margin-top:14px;border-radius:14px;padding:12px 14px;font-size:14.5px}\n.fb.ok{background:var(--ok-bg)} .fb.bad{background:var(--bad-bg)}\n.fb b{display:block;margin-bottom:2px}\n\n/* sorter */\n.spool{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:6px 0 8px;margin-bottom:8px}\n.spool .box{border:2px dashed var(--line);border-radius:16px;background:var(--card);padding:8px;display:flex;flex-wrap:wrap;gap:6px;\n  justify-content:center;max-height:34vh;overflow:auto;min-height:56px;align-items:center}\n.scard{border:2px solid var(--peach-2);background:var(--peach);border-radius:12px;padding:7px 11px;font-weight:700;font-size:14px;text-align:left}\n.scard.sel{outline:3px solid var(--accent-2);transform:translateY(-2px);border-color:var(--accent)}\n.scard.ok{background:var(--ok-bg);border-color:var(--ok)}\n.scard.bad{background:var(--bad-bg);border-color:var(--bad)}\n.spool .empty{color:var(--muted);font-size:14px}\n.bin{border:2px solid var(--line);background:var(--card);border-radius:16px;padding:9px 11px 10px;margin-bottom:8px;cursor:pointer}\n.bin.target{border-color:var(--accent);background:var(--peach)}\n.bin .bl{font-weight:800;font-size:14.5px}\n.bin .bs{font-weight:400;color:var(--muted);font-size:12.5px;margin-left:6px}\n.bin .items{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;min-height:6px}\n\n/* order */\n.slots{display:grid;gap:8px}\n.slot{display:flex;gap:10px;align-items:stretch;min-height:46px}\n.slot .n{flex:0 0 34px;border-radius:10px;background:var(--peach);display:grid;place-items:center;font-weight:800}\n.slot .c{flex:1;border:2px dashed var(--line);border-radius:12px;padding:8px 12px;display:flex;align-items:center;text-align:left;\n  background:var(--card);font-size:14.5px;min-height:46px}\n.slot .c.filled{border-style:solid;border-color:var(--peach-2);background:var(--peach);font-weight:700;cursor:pointer}\n.slot .c.locked{background:var(--card);border-color:var(--ink);cursor:default}\n.slot .c.ok{background:var(--ok-bg);border-color:var(--ok)}\n.slot .c.bad{background:var(--bad-bg);border-color:var(--bad)}\n.slot .lab{display:block;font-size:12px;color:var(--muted);font-weight:400}\n.opool{margin-top:12px;display:grid;gap:8px;padding:10px;border:2px dashed var(--line);border-radius:16px;background:var(--card)}\n.opool.g2{grid-template-columns:1fr 1fr}\n.ocard{border:2px solid var(--peach-2);background:var(--peach);border-radius:12px;padding:9px 12px;font-weight:700;font-size:14px;text-align:left}\n.opool .empty{color:var(--muted);font-size:14px;grid-column:1/-1;text-align:center}\n.reveal{margin-top:12px;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 14px}\n.reveal ol{margin:6px 0 0;padding-left:20px}\n.reveal li{margin-bottom:6px;font-size:14.5px}\n\n/* result */\n.result{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:24px 18px;text-align:center}\n.result .stars{font-size:46px;margin:6px 0 4px}\n.result h2{font-size:22px}\n.result p{color:var(--muted);margin:6px auto 0;max-width:44ch}\n.stat{display:flex;justify-content:center;gap:10px;margin:14px 0 4px;flex-wrap:wrap}\n.stat span{background:var(--peach);border-radius:999px;padding:6px 14px;font-weight:700;font-size:14px}\n.result .row-btns{flex-wrap:wrap}\n.result .row-btns .btn{min-width:130px}\n.extra{margin-top:14px;text-align:left}\n.note{margin-top:14px;font-size:12.5px;color:var(--muted);text-align:left}\n@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}\n\n\n<\/style>\n<\/head>\n<body>\n<div class=\"app\" id=\"view\"><\/div>\n<script>\n/* ===================== util umum ===================== */\nvar GAME = null;\nvar view = document.getElementById('view');\nvar timerId = null;\nfunction clearTimer(){ if (timerId){ clearInterval(timerId); timerId = null; } }\nfunction shuffle(a){\n  a = a.slice();\n  for (var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }\n  return a;\n}\nfunction pick(a){ return a[Math.floor(Math.random()*a.length)]; }\nfunction esc(s){ return String(s).replace(/&/g,'&amp;').replace(/<\/g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;'); }\nfunction eqArr(a,b){ if (a.length !== b.length) return false; for (var i=0;i<a.length;i++){ if (a[i]!==b[i]) return false; } return true; }\n\nfunction loadBest(){\n  try { var r = localStorage.getItem('best_' + GAME.key); if (r) return JSON.parse(r); } catch(e){}\n  return {1:0,2:0,3:0};\n}\nfunction saveBest(level, stars){\n  try {\n    var b = loadBest();\n    if (stars > (b[level]||0)) { b[level] = stars; localStorage.setItem('best_' + GAME.key, JSON.stringify(b)); }\n  } catch(e){}\n}\nfunction starsHTML(n){\n  var s = '<span class=\"stars\" aria-label=\"' + n + ' dari 3 bintang\">';\n  for (var i=1;i<=3;i++) s += i<=n ? '★' : '<span class=\"off\">★<\/span>';\
