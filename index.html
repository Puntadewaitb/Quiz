<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Game Prakom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFF9F3;--card:#fff;--ink:#182255;--muted:#566086;--accent:#F79039;--accent-2:#FEBD26;--peach:#FCDDC2;--line:#F3D3B6;--ok:#14805A;--bad:#C23A3A}
@media (prefers-color-scheme:dark){:root{--bg:#121731;--card:#1B2347;--ink:#F4EFE8;--muted:#AAB1D3;--peach:#2A3263;--line:#3A4580;--ok:#4CD6A0;--bad:#FF8A8A}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 Arial,sans-serif;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:Montserrat,Arial,sans-serif;margin:0;line-height:1.2}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent-2);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:16px 14px 28px}
.hero{background:var(--accent);color:#fff;border-radius:22px;padding:22px 20px}
.hero h1{font-size:clamp(26px,7vw,34px);font-weight:800}
.hero p{margin:8px 0 0;color:#FFF3E6}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px;margin-top:16px}
label{font-weight:700;display:block;margin-bottom:6px}
input[type=text]{width:100%;border:2px solid var(--line);background:var(--bg);border-radius:12px;padding:12px 14px}
.btn{border:0;border-radius:14px;padding:12px 18px;font-weight:700;background:var(--accent);color:#fff}
.btn.alt{background:var(--card);color:var(--ink);border:2px solid var(--line)}
.btn.full{width:100%;margin-top:12px}
.err{color:var(--bad);font-weight:700;min-height:22px;margin:8px 0 0;font-size:14px}
.top{display:flex;align-items:center;gap:10px;justify-content:space-between;margin:2px 0 4px}
.who{font-weight:700}
.chip{background:var(--peach);border-radius:999px;padding:6px 14px;font-weight:700;font-size:14px;white-space:nowrap}
.sync{font-size:13px;color:var(--muted);margin-top:6px}
.sync b.ok{color:var(--ok)} .sync b.bad{color:var(--bad)}
.tema{margin:18px 0 8px;font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.games{display:grid;gap:12px}
.g{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px 16px;width:100%}
.g:hover{border-color:var(--accent)}
.g .em{font-size:30px;width:46px;height:46px;display:grid;place-items:center;background:var(--peach);border-radius:50%}
.g h2{font-size:17px} .g p{margin:3px 0 0;color:var(--muted);font-size:14px}
.g p.sl{font-size:12px;font-weight:700;opacity:.85}
.stars{color:var(--accent-2);letter-spacing:2px;font-size:17px;white-space:nowrap}
.stars .off{color:var(--line)}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.row .btn{flex:1}
#play{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg)}
#play .pb{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:2px solid var(--line);padding-top:max(8px,env(safe-area-inset-top))}
#play .pb b{flex:1;font-family:Montserrat,Arial,sans-serif;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#play iframe{flex:1;width:100%;border:0}
.hidden{display:none!important}
.lbbtn{margin-top:14px;border-color:var(--accent-2);background:linear-gradient(90deg,var(--card),var(--peach))}
.av{display:inline-grid;place-items:center;border-radius:50%;line-height:1;flex:none;border:3px solid var(--card);box-shadow:0 2px 0 rgba(0,0,0,.12)}
.lbtitle{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 0 10px}
.lbtitle h2{font-size:19px}
.lbmeta{color:var(--muted);font-size:13px;margin:6px 0 0}
.lbact{display:flex;gap:10px;align-items:center;margin-top:12px}
.lbact .btn{flex:1}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:8px;margin:18px 0 8px;min-height:230px}
.pcol{flex:1;max-width:150px;min-width:0;text-align:center;display:flex;flex-direction:column;align-items:center}
.pcol .crown{font-size:26px;height:30px;line-height:30px;animation:bob 1.6s ease-in-out infinite}
.pcol .nm{font-weight:800;font-size:14px;margin:6px 0 2px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcol .pt{font-weight:800;font-size:13px;background:var(--peach);border-radius:999px;padding:2px 10px;margin-bottom:6px}
.pcol .blk{width:100%;border-radius:12px 12px 0 0;display:grid;place-items:start center;padding-top:8px;font:800 26px Montserrat,Arial,sans-serif;color:#182255}
.pcol.p1 .blk{height:110px;background:#FEBD26}.pcol.p2 .blk{height:80px;background:#C9D1E6}.pcol.p3 .blk{height:60px;background:#E8A06A}
.pcol{animation:pop .45s both}.pcol.p1{animation-delay:.25s}.pcol.p2{animation-delay:.1s}.pcol.p3{animation-delay:0s}
.rows{display:grid;gap:8px;margin-top:6px}
.rrow{display:grid;grid-template-columns:34px auto 1fr auto;gap:10px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:8px 12px}
.rrow .rk{font:800 16px Montserrat,Arial,sans-serif;text-align:center}
.rrow .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rrow .pt{font-weight:800}
.me{outline:3px solid var(--accent-2)}
.saya{margin-top:12px;background:var(--peach);border-radius:14px;padding:10px 14px;font-weight:700}
.kosong{text-align:center;color:var(--muted);padding:26px 8px}
@keyframes pop{from{transform:translateY(24px) scale(.9);opacity:0}to{transform:none;opacity:1}}
@keyframes bob{50%{transform:translateY(-5px)}}
@media (prefers-reduced-motion:reduce){.pcol,.pcol .crown{animation:none}}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-size:12px;text-transform:uppercase}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="play" class="hidden"><div class="pb"><button class="btn alt" id="pback">&larr; Daftar Game</button><b id="ptitle"></b></div><iframe id="frame" title="Game"></iframe></div>
<script>
/* ===== KONFIGURASI: tempel URL Web App Google Apps Script di sini (lihat tools/apps-script/README.md) ===== */

  {key:'kabel', title:'Susun Kabel UTP', emoji:'🔌', tema:'Sisjarkom', desc:'Urutan pin T568A/T568B, straight vs crossover.', html:"<!DOCTYPE html>\n<html lang=\"id\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Susun Kabel UTP<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&display=swap\" rel=\"stylesheet\">\n<style>\n:root{\n  box-sizing:border-box;\n  padding-top:env(safe-area-inset-top,0px);\n  padding-bottom:env(safe-area-inset-bottom,0px);\n  --bg:#FFF9F3; --card:#FFFFFF; --ink:#182255; --muted:#566086;\n  --accent:#F79039; --accent-2:#FEBD26; --accent-ink:#182255;\n  --peach:#FCDDC2; --peach-2:#FBCCA4; --line:#F3D3B6;\n  --ok:#14805A; --ok-bg:#DDF4EA; --bad:#C23A3A; --bad-bg:#FBE1E1;\n  --plug:#E8E2D6; --plug-edge:#BDB4A2; --slot:rgba(255,255,255,.55);\n}\n@media (prefers-color-scheme: dark){\n  :root:not([data-theme=\"light\"]){\n    --bg:#121731; --card:#1B2347; --ink:#F4EFE8; --muted:#AAB1D3;\n    --peach:#2A3263; --peach-2:#36407A; --line:#3A4580;\n    --ok:#4CD6A0; --ok-bg:#12382C; --bad:#FF8A8A; --bad-bg:#44202A;\n    --plug:#3A4268; --plug-edge:#6A7299; --slot:rgba(255,255,255,.08);\n  }\n}\n:root[data-theme=\"dark\"]{\n  --bg:#121731; --card:#1B2347; --ink:#F4EFE8; --muted:#AAB1D3;\n  --peach:#2A3263; --peach-2:#36407A; --line:#3A4580;\n  --ok:#4CD6A0; --ok-bg:#12382C; --bad:#FF8A8A; --bad-bg:#44202A;\n  --plug:#3A4268; --plug-edge:#6A7299; --slot:rgba(255,255,255,.08);\n}\nhtml{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}\n*,*::before,*::after{box-sizing:inherit}\nbody{margin:0;min-height:100%;background:var(--bg);color:var(--ink);\n  font-family:Arial,\"Helvetica Neue\",sans-serif;font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}\nh1,h2,h3{font-family:Montserrat,Arial,sans-serif;margin:0;line-height:1.2}\nbutton{font:inherit;color:inherit;cursor:pointer}\nbutton:focus-visible{outline:3px solid var(--accent-2);outline-offset:2px}\n.app{max-width:720px;margin:0 auto;padding:16px 14px 28px}\n\n/* ---------- menu ---------- */\n.hero{background:var(--accent);color:#fff;border-radius:22px;padding:22px 20px 20px;position:relative;overflow:hidden}\n.hero h1{font-size:clamp(26px,7vw,34px);font-weight:800;color:#fff}\n.hero p{margin:8px 0 0;color:#FFF3E6}\n.hero h1,.hero p{padding-right:96px}\n.hero .plugdeco{position:absolute;right:10px;top:18px;display:flex;gap:3px;transform:rotate(8deg);opacity:.95}\n.hero .plugdeco i{display:block;width:12px;height:52px;border-radius:5px;border:1.5px solid rgba(0,0,0,.2)}\n.levels{display:grid;gap:12px;margin-top:16px}\n.lvl{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;text-align:left;\n  background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px 16px;width:100%}\n.lvl:hover{border-color:var(--accent)}\n.lvl .no{width:46px;height:46px;border-radius:50%;background:var(--peach);display:grid;place-items:center;\n  font-family:Montserrat,Arial,sans-serif;font-weight:800;font-size:20px}\n.lvl h2{font-size:17px}\n.lvl p{margin:3px 0 0;color:var(--muted);font-size:14px}\n.stars{font-size:20px;letter-spacing:2px;color:var(--accent-2);white-space:nowrap}\n.stars .off{color:var(--line)}\n.foot{margin-top:18px;color:var(--muted);font-size:13px}\n\n/* ---------- top bar ---------- */\n.bar{display:flex;align-items:center;gap:10px;margin-bottom:12px}\n.back{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:8px 12px;font-weight:700}\n.bar h2{font-size:18px;flex:1}\n.chip{background:var(--peach);border-radius:999px;padding:6px 14px;font-weight:700;font-size:14px;white-space:nowrap}\n.chip.warn{background:var(--bad-bg);color:var(--bad)}\n.hint{margin:0 0 12px;color:var(--muted);font-size:14.5px}\n\n/* ---------- guide ---------- */\n.guide{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px 10px 8px;margin-bottom:14px;text-align:left}\n.guide h3{font-size:14px;margin:0 0 6px}\n.guide .g8{display:grid;grid-template-columns:46px repeat(8,1fr);gap:4px;align-items:center;margin-bottom:2px}\n.guide .g8.head{font-size:12px;text-align:center}\n.guide .gl{font-weight:700;font-size:11px}\n.guide .gc{text-align:center;font-size:10px;line-height:1.1}\n.sw{height:18px;border-radius:5px;border:1.5px solid rgba(0,0,0,.28);margin:2px 0}\n.guide .rule{margin:8px 0 0;font-size:12.5px;color:var(--muted)}\n.status{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}\n.task{background:var(--peach);border-radius:14px;padding:12px 14px;margin-bottom:12px;font-size:15.5px}\n.sec{margin-bottom:14px}\n.seclabel{font-weight:700;margin:0 0 6px;font-size:14.5px}\n.sec.locked .slotbox{cursor:default;border-style:solid;border-color:rgba(0,0,0,.18)}\n.wire.static{cursor:default}\n.compact .slotbox{height:clamp(78px,20vw,108px)}\n.compact .pool{margin-top:8px;min-height:90px;padding:8px;gap:6px}\n.compact .pool .wire{width:clamp(30px,8.4vw,54px);height:clamp(72px,19vw,98px)}\n\n/* ---------- plug + wires ---------- */\n.plug{background:var(--plug);border:3px solid var(--plug-edge);border-radius:14px 14px 8px 8px;\n  padding:12px 8px 8px;display:grid;grid-template-columns:repeat(8,1fr);gap:5px}\n.slot{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}\n.slotbox{width:100%;height:clamp(96px,26vw,136px);border:2px dashed rgba(0,0,0,.32);border-radius:9px;background:var(--slot);\n  display:flex;align-items:stretch;justify-content:center;padding:0;position:relative;cursor:pointer}\n.slotbox.sel{border-color:var(--accent);border-style:solid;background:var(--peach)}\n.slotbox.ok{border-style:solid;border-color:var(--ok)}\n.slotbox.bad{border-style:solid;border-color:var(--bad);animation:shake .28s}\n.pin{font-weight:800;font-size:13px}\n.wire{position:relative;width:100%;height:100%;border-radius:8px;border:2px solid rgba(0,0,0,.3);padding:0;\n  display:flex;align-items:flex-end;justify-content:center;touch-action:manipulation}\n.wire .wl{margin-bottom:5px;background:rgba(255,255,255,.93);color:#1d1d1d;font-size:10px;font-weight:700;\n  border-radius:5px;padding:1px 3px;line-height:1.2;white-space:nowrap}\n.compact .wire .wl{font-size:9px;padding:1px 2px;margin-bottom:4px}\n.pool{margin-top:14px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:128px;padding:12px 8px;\n  border:2px dashed var(--line);border-radius:16px;background:var(--card)}\n.pool .wire{width:clamp(34px,9.6vw,54px);height:clamp(90px,23vw,118px)}\n.pool .wire.sel,.slotbox .wire.sel{outline:3px solid var(--accent-2);transform:translateY(-4px)}\n.pool .empty{align-self:center;color:var(--muted);font-size:14px}\n.row-btns{display:flex;gap:10px;margin-top:14px}\n.btn{border:0;border-radius:14px;padding:12px 18px;font-weight:700;background:var(--accent);color:#fff;flex:1}\n.btn.alt{background:var(--card);color:var(--ink);border:2px solid var(--line)}\n.btn.dark{background:var(--ink);color:var(--bg)}\n.msg{margin-top:12px;min-height:22px;font-weight:700;text-align:center}\n@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}\n\n/* ---------- level 3 ---------- */\n.qcard{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px}\n.qcard h3{font-size:17px;margin-bottom:12px}\n.ends{display:grid;gap:12px}\n.end .lab{font-weight:700;font-size:14px;margin-bottom:4px}\n.end .e8{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}\n.end .ec{text-align:center;font-size:10px;line-height:1.2}\n.end .ec .chipc{height:46px;border-radius:7px;border:1.5px solid rgba(0,0,0,.3);margin:2px 0}\n.end .ec b{font-size:11px}\n.legend{margin:10px 0 0;color:var(--muted);font-size:12.5px}\n.dot{display:inline-block;width:14px;height:14px;border-radius:4px;border:1.5px solid rgba(0,0,0,.35);margin-right:8px;vertical-align:-2px}\n.end .ec .chipc.q{background:var(--peach);border-style:dashed;display:grid;place-items:center;font-weight:800;font-size:18px}\n.pair{display:flex;align-items:center;justify-content:center;gap:10px;padding:14px 4px;font-family:Montserrat,Arial,sans-serif;\n  font-weight:800;font-size:clamp(18px,5.5vw,24px)}\n.pair .dev{background:var(--peach);border-radius:14px;padding:10px 16px}\n.pair .ln{flex:0 0 36px;height:6px;border-radius:3px;background:var(--ink);opacity:.75}\n.opts{display:grid;gap:10px;margin-top:14px}\n.opt{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:13px 16px;text-align:left;font-weight:700}\n.opt:hover:not(:disabled){border-color:var(--accent)}\n.opt.right{background:var(--ok-bg);border-color:var(--ok)}\n.opt.wrong{background:var(--bad-bg);border-color:var(--bad)}\n.fb{margin-top:14px;border-radius:14px;padding:12px 14px;font-size:14.5px}\n.fb.ok{background:var(--ok-bg)}\n.fb.bad{background:var(--bad-bg)}\n.fb b{display:block;margin-bottom:2px}\n\n/* ---------- result ---------- */\n.result{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:24px 18px;text-align:center}\n.result .stars{font-size:46px;margin:6px 0 4px}\n.result h2{font-size:22px}\n.result p{color:var(--muted);margin:6px auto 0;max-width:44ch}\n.stat{display:flex;justify-content:center;gap:10px;margin:14px 0 4px;flex-wrap:wrap}\n.stat span{background:var(--peach);border-radius:999px;padding:6px 14px;font-weight:700;font-size:14px}\n.result .row-btns{flex-wrap:wrap}\n.result .row-btns .btn{min-width:130px}\n.note{margin-top:14px;font-size:12.5px;color:var(--muted);text-align:left}\n@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}\n<\/style>\n<\/head>\n<body>\n<div class=\"app\" id=\"view\"><\/div>\n\n<script>\n/* ===================== data ===================== */\nvar WIRES = {\n  wo:  {n:'Putih-Oranye', s:'P-Or', c:'#F5821F', w:1},\n  o:   {n:'Oranye',       s:'Or',   c:'#F5821F', w:0},\n  wg:  {n:'Putih-Hijau',  s:'P-Hj', c:'#2E9E4F', w:1},\n  g:   {n:'Hijau',        s:'Hj',   c:'#2E9E4F', w:0},\n  b:   {n:'Biru',         s:'Bi',   c:'#1F6FD1', w:0},\n  wb:  {n:'Putih-Biru',   s:'P-Bi', c:'#1F6FD1', w:1},\n  wbr: {n:'Putih-Coklat', s:'P-Cl', c:'#7B4B2A', w:1},\n  br:  {n:'Coklat',       s:'Cl',   c:'#7B4B2A', w:0}\n};\nvar T568B = ['wo','o','wg','b','wb','g','wbr','br'];\nvar T568A = ['wg','g','wo','b','wb','o','wbr','br'];\n\nfunction wireBG(k){\n  var w = WIRES[k];\n  return w.w ? 'repeating-linear-gradient(135deg,#FFFFFF 0 6px,' + w.c + ' 6px 12px)' : w.c;\n}\nfunction eq(a,b){ for (var i=0;i<a.length;i++){ if(a[i]!==b[i]) return false; } return true; }\nfunction shuffle(a){\n  a = a.slice();\n  for (var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }\n  return a;\n}\nfunction pick(a){ return a[Math.floor(Math.random()*a.length)]; }\n\n/* ===================== storage (opsional) ===================== */\nfunction loadBest(){\n  try { var r = localStorage.getItem('kabel_utp_best'); if (r) return JSON.parse(r); } catch(e){}\n  return {1:0,2:0,3:0};\n}\nfunction saveBest(level, stars){\n  try {\n    var b = loadBest();\n    if (stars > (b[level]||0)) { b[level] = stars; localStorage.setItem('kabel_utp_best', JSON.stringify(b)); }\n  } catch(e){}\n}\nfunction starsHTML(n){\n  var s = '<span class=\"stars\" aria-label=\"' + n + ' dari 3 bintang\">';\n  for (var i=1;i<=3;i++) s += i<=n ? '★' : '<span class=\"off\">★<\/span>';\n  return s + '<\/span>';\n}\n\n/* ===================== util ===================== */\nvar view = document.getElementById('view');\nvar timerId = null;\nfunction clearTimer(){ if (timerId){ clearInterval(timerId); timerId = null; } }\n\n/* ===================== menu ===================== */\nfunction showMenu(){\n  clearTimer();\n  var best = loadBest();\n  var deco = ['wo','o','wg','b','wb','g','wbr','br'].map(function(k){\n    return '<i style=\"background:' + wireBG(k) + '\"><\/i>';\n  }).join('');\n  view.innerHTML =\n    '<div class=\"hero\"><div class=\"plugdeco\" aria-hidden=\"true\">' + deco + '<\/div>' +\n    '<h1>Susun Kabel UTP<\/h1>' +\n    '<p>Latihan menyusun warna kabel RJ-45 untuk kabel straight (lurus) dan crossover (silang).<\/p><\/div>' +\n    '<div class=\"levels\">' +\n    lvlBtn(1,'Mudah','Ujung 1 sudah jadi. Susun ujung 2 jadi kabel straight (lurus)',best[1]) +\n    lvlBtn(2,'Sedang','Susun kedua ujung dari ingatan jadi kabel crossover (silang), 2 menit',best[2]) +\n    lvlBtn(3,'Sulit','8 soal acak: tebak jenis kabel, isi pin kosong, cari yang tertukar',best[3]) +\n    '<\/div>' +\n    '<p class=\"foot\">Semua level terbuka. Mulai dari mana saja. Rujukan: Modul Sistem Jaringan Komputer (Pusdiklat BPS, 2025), hal. 43-44.<\/p>';\n  Array.prototype.forEach.call(view.querySelectorAll('.lvl'), function(b){\n    b.addEventListener('click', function(){ startLevel(+b.dataset.l); });\n  });\n}\nfunction lvlBtn(n, name, desc, st){\n  return '<button class=\"lvl\" data-l=\"' + n + '\"><span class=\"no\">' + n + '<\/span>' +\n    '<span><h2>' + name + '<\/h2><p>' + desc + '<\/p><\/span>' + starsHTML(st||0) + '<\/button>';\n}\nfunction startLevel(n){\n  if (n === 3) startQuiz(); else startBoard(n);\n}\n\n/* ===================== level 1 & 2: susun dua ujung ===================== */\nvar TYPE_NAME = {S:'Straight (lurus)', C:'Crossover (silang)'};\nfunction stdArr(s){ return s === 'A' ? T568A : T568B; }\nfunction blank(){ return [null,null,null,null,null,null,null,null]; }\nfunction stdOf(slots){ return eq(slots,T568A) ? 'A' : (eq(slots,T568B) ? 'B' : null); }\nfunction bestMatch(slots){\n  var best = {std:'B', n:-1};\n  ['A','B'].forEach(function(s){\n    var t = stdArr(s), n = 0;\n    for (var i=0;i<8;i++) if (slots[i] === t[i]) n++;\n    if (n > best.n) best = {std:s, n:n};\n  });\n  return best;\n}\nfunction guideHTML(title){\n  var h = '<div class=\"guide\"><h3>' + title + '<\/h3><div class=\"g8 head\"><span class=\"gl\"><\/span>';\n  for (var i=1;i<=8;i++) h += '<b>' + i + '<\/b>';\n  h += '<\/div>';\n  ['A','B'].forEach(function(s){\n    h += '<div class=\"g8\"><span class=\"gl\">T568' + s + '<\/span>';\n    stdArr(s).forEach(function(k){\n      h += '<div class=\"gc\"><div class=\"sw\" style=\"background:' + wireBG(k) + '\"><\/div>' + WIRES[k].s + '<\/div>';\n    });\n    h += '<\/div>';\n  });\n  return h + '<p class=\"rule\">Straight (lurus): kedua ujung urutannya sama. Crossover (silang): satu ujung T568A, ujung lainnya T568B.<\/p><\/div>';\n}\n\nfunction startBoard(level){\n  clearTimer();\n  var game = {level:level, types:[level === 1 ? 'S' : 'C'], round:0, mistakes:0, checks:0, left:120, paused:false, done:false};\n  view.innerHTML =\n    '<div class=\"bar\"><button class=\"back\" id=\"bk\">&larr; Menu<\/button>' +\n    '<h2>Level ' + level + (level === 1 ? ': Mudah' : ': Sedang') + '<\/h2><\/div><div id=\"stage\"><\/div>';\n  document.getElementById('bk').onclick = showMenu;\n  if (level === 2) {\n    timerId = setInterval(function(){\n      if (game.done || game.paused) return;\n      game.left--;\n      var c = document.getElementById('tchip');\n      if (c) { c.textContent = game.left + ' dtk'; c.className = 'chip' + (game.left <= 20 ? ' warn' : ''); }\n      if (game.left <= 0) { game.left = 0; loseGame(game); }\n    }, 1000);\n  }\n  startRound(game);\n}\n\nfunction startRound(game){\n  var level = game.level, type = game.types[game.round];\n  var stage = document.getElementById('stage');\n  var std1 = pick(['A','B']);\n  var secs;\n  if (level === 1) {\n    var t2 = stdArr(type === 'S' ? std1 : (std1 === 'A' ? 'B' : 'A'));\n    secs = [\n      {label:'Ujung 1 (sudah jadi: T568' + std1 + ')', locked:true, slots:stdArr(std1).slice()},\n      {label:'Ujung 2 (susun di sini)', locked:false, slots:blank(), order:shuffle(t2), target:t2}\n    ];\n  } else {\n    secs = [\n      {label:'Ujung 1', locked:false, slots:blank(), order:shuffle(T568B)},\n      {label:'Ujung 2', locked:false, slots:blank(), order:shuffle(T568B)}\n    ];\n  }\n  var st = {secs:secs, sel:null, msg:'', done:false};\n  var drag = null;\n  game.paused = false;\n\n  var task = level === 1\n    ? 'Ujung 1 sudah jadi. Susun Ujung 2 agar kabelnya <b>' + TYPE_NAME[type] + '<\/b>.'\n    : 'Susun kedua ujung agar kabelnya <b>' + TYPE_NAME[type] + '<\/b>.';\n  stage.innerHTML =\n    '<div class=\"status\">' +\n    (level === 1 ? '<span class=\"chip\" id=\"mchip\"><\/span>' : '<span class=\"chip\" id=\"tchip\">' + game.left + ' dtk<\/span>') + '<\/div>' +\n    '<div class=\"task\">' + task + '<\/div>' +\n        '<div id=\"board\" class=\"compact\"><\/div>';\n  var board = document.getElementById('board');\n\n  function wireBtn(k, sel){\n    return '<button class=\"wire' + (sel ? ' sel' : '') + '\" data-key=\"' + k + '\" draggable=\"true\" ' +\n      'style=\"background:' + wireBG(k) + '\" aria-label=\"' + WIRES[k].n + '\"><span class=\"wl\">' + WIRES[k].s + '<\/span><\/button>';\n  }\n  function isSel(si, type_, idx, key){\n    var s = st.sel;\n    if (!s || s.sec !== si || s.type !== type_) return false;\n    return type_ === 'slot' ? s.idx === idx : s.key === key;\n  }\n\n  function draw(){\n    var h = '';\n    st.secs.forEach(function(sec, si){\n      h += '<div class=\"sec' + (sec.locked ? ' locked' : '') + '\" data-sec=\"' + si + '\"><div class=\"seclabel\">' + sec.label + '<\/div><div class=\"plug\">';\n      for (var i=0;i<8;i++){\n        var k = sec.slots[i];\n        var cls = 'slotbox';\n        if (isSel(si,'slot',i)) cls += ' sel';\n        if (!sec.locked && level === 1 && k) cls += (k === sec.target[i] ? ' ok' : ' bad');\n        h += '<div class=\"slot\" data-slot=\"' + i + '\"><div class=\"' + cls + '\">';\n        if (k) {\n          if (sec.locked) h += '<div class=\"wire static\" data-key=\"' + k + '\" style=\"background:' + wireBG(k) + '\"><span class=\"wl\">' + WIRES[k].s + '<\/span><\/div>';\n          else h += wireBtn(k, isSel(si,'slot',i));\n        }\n        h += '<\/div><div class=\"pin\">' + (i+1) + '<\/div><\/div>';\n      }\n      h += '<\/div>';\n      if (!sec.locked) {\n        h += '<div class=\"pool\" data-pool=\"1\">';\n        var inPool = sec.order.filter(function(k){ return sec.slots.indexOf(k) < 0; });\n        if (!inPool.length) h += '<span class=\"empty\">Semua kabel sudah dipasang<\/span>';\n        inPool.forEach(function(k){ h += wireBtn(k, isSel(si,'pool',null,k)); });\n        h += '<\/div>';\n      }\n      h += '<\/div>';\n    });\n    h += '<div class=\"row-btns\"><button class=\"btn alt\" id=\"rs\">Ulangi<\/button>' +\n         (level === 2 ? '<button class=\"btn\" id=\"ck\">Periksa<\/button>' : '') + '<\/div><div class=\"msg\" id=\"msg\"><\/div>';\n    board.innerHTML = h;\n    document.getElementById('msg').textContent = st.msg;\n    var mc = document.getElementById('mchip');\n    if (mc) mc.textContent = 'Salah: ' + game.mistakes;\n    document.getElementById('rs').onclick = function(){\n      if (st.done) return;\n      st.secs.forEach(function(s){ if (!s.locked) s.slots = blank(); });\n      st.sel = null; st.msg = ''; draw();\n    };\n    var ck = document.getElementById('ck');\n    if (ck) ck.onclick = check;\n  }\n\n  function place(si, idx, key, from){\n    var sec = st.secs[si];\n    var prev = sec.slots[idx];\n    if (from !== null && from !== undefined) sec.slots[from] = prev;\n    sec.slots[idx] = key;\n    if (level === 1 && key !== sec.target[idx]) game.mistakes++;\n    st.msg = '';\n  }\n  function afterChange(){\n    draw();\n    if (level === 1 && eq(st.secs[1].slots, st.secs[1].target)) roundDone();\n  }\n\n  board.addEventListener('click', function(e){\n    if (st.done) return;\n    var secEl = e.target.closest('[data-sec]');\n    if (!secEl) return;\n    var si = +secEl.dataset.sec, sec = st.secs[si];\n    if (sec.locked) return;\n    if (st.sel && st.sel.sec !== si) st.sel = null;\n    var slotEl = e.target.closest('[data-slot]');\n    if (slotEl) {\n      var i = +slotEl.dataset.slot;\n      if (st.sel) {\n        if (st.sel.type === 'slot' && st.sel.idx === i) { st.sel = null; draw(); return; }\n        if (st.sel.type === 'slot') place(si, i, st.sel.key, st.sel.idx); else place(si, i, st.sel.key, null);\n        st.sel = null; afterChange();\n      } else if (sec.slots[i]) {\n        st.sel = {sec:si, type:'slot', idx:i, key:sec.slots[i]}; draw();\n      }\n      return;\n    }\n    var pw = e.target.closest('[data-pool] [data-key]');\n    if (pw) {\n      var key = pw.dataset.key;\n      st.sel = (st.sel && st.sel.type === 'pool' && st.sel.key === key) ? null : {sec:si, type:'pool', key:key};\n      draw(); return;\n    }\n    if (e.target.closest('[data-pool]') && st.sel && st.sel.type === 'slot') {\n      sec.slots[st.sel.idx] = null; st.sel = null; draw();\n    }\n  });\n\n  /* drag & drop (desktop) */\n  board.addEventListener('dragstart', function(e){\n    var w = e.target.closest('[data-key]');\n    if (!w || st.done) return;\n    var secEl = w.closest('[data-sec]');\n    if (!secEl || st.secs[+secEl.dataset.sec].locked) return;\n    var s = w.closest('[data-slot]');\n    drag = {sec:+secEl.dataset.sec, key:w.dataset.key, from: s ? +s.dataset.slot : null};\n    try { e.dataTransfer.setData('text/plain', w.dataset.key); e.dataTransfer.effectAllowed = 'move'; } catch(x){}\n  });\n  board.addEventListener('dragover', function(e){\n    if (!drag) return;\n    var secEl = e.target.closest('[data-sec]');\n    if (secEl && +secEl.dataset.sec === drag.sec && e.target.closest('[data-slot],[data-pool]')) e.preventDefault();\n  });\n  board.addEventListener('drop', function(e){\n    if (!drag || st.done) return;\n    var secEl = e.target.closest('[data-sec]');\n    if (!secEl || +secEl.dataset.sec !== drag.sec) { drag = null; return; }\n    var s = e.target.closest('[data-slot]');\n    var p = e.target.closest('[data-pool]');\n    if (s) { e.preventDefault(); place(drag.sec, +s.dataset.slot, drag.key, drag.from); }\n    else if (p && drag.from !== null) { e.preventDefault(); st.secs[drag.sec].slots[drag.from] = null; }\n    else { drag = null; return; }\n    drag = null; st.sel = null; afterChange();\n  });\n\n  /* level 2: periksa */\n  function check(){\n    if (st.done) return;\n    var a = st.secs[0].slots, b = st.secs[1].slots;\n    if (a.indexOf(null) >= 0 || b.indexOf(null) >= 0) { st.msg = 'Pasang semua kabel di kedua ujung dulu.'; draw(); return; }\n    game.checks++;\n    var s1 = stdOf(a), s2 = stdOf(b), parts = [];\n    [[a,s1,'Ujung 1'],[b,s2,'Ujung 2']].forEach(function(x){\n      if (!x[1]) { var m = bestMatch(x[0]); parts.push(x[2] + ': baru ' + m.n + ' dari 8 pin cocok dengan T568' + m.std + '.'); }\n    });\n    if (parts.length) { st.msg = parts.join(' '); draw(); return; }\n    if (type === 'S' && s1 !== s2) { st.msg = 'Kedua ujung sudah sesuai standar, tapi berbeda. Straight (lurus) butuh ujung yang sama.'; draw(); return; }\n    if (type === 'C' && s1 === s2) { st.msg = 'Kedua ujung sama. Crossover (silang) butuh satu ujung T568A dan satu T568B.'; draw(); return; }\n    roundDone();\n  }\n\n  function roundDone(){\n    if (st.done) return;\n    st.done = true; game.paused = true;\n    finishGame(game);\n  }\n\n  draw();\n}\n\nfunction finishGame(game){\n  game.done = true; clearTimer();\n  var level = game.level, stars, stat, msg;\n  if (level === 1) {\n    stars = game.mistakes <= 1 ? 3 : (game.mistakes <= 4 ? 2 : 1);\n    stat = ['Salah letak: ' + game.mistakes];\n    msg = stars === 3 ? 'Rapi. Straight (lurus): ujung 2 sama persis dengan ujung 1.' : 'Berhasil. Straight (lurus) artinya kedua ujung urutannya sama.';\n  } else {\n    stars = game.left >= 60 ? 3 : (game.left >= 25 ? 2 : 1);\n    stat = ['Sisa waktu: ' + game.left + ' dtk', 'Pemeriksaan: ' + game.checks + 'x'];\n    msg = stars === 3 ? 'Rapi. Crossover (silang): T568A di satu ujung, T568B di ujung lainnya.' : 'Berhasil. Ulangi untuk lebih cepat dan tepat.';\n  }\n  saveBest(level, stars);\n  showResult({level:level, stars:stars, title:'Kabel selesai!', text:msg, stats:stat});\n}\nfunction loseGame(game){\n  game.done = true; clearTimer();\n  showResult({level:2, stars:0, title:'Waktu habis', text:'Pelajari urutannya dulu, lalu coba lagi.', stats:['Pemeriksaan: ' + game.checks + 'x'],\n    extra:guideHTML('Urutan yang benar')});\n}\n\n/* ===================== level 3: kuis ===================== */\nvar PAIRS_S = [\n  ['PC','Switch','PC dan Switch berbeda fungsi (dissimilar devices), jadi memakai straight (lurus).'],\n  ['Router','Switch','Router dan Switch berbeda fungsi, jadi memakai straight (lurus).'],\n  ['Router','Hub','Router dan Hub berbeda fungsi, jadi memakai straight (lurus).'],\n  ['PC','Hub','PC dan Hub berbeda fungsi, jadi memakai straight (lurus).']\n];\nvar PAIRS_C = [\n  ['PC','PC','Dua PC (peer-to-peer) adalah perangkat sejenis, jadi memakai crossover (silang).'],\n  ['Switch','Switch','Dua Switch adalah perangkat sejenis, jadi memakai crossover (silang).'],\n  ['Hub','Hub','Dua Hub adalah perangkat sejenis, jadi memakai crossover (silang).'],\n  ['PC','Router','Menurut modul, PC ke Router termasuk crossover (silang).']\n];\nfunction swapPair(arr, i, j){ var a = arr.slice(); var t = a[i]; a[i] = a[j]; a[j] = t; return a; }\nfunction randomPair(){\n  var i = Math.floor(Math.random()*8), j;\n  do { j = Math.floor(Math.random()*8); } while (j === i);\n  return i < j ? [i,j] : [j,i];\n}\nfunction listStd(arr){ return arr.map(function(k,i){ return (i+1) + ' ' + WIRES[k].n; }).join(', '); }\nfunction colorOpt(k){ return {k:k, t:'<span class=\"dot\" style=\"background:' + wireBG(k) + '\"><\/span>' + WIRES[k].n}; }\nfunction opt(k, t){ return {k:k, t:t}; }\nvar TYPEOPTS3 = [opt('S','Straight (lurus)'), opt('C','Crossover (silang)'), opt('X','Tidak sesuai standar')];\nvar TYPEOPTS2 = [opt('S','Straight (lurus)'), opt('C','Crossover (silang)')];\nfunction flip(a, b){ return Math.random() < .5 ? [b, a] : [a, b]; }\n\n/* --- generator soal --- */\nfunction qVisual(t){\n  var std = pick(['A','B']), e1, e2, why;\n  if (t === 'S') {\n    e1 = stdArr(std).slice(); e2 = stdArr(std).slice();\n    why = 'Kedua ujung memakai urutan yang sama (T568' + std + '), jadi ini straight (lurus). Dipakai untuk menghubungkan perangkat berbeda fungsi, misalnya PC ke Switch.';\n  } else if (t === 'C') {\n    e1 = T568A.slice(); e2 = T568B.slice();\n    why = 'Satu ujung T568A dan ujung lainnya T568B (pasangan pin 1,2 bertukar dengan 3,6), jadi ini crossover (silang). Dipakai untuk perangkat sejenis, misalnya PC ke PC atau Switch ke Switch.';\n  } else {\n    var ij = randomPair(), base = stdArr(std).slice();\n    e1 = base; e2 = swapPair(base, ij[0], ij[1]);\n    why = 'Satu ujung menyimpang dari standar: kabel di pin ' + (ij[0]+1) + ' dan pin ' + (ij[1]+1) + ' tertukar. Susunan ini bukan T568A maupun T568B, jadi bukan straight dan bukan crossover.';\n  }\n  var e = flip(e1, e2);\n  return {type:'vis' + t, prompt:'Kabel apa ini?', vis:[{label:'Ujung 1', arr:e[0]}, {label:'Ujung 2', arr:e[1]}], opts:TYPEOPTS3, ans:t, why:why};\n}\nfunction qPair(t){\n  var p = pick(t === 'S' ? PAIRS_S : PAIRS_C);\n  return {type:'pair' + t, prompt:'Kabel apa yang dipakai untuk menghubungkan:', pair:[p[0], p[1]], opts:TYPEOPTS2, ans:t, why:p[2]};\n}\nfunction qWhich(t){\n  var good = pick(t === 'S' ? PAIRS_S : PAIRS_C);\n  var bad = shuffle(t === 'S' ? PAIRS_C : PAIRS_S).slice(0, 3);\n  var all = shuffle([good].concat(bad));\n  return {type:'which' + t, prompt:'Perangkat mana yang dihubungkan dengan kabel ' + (t === 'S' ? 'straight (lurus)' : 'crossover (silang)') + '?',\n    opts:all.map(function(p){ return opt(p[0] + '-' + p[1], p[0] + ' ke ' + p[1]); }), ans:good[0] + '-' + good[1], why:good[2]};\n}\nfunction qPin(){\n  var std = pick(['A','B']), arr = stdArr(std), i = Math.floor(Math.random()*8), c = arr[i];\n  var others = shuffle(Object.keys(WIRES).filter(function(k){ return k !== c; })).slice(0, 3);\n  return {type:'pin', prompt:'Pada urutan T568' + std + ', kabel di pin ' + (i+1) + ' berwarna?',\n    opts:shuffle([c].concat(others)).map(colorOpt), ans:c, why:'T568' + std + ': ' + listStd(arr) + '.'};\n}\nfunction qMissing(){\n  var std = pick(['A','B']), arr = stdArr(std), i = 1 + Math.floor(Math.random()*7), c = arr[i];\n  var others = shuffle(Object.keys(WIRES).filter(function(k){ return k !== c; })).slice(0, 3);\n  return {type:'missing', prompt:'Satu pin masih kosong (?). Warna apa yang tepat agar urutannya sesuai standar T568A atau T568B?',\n    vis:[{label:'Satu ujung kabel', arr:arr, hide:i}], opts:shuffle([c].concat(others)).map(colorOpt), ans:c,\n    why:'Pin 1 menunjukkan urutan ini adalah T568' + std + ': ' + listStd(arr) + '.'};\n}\nfunction qComplete(t){\n  var std = pick(['A','B']), other = std === 'A' ? 'B' : 'A', ans = t === 'S' ? std : other;\n  return {type:'complete' + t, prompt:'Ujung 1 memakai T568' + std + '. Agar kabel ini ' + (t === 'S' ? 'straight (lurus)' : 'crossover (silang)') + ', Ujung 2 harus memakai?',\n    vis:[{label:'Ujung 1 (T568' + std + ')', arr:stdArr(std)}, {label:'Ujung 2', arr:null}],\n    opts:[opt('A','T568A'), opt('B','T568B'), opt('X','Urutan bebas, asal 8 kabel lengkap')], ans:ans,\n    why: t === 'S' ? 'Straight: kedua ujung urutannya sama, jadi Ujung 2 juga T568' + std + '.' : 'Crossover: satu ujung T568A dan ujung lainnya T568B, jadi Ujung 2 memakai T568' + other + '.'};\n}\nfunction qDiff(){\n  var e = flip(T568A, T568B);\n  var o = [opt('p1236','Pin 1, 2, 3, dan 6'), opt('p1278','Pin 1, 2, 7, dan 8'), opt('p4578','Pin 4, 5, 7, dan 8'), opt('pall','Semua pin')];\n  return {type:'diff', prompt:'Pada kabel crossover ini, pin mana saja yang warnanya berbeda antara Ujung 1 dan Ujung 2?',\n    vis:[{label:'Ujung 1', arr:e[0].slice()}, {label:'Ujung 2', arr:e[1].slice()}], opts:shuffle(o), ans:'p1236',\n    why:'Pasangan oranye dan hijau saling bertukar (pin 1,2 dengan pin 3,6). Pin 4, 5, 7, dan 8 (biru dan coklat) sama di kedua ujung.'};\n}\nfunction pinTxt(p){ return 'Pin ' + (p[0]+1) + ' dan pin ' + (p[1]+1); }\nfunction qSwap(){\n  var std = pick(['A','B']), base = stdArr(std).slice(), ij = randomPair(), bad = swapPair(base, ij[0], ij[1]);\n  var seen = {}, key = function(p){ return p[0] + '-' + p[1]; }; seen[key(ij)] = 1;\n  var opts = [opt(key(ij), pinTxt(ij))];\n  while (opts.length < 4) { var p = randomPair(); if (!seen[key(p)]) { seen[key(p)] = 1; opts.push(opt(key(p), pinTxt(p))); } }\n  var e = flip(base, bad);\n  return {type:'swap', prompt:'Satu ujung menyimpang dari standar T568' + std + ' karena dua kabel tertukar. Pin berapa yang tertukar?',\n    vis:[{label:'Ujung 1', arr:e[0]}, {label:'Ujung 2', arr:e[1]}], opts:shuffle(opts), ans:key(ij),\n    why:'Hanya dua pin yang berbeda antar ujung: ' + pinTxt(ij).toLowerCase() + ' (' + WIRES[base[ij[0]]].n + ' dan ' + WIRES[base[ij[1]]].n + ').'};\n}\nvar KNOW = [\n  {type:'know', prompt:'Menurut modul, kabel straight umumnya mengikuti standar?', ans:'b',\n   opts:[opt('a','T568A di satu ujung dan T568B di ujung lain'), opt('b','T568B di kedua ujung'), opt('c','Urutan warna bebas'), opt('d','Hanya T568A')],\n   why:'Modul (hal. 43): straight-through memakai urutan yang sama di kedua ujung, umumnya TIA/EIA-568B.'},\n  {type:'know', prompt:'Konektor yang dipasang pada ujung kabel UTP untuk jaringan LAN adalah?', ans:'c',\n   opts:[opt('a','BNC'), opt('b','RJ-11'), opt('c','RJ-45'), opt('d','SC')],\n   why:'Modul membahas pemasangan konektor RJ-45 pada kabel UTP.'},\n  {type:'know', prompt:'Menurut modul, kabel UTP yang umum dipakai untuk koneksi wired adalah?', ans:'b',\n   opts:[opt('a','Category 3 untuk telepon'), opt('b','Category 6 atau 6a'), opt('c','Coaxial RG-58 (BNC)'), opt('d','Kabel telepon biasa')],\n   why:'Modul (hal. 43): kabel UTP Category 6/6a umum digunakan untuk koneksi wired.'},\n  {type:'know', prompt:'Standar structured cabling yang dirujuk modul adalah?', ans:'a',\n   opts:[opt('a','TIA/EIA-568'), opt('b','ISO/IEC 27001'), opt('c','IEEE 802.11ax'), opt('d','COBIT')],\n   why:'Modul (hal. 43): structured cabling system mengikuti standar TIA/EIA-568.'}\n];\nfunction makeQuestions(){\n  var g1 = [function(){return qVisual('S');}, function(){return qVisual('C');}, function(){return qVisual('X');},\n            function(){return qPair('S');}, function(){return qPair('C');}, function(){return qWhich('S');}, function(){return qWhich('C');}];\n  var g2 = [qPin, qMissing, function(){return qComplete('S');}, function(){return qComplete('C');}, qDiff, qSwap];\n  var g3 = KNOW.map(function(k){ return function(){ var q = JSON.parse(JSON.stringify(k)); q.opts = shuffle(q.opts); return q; }; });\n  var s1 = shuffle(g1), s2 = shuffle(g2), s3 = shuffle(g3);\n  var chosen = s1.slice(0,3).concat(s2.slice(0,3), s3.slice(0,1));\n  var rest = s1.slice(3).concat(s2.slice(3), s3.slice(1));\n  chosen.push(pick(rest));\n  return shuffle(chosen).map(function(f){ return f(); });\n}\n\nfunction startQuiz(){\n  clearTimer();\n  var qs = makeQuestions();\n  var idx = 0, score = 0, answered = false;\n\n  function endsHTML(vis){\n    var h = '<div class=\"ends\">';\n    vis.forEach(function(v){\n      h += '<div class=\"end\"><div class=\"lab\">' + v.label + '<\/div><div class=\"e8\">';\n      for (var i=0;i<8;i++){\n        var k = v.arr ? v.arr[i] : null;\n        if (!v.arr || v.hide === i) h += '<div class=\"ec\"><b>' + (i+1) + '<\/b><div class=\"chipc q\">?<\/div>&nbsp;<\/div>';\n        else h += '<div class=\"ec\"><b>' + (i+1) + '<\/b><div class=\"chipc\" style=\"background:' + wireBG(k) + '\"><\/div>' + WIRES[k].s + '<\/div>';\n      }\n      h += '<\/div><\/div>';\n    });\n    return h + '<\/div><p class=\"legend\">P = Putih, Or = Oranye, Hj = Hijau, Bi = Biru, Cl = Coklat<\/p>';\n  }\n\n  function render(){\n    var q = qs[idx];\n    var h = '<div class=\"bar\"><button class=\"back\" id=\"bk\">&larr; Menu<\/button><h2>Level 3: Sulit<\/h2>' +\n            '<span class=\"chip\">Soal ' + (idx+1) + '/' + qs.length + '<\/span><\/div><div class=\"qcard\"><h3>' + q.prompt + '<\/h3>';\n    if (q.vis) h += endsHTML(q.vis);\n    if (q.pair) h += '<div class=\"pair\"><span class=\"dev\">' + q.pair[0] + '<\/span><span class=\"ln\"><\/span><span class=\"dev\">' + q.pair[1] + '<\/span><\/div>';\n    h += '<div class=\"opts\" id=\"opts\">';\n    q.opts.forEach(function(o){ h += '<button class=\"opt\" data-a=\"' + o.k + '\">' + o.t + '<\/button>'; });\n    h += '<\/div><div id=\"fb\"><\/div><\/div>';\n    view.innerHTML = h;\n    answered = false;\n    document.getElementById('bk').onclick = showMenu;\n    Array.prototype.forEach.call(view.querySelectorAll('.opt'), function(b){\n      b.addEventListener('click', function(){ answer(b); });\n    });\n  }\n\n  function answer(btn){\n    if (answered) return;\n    answered = true;\n    var q = qs[idx];\n    var right = btn.dataset.a === q.ans;\n    if (right) score++;\n    Array.prototype.forEach.call(view.querySelectorAll('.opt'), function(b){\n      b.disabled = true;\n      if (b.dataset.a === q.ans) b.classList.add('right');\n      else if (b === btn) b.classList.add('wrong');\n    });\n    var last = idx === qs.length - 1;\n    document.getElementById('fb').innerHTML =\n      '<div class=\"fb ' + (right ? 'ok' : 'bad') + '\"><b>' + (right ? 'Benar' : 'Belum tepat') + '<\/b>' + q.why + '<\/div>' +\n      '<div class=\"row-btns\"><button class=\"btn\" id=\"nx\">' + (last ? 'Lihat hasil' : 'Soal berikutnya') + '<\/button><\/div>';\n    document.getElementById('nx').onclick = function(){\n      if (last) finish(); else { idx++; render(); }\n    };\n    document.getElementById('nx').focus();\n  }\n\n  function finish(){\n    var stars = score >= 7 ? 3 : (score >= 5 ? 2 : (score >= 3 ? 1 : 0));\n    saveBest(3, stars);\n    var text = stars === 3 ? 'Hampir sempurna. Kabel apa pun, bisa lu baca.' : (stars === 2 ? 'Bagus. Perhatikan ujung yang tertukar.' : 'Ulangi dan perhatikan pin 1, 2, 3, dan 6.');\n    showResult({level:3, stars:stars, title:'Skor ' + score + ' dari ' + qs.length, text:text, stats:[],\n      note:'Catatan: aturan di atas mengikuti modul (klasik). Perangkat modern umumnya sudah Auto-MDIX, sehingga kabel straight pun biasanya tetap bisa dipakai antar perangkat sejenis.'});\n  }\n  render();\n}\n\n/* ===================== hasil ===================== */\nfunction showResult(r){\n  var h = '<div class=\"result\">' + starsHTML(r.stars) + '<h2>' + r.title + '<\/h2><p>' + r.text + '<\/p>';\n  if (r.stats && r.stats.length) h += '<div class=\"stat\">' + r.stats.map(function(s){ return '<span>' + s + '<\/span>'; }).join('') + '<\/div>';\n  if (r.extra) h += '<div style=\"margin-top:14px\">' + r.extra + '<\/div>';\n  h += '<div class=\"row-btns\">' +\n       '<button class=\"btn alt\" id=\"rm\">Menu<\/button>' +\n       '<button class=\"btn\" id=\"ra\">Main lagi<\/button>' +\n       (r.level < 3 && r.stars > 0 ? '<button class=\"btn dark\" id=\"rn\">Level ' + (r.level+1) + '<\/button>' : '') +\n       '<\/div>';\n  if (r.note) h += '<p class=\"note\">' + r.note + '<\/p>';\n  h += '<\/div>';\n  view.innerHTML = h;\n  document.getElementById('rm').onclick = showMenu;\n  document.getElementById('ra').onclick = function(){ startLevel(r.level); };\n  var rn = document.getElementById('rn');\n  if (rn) rn.onclick = function(){ startLevel(r.level + 1); };\n}\n\nshowMenu();\n<\/script>\n<\/body>\n<\/html>\n"},
  {key:'osi', title:'Sortir OSI', emoji:'🧱', tema:'Sisjarkom', desc:'Kelompokkan protokol dan perangkat ke 7 layer OSI.', html:"<!DOCTYPE html>\n<html lang=\"id\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Sortir OSI<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&display=swap\" rel=\"stylesheet\">\n<style>\n:root{\n  box-sizing:border-box;\n  padding-top:env(safe-area-inset-top,0px);\n  padding-bottom:env(safe-area-inset-bottom,0px);\n  --bg:#FFF9F3; --card:#FFFFFF; --ink:#182255; --muted:#566086;\n  --accent:#F79039; --accent-2:#FEBD26;\n  --peach:#FCDDC2; --peach-2:#FBCCA4; --line:#F3D3B6;\n  --ok:#14805A; --ok-bg:#DDF4EA; --bad:#C23A3A; --bad-bg:#FBE1E1;\n  --term:#101636; --term-ink:#D9F7E8;\n}\n@media (prefers-color-scheme: dark){\n  :root:not([data-theme=\"light\"]){\n    --bg:#121731; --card:#1B2347; --ink:#F4EFE8; --muted:#AAB1D3;\n    --peach:#2A3263; --peach-2:#36407A; --line:#3A4580;\n    --ok:#4CD6A0; --ok-bg:#12382C; --bad:#FF8A8A; --bad-bg:#44202A;\n    --term:#0A0E24;\n  }\n}\n:root[data-theme=\"dark\"]{\n  --bg:#121731; --card:#1B2347; --ink:#F4EFE8; --muted:#AAB1D3;\n  --peach:#2A3263; --peach-2:#36407A; --line:#3A4580;\n  --ok:#4CD6A0; --ok-bg:#12382C; --bad:#FF8A8A; --bad-bg:#44202A;\n  --term:#0A0E24;\n}\nhtml{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}\n*,*::before,*::after{box-sizing:inherit}\nbody{margin:0;min-height:100%;background:var(--bg);color:var(--ink);\n  font-family:Arial,\"Helvetica Neue\",sans-serif;font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}\nh1,h2,h3{font-family:Montserrat,Arial,sans-serif;margin:0;line-height:1.2}\nbutton{font:inherit;color:inherit;cursor:pointer}\nbutton:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent-2);outline-offset:2px}\n.app{max-width:720px;margin:0 auto;padding:16px 14px 28px}\n\n/* menu */\n.hero{background:var(--accent);color:#fff;border-radius:22px;padding:22px 20px 20px;position:relative;overflow:hidden}\n.hero h1{font-size:clamp(26px,7vw,34px);font-weight:800;color:#fff;padding-right:84px}\n.hero p{margin:8px 0 0;color:#FFF3E6;padding-right:84px}\n.hero .decor{position:absolute;right:14px;top:14px;font-size:58px;line-height:1;transform:rotate(-6deg)}\n.levels{display:grid;gap:12px;margin-top:16px}\n.lvl{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;text-align:left;\n  background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px 16px;width:100%}\n.lvl:hover{border-color:var(--accent)}\n.lvl .no{width:46px;height:46px;border-radius:50%;background:var(--peach);display:grid;place-items:center;\n  font-family:Montserrat,Arial,sans-serif;font-weight:800;font-size:20px}\n.lvl h2{font-size:17px}\n.lvl p{margin:3px 0 0;color:var(--muted);font-size:14px}\n.stars{font-size:20px;letter-spacing:2px;color:var(--accent-2);white-space:nowrap}\n.stars .off{color:var(--line)}\n.foot{margin-top:18px;color:var(--muted);font-size:13px}\n\n/* bar */\n.bar{display:flex;align-items:center;gap:10px;margin-bottom:12px}\n.back{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:8px 12px;font-weight:700}\n.bar h2{font-size:18px;flex:1}\n.chip{background:var(--peach);border-radius:999px;padding:6px 14px;font-weight:700;font-size:14px;white-space:nowrap}\n.chip.warn{background:var(--bad-bg);color:var(--bad)}\n.chip.good{background:var(--ok-bg);color:var(--ok)}\n.status{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}\n.task{background:var(--peach);border-radius:14px;padding:12px 14px;margin-bottom:12px;font-size:15.5px}\n.hint{margin:0 0 12px;color:var(--muted);font-size:14.5px}\n.btn{border:0;border-radius:14px;padding:12px 18px;font-weight:700;background:var(--accent);color:#fff;flex:1}\n.btn.alt{background:var(--card);color:var(--ink);border:2px solid var(--line)}\n.btn.dark{background:var(--ink);color:var(--bg)}\n.btn:disabled{opacity:.5;cursor:default}\n.row-btns{display:flex;gap:10px;margin-top:14px}\n.msg{margin-top:12px;min-height:22px;font-weight:700;text-align:center}\n\n/* quiz */\n.qcard{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px}\n.qcard h3{font-size:17px;margin-bottom:6px}\n.ctx{margin:0 0 10px;font-size:15px}\n.clue{background:var(--peach);border-radius:12px;padding:10px 12px;margin:0 0 10px;font-size:14.5px}\n.clue b{display:block;margin-bottom:2px}\n.opts{display:grid;gap:10px;margin-top:12px}\n.opts.cols2{grid-template-columns:1fr 1fr}\n.opt{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:12px 14px;text-align:left;font-weight:700;font-size:15px}\n.opt:hover:not(:disabled){border-color:var(--accent)}\n.opt.right{background:var(--ok-bg);border-color:var(--ok)}\n.opt.wrong{background:var(--bad-bg);border-color:var(--bad)}\n.fb{margin-top:14px;border-radius:14px;padding:12px 14px;font-size:14.5px}\n.fb.ok{background:var(--ok-bg)} .fb.bad{background:var(--bad-bg)}\n.fb b{display:block;margin-bottom:2px}\n\n/* sorter */\n.spool{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:6px 0 8px;margin-bottom:8px}\n.spool .box{border:2px dashed var(--line);border-radius:16px;background:var(--card);padding:8px;display:flex;flex-wrap:wrap;gap:6px;\n  justify-content:center;max-height:34vh;overflow:auto;min-height:56px;align-items:center}\n.scard{border:2px solid var(--peach-2);background:var(--peach);border-radius:12px;padding:7px 11px;font-weight:700;font-size:14px;text-align:left}\n.scard.sel{outline:3px solid var(--accent-2);transform:translateY(-2px);border-color:var(--accent)}\n.scard.ok{background:var(--ok-bg);border-color:var(--ok)}\n.scard.bad{background:var(--bad-bg);border-color:var(--bad)}\n.spool .empty{color:var(--muted);font-size:14px}\n.bin{border:2px solid var(--line);background:var(--card);border-radius:16px;padding:9px 11px 10px;margin-bottom:8px;cursor:pointer}\n.bin.target{border-color:var(--accent);background:var(--peach)}\n.bin .bl{font-weight:800;font-size:14.5px}\n.bin .bs{font-weight:400;color:var(--muted);font-size:12.5px;margin-left:6px}\n.bin .items{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;min-height:6px}\n\n/* order */\n.slots{display:grid;gap:8px}\n.slot{display:flex;gap:10px;align-items:stretch;min-height:46px}\n.slot .n{flex:0 0 34px;border-radius:10px;background:var(--peach);display:grid;place-items:center;font-weight:800}\n.slot .c{flex:1;border:2px dashed var(--line);border-radius:12px;padding:8px 12px;display:flex;align-items:center;text-align:left;\n  background:var(--card);font-size:14.5px;min-height:46px}\n.slot .c.filled{border-style:solid;border-color:var(--peach-2);background:var(--peach);font-weight:700;cursor:pointer}\n.slot .c.locked{background:var(--card);border-color:var(--ink);cursor:default}\n.slot .c.ok{background:var(--ok-bg);border-color:var(--ok)}\n.slot .c.bad{background:var(--bad-bg);border-color:var(--bad)}\n.slot .lab{display:block;font-size:12px;color:var(--muted);font-weight:400}\n.opool{margin-top:12px;display:grid;gap:8px;padding:10px;border:2px dashed var(--line);border-radius:16px;background:var(--card)}\n.opool.g2{grid-template-columns:1fr 1fr}\n.ocard{border:2px solid var(--peach-2);background:var(--peach);border-radius:12px;padding:9px 12px;font-weight:700;font-size:14px;text-align:left}\n.opool .empty{color:var(--muted);font-size:14px;grid-column:1/-1;text-align:center}\n.reveal{margin-top:12px;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 14px}\n.reveal ol{margin:6px 0 0;padding-left:20px}\n.reveal li{margin-bottom:6px;font-size:14.5px}\n\n/* result */\n.result{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:24px 18px;text-align:center}\n.result .stars{font-size:46px;margin:6px 0 4px}\n.result h2{font-size:22px}\n.result p{color:var(--muted);margin:6px auto 0;max-width:44ch}\n.stat{display:flex;justify-content:center;gap:10px;margin:14px 0 4px;flex-wrap:wrap}\n.stat span{background:var(--peach);border-radius:999px;padding:6px 14px;font-weight:700;font-size:14px}\n.result .row-btns{flex-wrap:wrap}\n.result .row-btns .btn{min-width:130px}\n.extra{margin-top:14px;text-align:left}\n.note{margin-top:14px;font-size:12.5px;color:var(--muted);text-align:left}\n@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}\n\n\n<\/style>\n<\/head>\n<body>\n<div class=\"app\" id=\"view\"><\/div>\n<script>\n/* ===================== util umum ===================== */\nvar GAME = null;\nvar view = document.getElementById('view');\nvar timerId = null;\nfunction clearTimer(){ if (timerId){ clearInterval(timerId); timerId = null; } }\nfunction shuffle(a){\n  a = a.slice();\n  for (var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }\n  return a;\n}\nfunction pick(a){ return a[Math.floor(Math.random()*a.length)]; }\nfunction esc(s){ return String(s).replace(/&/g,'&amp;').replace(/<\/g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;'); }\nfunction eqArr(a,b){ if (a.length !== b.length) return false; for (var i=0;i<a.length;i++){ if (a[i]!==b[i]) return false; } return true; }\n\nfunction loadBest(){\n  try { var r = localStorage.getItem('best_' + GAME.key); if (r) return JSON.parse(r); } catch(e){}\n  return {1:0,2:0,3:0};\n}\nfunction saveBest(level, stars){\n  try {\n    var b = loadBest();\n    if (stars > (b[level]||0)) { b[level] = stars; localStorage.setItem('best_' + GAME.key, JSON.stringify(b)); }\n  } catch(e){}\n}\nfunction starsHTML(n){\n  var s = '<span class=\"stars\" aria-label=\"' + n + ' dari 3 bintang\">';\n  for (var i=1;i<=3;i++) s += i<=n ? '★' : '<span class=\"off\">★<\/span>';\n  return s + '<\/span>';\n}\nfunction barHTML(title, chip){\n  return '<div class=\"bar\"><button class=\"back\" id=\"bk\">&larr; Menu<\/button><h2>' + title + '<\/h2>' + (chip||'') + '<\/div>';\n}\nfunction bindBack(){ var b = document.getElementById('bk'); if (b) b.onclick = showMenu; }\nfunction levelTitle(n){ return 'Level ' + n + ': ' + ['Mudah','Sedang','Sulit'][n-1]; }\n\n/* ===================== menu ===================== */\nfunction showMenu(){\n  clearTimer();\n  var best = loadBest(), h = '';\n  h += '<div class=\"hero\"><div class=\"decor\" aria-hidden=\"true\">' + GAME.emoji + '<\/div><h1>' + GAME.title + '<\/h1><p>' + GAME.intro + '<\/p><\/div><div class=\"levels\">';\n  GAME.levels.forEach(function(l, i){\n    h += '<button class=\"lvl\" data-l=\"' + (i+1) + '\"><span class=\"no\">' + (i+1) + '<\/span><span><h2>' + l[0] + '<\/h2><p>' + l[1] + '<\/p><\/span>' + starsHTML(best[i+1]||0) + '<\/button>';\n  });\n  h += '<\/div><p class=\"foot\">Semua level terbuka. Mulai dari mana saja. ' + GAME.foot + '<\/p>';\n  view.innerHTML = h;\n  Array.prototype.forEach.call(view.querySelectorAll('.lvl'), function(b){\n    b.addEventListener('click', function(){ GAME.start(+b.dataset.l); });\n  });\n}\n\n/* ===================== hasil ===================== */\nfunction showResult(r){\n  clearTimer();\n  var h = '<div class=\"result\">' + starsHTML(r.stars) + '<h2>' + r.title + '<\/h2><p>' + r.text + '<\/p>';\n  if (r.stats && r.stats.length) h += '<div class=\"stat\">' + r.stats.map(function(s){ return '<span>' + s + '<\/span>'; }).join('') + '<\/div>';\n  if (r.extra) h += '<div class=\"extra\">' + r.extra + '<\/div>';\n  h += '<div class=\"row-btns\"><button class=\"btn alt\" id=\"rm\">Menu<\/button><button class=\"btn\" id=\"ra\">Main lagi<\/button>' +\n       (r.level < 3 && r.stars > 0 ? '<button class=\"btn dark\" id=\"rn\">Level ' + (r.level+1) + '<\/button>' : '') + '<\/div>';\n  if (r.note) h += '<p class=\"note\">' + r.note + '<\/p>';\n  view.innerHTML = h + '<\/div>';\n  document.getElementById('rm').onclick = showMenu;\n  document.getElementById('ra').onclick = function(){ GAME.start(r.level); };\n  var rn = document.getElementById('rn');\n  if (rn) rn.onclick = function(){ GAME.start(r.level + 1); };\n}\nfunction starsBy(v, hi, mid, lo){ return v >= hi ? 3 : (v >= mid ? 2 : (v >= lo ? 1 : 0)); }\nfunction starsLow(v, a, b){ return v <= a ? 3 : (v <= b ? 2 : 1); }   /* makin kecil makin baik */\n\n/* ===================== komponen: kuis pilihan ===================== */\n/* cfg: {level,title,qs:[{ctx,clue,cluelabel,prompt,opts:[{k,t,fb}],ans,why}],perQ,cols,finish(score,total)} */\nfunction runQuiz(cfg){\n  clearTimer();\n  var qs = cfg.qs, idx = 0, score = 0, answered = false, left = 0;\n  function render(){\n    clearTimer(); answered = false;\n    var q = qs[idx];\n    var h = barHTML(cfg.title, '<span class=\"chip\">Soal ' + (idx+1) + '/' + qs.length + '<\/span>');\n    h += '<div class=\"status\"><span class=\"chip\">Skor: ' + score + '<\/span>' + (cfg.perQ ? '<span class=\"chip\" id=\"tchip\">' + cfg.perQ + ' dtk<\/span>' : '') + '<\/div>';\n    h += '<div class=\"qcard\">';\n    if (q.ctx) h += '<p class=\"ctx\">' + q.ctx + '<\/p>';\n    if (q.clue) h += '<div class=\"clue\"><b>' + (q.cluelabel || 'Temuan') + '<\/b>' + q.clue + '<\/div>';\n    h += '<h3>' + q.prompt + '<\/h3><div class=\"opts' + (cfg.cols === 2 ? ' cols2' : '') + '\">';\n    q.opts.forEach(function(o){ h += '<button class=\"opt\" data-k=\"' + o.k + '\">' + o.t + '<\/button>'; });\n    h += '<\/div><div id=\"fb\"><\/div><\/div>';\n    view.innerHTML = h;\n    bindBack();\n    Array.prototype.forEach.call(view.querySelectorAll('.opt'), function(b){\n      b.addEventListener('click', function(){ answer(b.dataset.k); });\n    });\n    if (cfg.perQ) {\n      left = cfg.perQ;\n      timerId = setInterval(function(){\n        left--;\n        var c = document.getElementById('tchip');\n        if (c) { c.textContent = left + ' dtk'; c.className = 'chip' + (left <= 5 ? ' warn' : ''); }\n        if (left <= 0) { clearTimer(); answer(null); }\n      }, 1000);\n    }\n  }\n  function answer(k){\n    if (answered) return;\n    answered = true; clearTimer();\n    var q = qs[idx];\n    var right = (k !== null && String(k) === String(q.ans));\n    if (right) score++;\n    var chosen = null, correct = null;\n    q.opts.forEach(function(o){ if (String(o.k) === String(k)) chosen = o; if (String(o.k) === String(q.ans)) correct = o; });\n    Array.prototype.forEach.call(view.querySelectorAll('.opt'), function(b){\n      b.disabled = true;\n      if (String(b.dataset.k) === String(q.ans)) b.classList.add('right');\n      else if (k !== null && b.dataset.k === String(k)) b.classList.add('wrong');\n    });\n    var txt = '';\n    if (k === null) txt += 'Waktu habis. ';\n    if (!right && chosen && chosen.fb) txt += chosen.fb + ' ';\n    if (!right && correct) txt += 'Jawaban tepat: ' + correct.t + '. ';\n    if (right && correct && correct.fb) txt += correct.fb + ' ';\n    if (q.why) txt += q.why;\n    var last = idx === qs.length - 1;\n    document.getElementById('fb').innerHTML =\n      '<div class=\"fb ' + (right ? 'ok' : 'bad') + '\"><b>' + (right ? 'Benar' : (k === null ? 'Waktu habis' : 'Belum tepat')) + '<\/b>' + txt + '<\/div>' +\n      '<div class=\"row-btns\"><button class=\"btn\" id=\"nx\">' + (last ? 'Lihat hasil' : 'Lanjut') + '<\/button><\/div>';\n    var nx = document.getElementById('nx');\n    nx.onclick = function(){ if (last) cfg.finish(score, qs.length); else { idx++; render(); } };\n    nx.focus();\n  }\n  render();\n}\n\n/* ===================== komponen: urutkan ===================== */\n/* cfg: {level,title,task,items:[{id,t}] (urutan benar),labels,locked:[idx],feedback:'live'|'marks'|'count',timer,g2,reveal,\n         onDone(res),onTimeout(res)} */\nfunction runOrder(cfg){\n  clearTimer();\n  var items = cfg.items, n = items.length, byId = {};\n  items.forEach(function(it){ byId[it.id] = it; });\n  var st = {slots:[], locked:{}, done:false, mistakes:0, checks:0, left:cfg.timer || 0, msg:'', marks:null};\n  for (var i=0;i<n;i++) st.slots.push(null);\n  (cfg.locked || []).forEach(function(i){ st.slots[i] = items[i].id; st.locked[i] = true; });\n  var poolOrder = shuffle(items.map(function(it){ return it.id; })).filter(function(id){ return st.slots.indexOf(id) < 0; });\n  var fbk = cfg.feedback;\n\n  view.innerHTML = barHTML(cfg.title, '') + '<div id=\"stage\"><\/div>';\n  bindBack();\n  var stage = document.getElementById('stage');\n\n  function chipHTML(){\n    if (cfg.timer) return '<span class=\"chip\" id=\"tchip\">' + st.left + ' dtk<\/span>';\n    if (fbk === 'live') return '<span class=\"chip\" id=\"mchip\">Salah: ' + st.mistakes + '<\/span>';\n    return '<span class=\"chip\" id=\"mchip\">Periksa: ' + st.checks + 'x<\/span>';\n  }\n  function draw(){\n    var h = '<div class=\"status\">' + chipHTML() + '<\/div><div class=\"task\">' + cfg.task + '<\/div><div class=\"slots\" id=\"slots\">';\n    for (var i=0;i<n;i++){\n      var id = st.slots[i], cls = 'c';\n      if (id) {\n        cls += st.locked[i] ? ' locked' : ' filled';\n        if (!st.locked[i]) {\n          if (fbk === 'live') cls += (id === items[i].id ? ' ok' : ' bad');\n          else if (st.marks) cls += (st.marks[i] ? ' ok' : ' bad');\n        }\n      }\n      h += '<div class=\"slot\" data-i=\"' + i + '\"><div class=\"n\">' + (i+1) + '<\/div><div class=\"' + cls + '\">';\n      if (id) h += '<span>' + (cfg.labels && cfg.showLabels ? '<span class=\"lab\">' + cfg.labels[i] + '<\/span>' : '') + esc(byId[id].t) + (st.locked[i] ? ' <span class=\"lab\" style=\"display:inline\">(terkunci)<\/span>' : '') + '<\/span>';\n      else h += '<span class=\"lab\" style=\"color:var(--muted)\">Tap kartu di bawah<\/span>';\n      h += '<\/div><\/div>';\n    }\n    h += '<\/div><div class=\"opool' + (cfg.g2 ? ' g2' : '') + '\" id=\"opool\">';\n    var inPool = poolOrder.filter(function(id){ return st.slots.indexOf(id) < 0; });\n    if (!inPool.length) h += '<span class=\"empty\">Semua kartu sudah dipasang<\/span>';\n    inPool.forEach(function(id){ h += '<button class=\"ocard\" data-id=\"' + id + '\">' + esc(byId[id].t) + '<\/button>'; });\n    h += '<\/div><div class=\"row-btns\"><button class=\"btn alt\" id=\"rs\">Ulangi<\/button>' +\n         (fbk !== 'live' ? '<button class=\"btn\" id=\"ck\">Periksa<\/button>' : '') + '<\/div><div class=\"msg\" id=\"msg\"><\/div>';\n    stage.innerHTML = h;\n    document.getElementById('msg').textContent = st.msg;\n    document.getElementById('rs').onclick = function(){\n      if (st.done) return;\n      for (var i=0;i<n;i++) if (!st.locked[i]) st.slots[i] = null;\n      st.msg = ''; st.marks = null; draw();\n    };\n    var ck = document.getElementById('ck');\n    if (ck) ck.onclick = check;\n  }\n  function firstEmpty(){ for (var i=0;i<n;i++) if (st.slots[i] === null) return i; return -1; }\n  function allCorrect(){ for (var i=0;i<n;i++) if (st.slots[i] !== items[i].id) return false; return true; }\n\n  stage.addEventListener('click', function(e){\n    if (st.done) return;\n    var oc = e.target.closest('.ocard');\n    if (oc) {\n      var i = firstEmpty();\n      if (i < 0) return;\n      st.slots[i] = oc.dataset.id; st.msg = ''; st.marks = null;\n      if (fbk === 'live' && oc.dataset.id !== items[i].id) st.mistakes++;\n      draw();\n      if (fbk === 'live') {\n        if (allCorrect()) finish();\n        else if (firstEmpty() < 0) { st.msg = 'Tap kartu yang merah untuk mengembalikannya, lalu coba lagi.'; draw(); }\n      }\n      return;\n    }\n    var sl = e.target.closest('.slot');\n    if (sl) {\n      var j = +sl.dataset.i;\n      if (st.slots[j] && !st.locked[j]) { st.slots[j] = null; st.msg = ''; st.marks = null; draw(); }\n    }\n  });\n\n  function check(){\n    if (st.done) return;\n    if (firstEmpty() >= 0) { st.msg = 'Isi semua posisi dulu.'; draw(); return; }\n    st.checks++;\n    var ok = 0, marks = [];\n    for (var i=0;i<n;i++){ var m = st.slots[i] === items[i].id; marks.push(m); if (m) ok++; }\n    if (ok === n) { finish(); return; }\n    st.marks = fbk === 'marks' ? marks : null;\n    st.msg = ok + ' dari ' + n + ' posisi sudah benar. Coba lagi.';\n    draw();\n  }\n  function finish(){\n    if (st.done) return;\n    st.done = true; clearTimer();\n    var res = {mistakes:st.mistakes, checks:st.checks, left:st.left, ok:true};\n    if (cfg.reveal) {\n      var h = '<div class=\"reveal\"><b>Urutan yang benar<\/b><ol>';\n      items.forEach(function(it, i){ h += '<li>' + (cfg.labels ? '<b>' + cfg.labels[i] + ':<\/b> ' : '') + esc(it.t) + '<\/li>'; });\n      h += '<\/ol><\/div><div class=\"row-btns\"><button class=\"btn\" id=\"go\">Lanjut<\/button><\/div>';\n      stage.innerHTML = '<div class=\"status\"><span class=\"chip good\">Urutan benar<\/span><\/div>' + h;\n      document.getElementById('go').onclick = function(){ cfg.onDone(res); };\n    } else cfg.onDone(res);\n  }\n  if (cfg.timer) {\n    timerId = setInterval(function(){\n      if (st.done) return;\n      st.left--;\n      var c = document.getElementById('tchip');\n      if (c) { c.textContent = st.left + ' dtk'; c.className = 'chip' + (st.left <= 15 ? ' warn' : ''); }\n      if (st.left <= 0) { st.left = 0; st.done = true; clearTimer(); if (cfg.onTimeout) cfg.onTimeout({checks:st.checks}); }\n    }, 1000);\n  }\n  draw();\n}\n\n/* ===================== komponen: sortir ke kotak ===================== */\n/* cfg: {level,title,task,bins:[{id,label,short,sub}],cards:[{id,t,bin}],hideNames,feedback:'live'|'check',onDone(res)} */\nfunction runSorter(cfg){\n  clearTimer();\n  var st = {place:{}, sel:null, mistakes:0, checks:0, done:false, msg:'', marks:null};\n  var cards = shuffle(cfg.cards), byId = {};\n  cfg.cards.forEach(function(c){ byId[c.id] = c; });\n  var live = cfg.feedback === 'live';\n  view.innerHTML = barHTML(cfg.title, '') + '<div id=\"stage\"><\/div>';\n  bindBack();\n  var stage = document.getElementById('stage');\n\n  function draw(){\n    var h = '<div class=\"status\"><span class=\"chip\" id=\"mchip\">' + (live ? 'Salah: ' + st.mistakes : 'Periksa: ' + st.checks + 'x') + '<\/span><\/div>';\n    h += '<div class=\"task\">' + cfg.task + '<\/div>';\n    h += '<div class=\"spool\"><div class=\"box\" id=\"pool\">';\n    var rest = cards.filter(function(c){ return !st.place[c.id]; });\n    if (!rest.length) h += '<span class=\"empty\">Semua kartu sudah dipasang<\/span>';\n    rest.forEach(function(c){ h += '<button class=\"scard' + (st.sel === c.id ? ' sel' : '') + '\" data-id=\"' + c.id + '\">' + esc(c.t) + '<\/button>'; });\n    h += '<\/div><\/div><div id=\"bins\">';\n    cfg.bins.forEach(function(b){\n      h += '<div class=\"bin' + (st.sel ? ' target' : '') + '\" data-bin=\"' + b.id + '\"><div class=\"bl\">' + (cfg.hideNames ? b.short : b.label) +\n           (!cfg.hideNames && b.sub ? '<span class=\"bs\">' + b.sub + '<\/span>' : '') + '<\/div><div class=\"items\">';\n      cards.filter(function(c){ return st.place[c.id] === b.id; }).forEach(function(c){\n        var cls = 'scard';\n        if (live) cls += (c.bin === b.id ? ' ok' : ' bad');\n        else if (st.marks) cls += (c.bin === b.id ? ' ok' : ' bad');\n        h += '<button class=\"' + cls + '\" data-placed=\"' + c.id + '\">' + esc(c.t) + '<\/button>';\n      });\n      h += '<\/div><\/div>';\n    });\n    h += '<\/div>' + (live ? '' : '<div class=\"row-btns\"><button class=\"btn alt\" id=\"rs\">Ulangi<\/button><button class=\"btn\" id=\"ck\">Periksa<\/button><\/div>') +\n         '<div class=\"msg\" id=\"msg\"><\/div>';\n    stage.innerHTML = h;\n    document.getElementById('msg').textContent = st.msg;\n    var rs = document.getElementById('rs');\n    if (rs) rs.onclick = function(){ if (st.done) return; st.place = {}; st.sel = null; st.msg = ''; st.marks = null; draw(); };\n    var ck = document.getElementById('ck');\n    if (ck) ck.onclick = check;\n  }\n  function allPlaced(){ return cards.every(function(c){ return st.place[c.id]; }); }\n  function allRight(){ return cards.every(function(c){ return st.place[c.id] === c.bin; }); }\n\n  stage.addEventListener('click', function(e){\n    if (st.done) return;\n    var c = e.target.closest('#pool [data-id]');\n    if (c) { st.sel = (st.sel === c.dataset.id) ? null : c.dataset.id; draw(); return; }\n    var bin = e.target.closest('[data-bin]');\n    var pc = e.target.closest('[data-placed]');\n    if (pc && !st.sel) { delete st.place[pc.dataset.placed]; st.msg = ''; st.marks = null; draw(); return; }\n    if (bin && st.sel) {\n      var card = byId[st.sel];\n      st.place[card.id] = bin.dataset.bin;\n      if (live && card.bin !== bin.dataset.bin) st.mistakes++;\n      st.sel = null; st.msg = ''; st.marks = null;\n      draw();\n      if (live) {\n        if (allRight()) finish();\n        else if (allPlaced()) { st.msg = 'Tap kartu yang merah untuk memindahkannya, lalu coba lagi.'; draw(); }\n      }\n    }\n  });\n  function check(){\n    if (st.done) return;\n    if (!allPlaced()) { st.msg = 'Pasang semua kartu dulu.'; draw(); return; }\n    st.checks++;\n    var ok = cards.filter(function(c){ return st.place[c.id] === c.bin; }).length;\n    if (ok === cards.length) { finish(); return; }\n    st.marks = true;\n    st.msg = ok + ' dari ' + cards.length + ' kartu sudah di tempat yang benar.';\n    draw();\n  }\n  function finish(){\n    if (st.done) return;\n    st.done = true;\n    cfg.onDone({mistakes:st.mistakes, checks:st.checks});\n  }\n  draw();\n}\n\n/* ===================== Sortir OSI ===================== */\nvar LAYERS = [\n  {id:'7', label:'Layer 7: Application',  short:'Layer 7', name:'7 Application'},\n  {id:'6', label:'Layer 6: Presentation', short:'Layer 6', name:'6 Presentation'},\n  {id:'5', label:'Layer 5: Session',      short:'Layer 5', name:'5 Session'},\n  {id:'4', label:'Layer 4: Transport',    short:'Layer 4', name:'4 Transport'},\n  {id:'3', label:'Layer 3: Network',      short:'Layer 3', name:'3 Network'},\n  {id:'2', label:'Layer 2: Data Link',    short:'Layer 2', name:'2 Data Link'},\n  {id:'1', label:'Layer 1: Physical',     short:'Layer 1', name:'1 Physical'}\n];\nvar CARDPOOL = {\n  '7': ['HTTP','DNS','SMTP','FTP'],\n  '6': ['Enkripsi SSL/TLS','Format gambar JPEG','Pengkodean karakter UTF-8'],\n  '5': ['Membuka, mengelola, dan menutup sesi komunikasi'],\n  '4': ['TCP','UDP','Nomor port (80, 443)'],\n  '3': ['Alamat IP','Router','Routing (memilih jalur)'],\n  '2': ['Alamat MAC','Switch','Frame'],\n  '1': ['Kabel UTP','Fiber optik','Bit 0 dan 1']\n};\nfunction makeCards(counts){\n  var out = [], n = 0;\n  LAYERS.forEach(function(L, i){\n    shuffle(CARDPOOL[L.id]).slice(0, counts[i]).forEach(function(t){ out.push({id:'c' + (n++), t:t, bin:L.id}); });\n  });\n  return out;\n}\nvar SCEN = [\n  {t:'Kabel LAN pada sebuah PC terlepas dari port switch.', a:'1', why:'Media fisik (kabel) terputus, jadi bit tidak bisa dikirim. Itu masalah Physical layer.'},\n  {t:'Switch meneruskan frame ke PC yang benar berdasarkan alamat tujuannya. Di layer mana ini terjadi?', a:'2', why:'Switch bekerja di Data Link layer dan memakai alamat MAC.'},\n  {t:'PC diberi IP di subnet yang salah, sehingga tidak bisa menjangkau jaringan lain.', a:'3', why:'Pengalamatan IP dan jangkauan antar jaringan adalah urusan Network layer.'},\n  {t:'Router tidak punya rute ke jaringan tujuan, sehingga paket dibuang.', a:'3', why:'Pemilihan rute (routing) dilakukan di Network layer.'},\n  {t:'Firewall memblokir port 443, sehingga situs HTTPS tidak terbuka.', a:'4', why:'Nomor port adalah pengalamatan di Transport layer.'},\n  {t:'Sebagian paket TCP hilang di jalan, lalu dikirim ulang otomatis.', a:'4', why:'Flow control dan error recovery dilakukan oleh Transport layer (TCP).'},\n  {t:'Sertifikat TLS kedaluwarsa, sehingga enkripsi koneksi HTTPS gagal dibentuk.', a:'6', why:'Menurut modul, enkripsi dan dekripsi (SSL/TLS) ada di Presentation layer.'},\n  {t:'Sesi komunikasi antar aplikasi terputus dan tidak bisa dibuka kembali.', a:'5', why:'Pembukaan, pengelolaan, dan penutupan sesi adalah tugas Session layer.'},\n  {t:'Nama domain tidak bisa diterjemahkan ke alamat IP karena DNS server bermasalah.', a:'7', why:'Menurut modul, DNS termasuk protokol Application layer.'},\n  {t:'Teks di halaman web tampil berantakan karena pengkodean karakter tidak cocok.', a:'6', why:'Format data dan pengkodean karakter (misalnya UTF-8) ada di Presentation layer.'},\n  {t:'Data diubah menjadi bit-bit listrik atau cahaya yang berjalan di kabel.', a:'1', why:'Pengiriman bit mentah lewat media fisik adalah Physical layer.'},\n  {t:'Paket data diberi header berisi IP sumber dan IP tujuan.', a:'3', why:'Alamat IP ditambahkan di Network layer saat proses encapsulation.'}\n];\n\nGAME = {\n  key:'osi', title:'Sortir OSI', emoji:'🧱',\n  intro:'Tempatkan protokol, perangkat, dan masalah jaringan ke layer OSI yang tepat.',\n  levels:[['Mudah','7 kartu ke 7 layer, nama layer terlihat'],['Sedang','12 kartu, nama layer disembunyikan'],['Sulit','8 skenario, tebak layer yang bermasalah (ada timer)']],\n  foot:'Rujukan: Modul Sistem Jaringan Komputer (Pusdiklat BPS, 2025), hal. 10-11.',\n  start:function(level){\n    if (level === 1) {\n      runSorter({level:1, title:levelTitle(1), feedback:'live', bins:LAYERS, cards:makeCards([1,1,1,1,1,1,1]),\n        task:'Tap kartu, lalu tap kotak layer yang tepat. Tap kartu di kotak untuk memindahkannya.',\n        onDone:function(r){\n          var s = starsLow(r.mistakes, 1, 4); saveBest(1, s);\n          showResult({level:1, stars:s, title:'7 layer terisi!', text: s === 3 ? 'Rapi. Urutan OSI sudah hafal.' : 'Berhasil. Ulangi untuk lebih tepat.', stats:['Salah letak: ' + r.mistakes]});\n        }});\n    } else if (level === 2) {\n      runSorter({level:2, title:levelTitle(2), feedback:'check', hideNames:true, bins:LAYERS, cards:makeCards([2,2,1,2,2,2,1]),\n        task:'Nama layer disembunyikan. Tempatkan 12 kartu ke nomor layer yang tepat, lalu tap Periksa.',\n        onDone:function(r){\n          var s = starsLow(r.checks, 2, 4); saveBest(2, s);\n          showResult({level:2, stars:s, title:'Semua kartu tepat!', text: s === 3 ? 'Rapi. Hafal sampai nomor layernya.' : 'Berhasil. Ulangi supaya lebih sekali jalan.', stats:['Pemeriksaan: ' + r.checks + 'x']});\n        }});\n    } else {\n      var qs = shuffle(SCEN).slice(0, 8).map(function(s){\n        return {prompt:s.t, opts:LAYERS.map(function(L){ return {k:L.id, t:L.name}; }), ans:s.a, why:s.why};\n      });\n      runQuiz({level:3, title:levelTitle(3), qs:qs, perQ:20, cols:2,\n        finish:function(score, total){\n          var s = starsBy(score, 7, 5, 3); saveBest(3, s);\n          showResult({level:3, stars:s, title:'Skor ' + score + ' dari ' + total,\n            text: s === 3 ? 'Hampir sempurna. Diagnosis per layer sudah tajam.' : (s >= 1 ? 'Bagus. Ulangi dan fokus pada layer 3, 4, dan 6.' : 'Ulangi dulu level 1 dan 2, lalu coba lagi.'), stats:[]});\n        }});\n    }\n  }\n};\nshowMenu();\n\n<\/script>\n<\/body>\n<\/html>\n"},
  {key:'detektif', title:'Detektif Jaringan', emoji:'🕵️', tema:'Sisjarkom', desc:'Troubleshooting jaringan langkah demi langkah.', html:"<!DOCTYPE html>\n<html lang=\"id\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Detektif Jaringan<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&display=swap\" rel=\"stylesheet\">\n<style>\n:root{\n  box-sizing:border-box;\n  padding-top:env(safe-area-inset-top,0px);\n  padding-bottom:env(safe-area-inset-bottom,0px);\n  --bg:#FFF9F3; --card:#FFFFFF; --ink:#182255; --muted:#566086;\n  --accent:#F79039; --accent-2:#FEBD26;\n  --peach:#FCDDC2; --peach-2:#FBCCA4; --line:#F3D3B6;\n  --ok:#14805A; --ok-bg:#DDF4EA; --bad:#C23A3A; --bad-bg:#FBE1E1;\n  --term:#101636; --term-ink:#D9F7E8;\n}\n@media (prefers-color-scheme: dark){\n  :root:not([data-theme=\"light\"]){\n    --bg:#121731; --card:#1B2347; --ink:#F4EFE8; --muted:#AAB1D3;\n    --peach:#2A3263; --peach-2:#36407A; --line:#3A4580;\n    --ok:#4CD6A0; --ok-bg:#12382C; --bad:#FF8A8A; --bad-bg:#44202A;\n    --term:#0A0E24;\n  }\n}\n:root[data-theme=\"dark\"]{\n  --bg:#121731; --card:#1B2347; --ink:#F4EFE8; --muted:#AAB1D3;\n  --peach:#2A3263; --peach-2:#36407A; --line:#3A4580;\n  --ok:#4CD6A0; --ok-bg:#12382C; --bad:#FF8A8A; --bad-bg:#44202A;\n  --term:#0A0E24;\n}\nhtml{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}\n*,*::before,*::after{box-sizing:inherit}\nbody{margin:0;min-height:100%;background:var(--bg);color:var(--ink);\n  font-family:Arial,\"Helvetica Neue\",sans-serif;font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}\nh1,h2,h3{font-family:Montserrat,Arial,sans-serif;margin:0;line-height:1.2}\nbutton{font:inherit;color:inherit;cursor:pointer}\nbutton:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent-2);outline-offset:2px}\n.app{max-width:720px;margin:0 auto;padding:16px 14px 28px}\n\n/* menu */\n.hero{background:var(--accent);color:#fff;border-radius:22px;padding:22px 20px 20px;position:relative;overflow:hidden}\n.hero h1{font-size:clamp(26px,7vw,34px);font-weight:800;color:#fff;padding-right:84px}\n.hero p{margin:8px 0 0;color:#FFF3E6;padding-right:84px}\n.hero .decor{position:absolute;right:14px;top:14px;font-size:58px;line-height:1;transform:rotate(-6deg)}\n.levels{display:grid;gap:12px;margin-top:16px}\n.lvl{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;text-align:left;\n  background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px 16px;width:100%}\n.lvl:hover{border-color:var(--accent)}\n.lvl .no{width:46px;height:46px;border-radius:50%;background:var(--peach);display:grid;place-items:center;\n  font-family:Montserrat,Arial,sans-serif;font-weight:800;font-size:20px}\n.lvl h2{font-size:17px}\n.lvl p{margin:3px 0 0;color:var(--muted);font-size:14px}\n.stars{font-size:20px;letter-spacing:2px;color:var(--accent-2);white-space:nowrap}\n.stars .off{color:var(--line)}\n.foot{margin-top:18px;color:var(--muted);font-size:13px}\n\n/* bar */\n.bar{display:flex;align-items:center;gap:10px;margin-bottom:12px}\n.back{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:8px 12px;font-weight:700}\n.bar h2{font-size:18px;flex:1}\n.chip{background:var(--peach);border-radius:999px;padding:6px 14px;font-weight:700;font-size:14px;white-space:nowrap}\n.chip.warn{background:var(--bad-bg);color:var(--bad)}\n.chip.good{background:var(--ok-bg);color:var(--ok)}\n.status{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}\n.task{background:var(--peach);border-radius:14px;padding:12px 14px;margin-bottom:12px;font-size:15.5px}\n.hint{margin:0 0 12px;color:var(--muted);font-size:14.5px}\n.btn{border:0;border-radius:14px;padding:12px 18px;font
