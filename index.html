n  return s + '<\/span>';\n}\nfunction barHTML(title, chip){\n  return '<div class=\"bar\"><button class=\"back\" id=\"bk\">&larr; Menu<\/button><h2>' + title + '<\/h2>' + (chip||'') + '<\/div>';\n}\nfunction bindBack(){ var b = document.getElementById('bk'); if (b) b.onclick = showMenu; }\nfunction levelTitle(n){ return 'Level ' + n + ': ' + ['Mudah','Sedang','Sulit'][n-1]; }\n\n/* ===================== menu ===================== */\nfunction showMenu(){\n  clearTimer();\n  var best = loadBest(), h = '';\n  h += '<div class=\"hero\"><div class=\"decor\" aria-hidden=\"true\">' + GAME.emoji + '<\/div><h1>' + GAME.title + '<\/h1><p>' + GAME.intro + '<\/p><\/div><div class=\"levels\">';\n  GAME.levels.forEach(function(l, i){\n    h += '<button class=\"lvl\" data-l=\"' + (i+1) + '\"><span class=\"no\">' + (i+1) + '<\/span><span><h2>' + l[0] + '<\/h2><p>' + l[1] + '<\/p><\/span>' + starsHTML(best[i+1]||0) + '<\/button>';\n  });\n  h += '<\/div><p class=\"foot\">Semua level terbuka. Mulai dari mana saja. ' + GAME.foot + '<\/p>';\n  view.innerHTML = h;\n  Array.prototype.forEach.call(view.querySelectorAll('.lvl'), function(b){\n    b.addEventListener('click', function(){ GAME.start(+b.dataset.l); });\n  });\n}\n\n/* ===================== hasil ===================== */\nfunction showResult(r){\n  clearTimer();\n  var h = '<div class=\"result\">' + starsHTML(r.stars) + '<h2>' + r.title + '<\/h2><p>' + r.text + '<\/p>';\n  if (r.stats && r.stats.length) h += '<div class=\"stat\">' + r.stats.map(function(s){ return '<span>' + s + '<\/span>'; }).join('') + '<\/div>';\n  if (r.extra) h += '<div class=\"extra\">' + r.extra + '<\/div>';\n  h += '<div class=\"row-btns\"><button class=\"btn alt\" id=\"rm\">Menu<\/button><button class=\"btn\" id=\"ra\">Main lagi<\/button>' +\n       (r.level < 3 && r.stars > 0 ? '<button class=\"btn dark\" id=\"rn\">Level ' + (r.level+1) + '<\/button>' : '') + '<\/div>';\n  if (r.note) h += '<p class=\"note\">' + r.note + '<\/p>';\n  view.innerHTML = h + '<\/div>';\n  document.getElementById('rm').onclick = showMenu;\n  document.getElementById('ra').onclick = function(){ GAME.start(r.level); };\n  var rn = document.getElementById('rn');\n  if (rn) rn.onclick = function(){ GAME.start(r.level + 1); };\n}\nfunction starsBy(v, hi, mid, lo){ return v >= hi ? 3 : (v >= mid ? 2 : (v >= lo ? 1 : 0)); }\nfunction starsLow(v, a, b){ return v <= a ? 3 : (v <= b ? 2 : 1); }   /* makin kecil makin baik */\n\n/* ===================== komponen: kuis pilihan ===================== */\n/* cfg: {level,title,qs:[{ctx,clue,cluelabel,prompt,opts:[{k,t,fb}],ans,why}],perQ,cols,finish(score,total)} */\nfunction runQuiz(cfg){\n  clearTimer();\n  var qs = cfg.qs, idx = 0, score = 0, answered = false, left = 0;\n  function render(){\n    clearTimer(); answered = false;\n    var q = qs[idx];\n    var h = barHTML(cfg.title, '<span class=\"chip\">Soal ' + (idx+1) + '/' + qs.length + '<\/span>');\n    h += '<div class=\"status\"><span class=\"chip\">Skor: ' + score + '<\/span>' + (cfg.perQ ? '<span class=\"chip\" id=\"tchip\">' + cfg.perQ + ' dtk<\/span>' : '') + '<\/div>';\n    h += '<div class=\"qcard\">';\n    if (q.ctx) h += '<p class=\"ctx\">' + q.ctx + '<\/p>';\n    if (q.clue) h += '<div class=\"clue\"><b>' + (q.cluelabel || 'Temuan') + '<\/b>' + q.clue + '<\/div>';\n    h += '<h3>' + q.prompt + '<\/h3><div class=\"opts' + (cfg.cols === 2 ? ' cols2' : '') + '\">';\n    q.opts.forEach(function(o){ h += '<button class=\"opt\" data-k=\"' + o.k + '\">' + o.t + '<\/button>'; });\n    h += '<\/div><div id=\"fb\"><\/div><\/div>';\n    view.innerHTML = h;\n    bindBack();\n    Array.prototype.forEach.call(view.querySelectorAll('.opt'), function(b){\n      b.addEventListener('click', function(){ answer(b.dataset.k); });\n    });\n    if (cfg.perQ) {\n      left = cfg.perQ;\n      timerId = setInterval(function(){\n        left--;\n        var c = document.getElementById('tchip');\n        if (c) { c.textContent = left + ' dtk'; c.className = 'chip' + (left <= 5 ? ' warn' : ''); }\n        if (left <= 0) { clearTimer(); answer(null); }\n      }, 1000);\n    }\n  }\n  function answer(k){\n    if (answered) return;\n    answered = true; clearTimer();\n    var q = qs[idx];\n    var right = (k !== null && String(k) === String(q.ans));\n    if (right) score++;\n    var chosen = null, correct = null;\n    q.opts.forEach(function(o){ if (String(o.k) === String(k)) chosen = o; if (String(o.k) === String(q.ans)) correct = o; });\n    Array.prototype.forEach.call(view.querySelectorAll('.opt'), function(b){\n      b.disabled = true;\n      if (String(b.dataset.k) === String(q.ans)) b.classList.add('right');\n      else if (k !== null && b.dataset.k === String(k)) b.classList.add('wrong');\n    });\n    var txt = '';\n    if (k === null) txt += 'Waktu habis. ';\n    if (!right && chosen && chosen.fb) txt += chosen.fb + ' ';\n    if (!right && correct) txt += 'Jawaban tepat: ' + correct.t + '. ';\n    if (right && correct && correct.fb) txt += correct.fb + ' ';\n    if (q.why) txt += q.why;\n    var last = idx === qs.length - 1;\n    document.getElementById('fb').innerHTML =\n      '<div class=\"fb ' + (right ? 'ok' : 'bad') + '\"><b>' + (right ? 'Benar' : (k === null ? 'Waktu habis' : 'Belum tepat')) + '<\/b>' + txt + '<\/div>' +\n      '<div class=\"row-btns\"><button class=\"btn\" id=\"nx\">' + (last ? 'Lihat hasil' : 'Lanjut') + '<\/button><\/div>';\n    var nx = document.getElementById('nx');\n    nx.onclick = function(){ if (last) cfg.finish(score, qs.length); else { idx++; render(); } };\n    nx.focus();\n  }\n  render();\n}\n\n/* ===================== komponen: urutkan ===================== */\n/* cfg: {level,title,task,items:[{id,t}] (urutan benar),labels,locked:[idx],feedback:'live'|'marks'|'count',timer,g2,reveal,\n         onDone(res),onTimeout(res)} */\nfunction runOrder(cfg){\n  clearTimer();\n  var items = cfg.items, n = items.length, byId = {};\n  items.forEach(function(it){ byId[it.id] = it; });\n  var st = {slots:[], locked:{}, done:false, mistakes:0, checks:0, left:cfg.timer || 0, msg:'', marks:null};\n  for (var i=0;i<n;i++) st.slots.push(null);\n  (cfg.locked || []).forEach(function(i){ st.slots[i] = items[i].id; st.locked[i] = true; });\n  var poolOrder = shuffle(items.map(function(it){ return it.id; })).filter(function(id){ return st.slots.indexOf(id) < 0; });\n  var fbk = cfg.feedback;\n\n  view.innerHTML = barHTML(cfg.title, '') + '<div id=\"stage\"><\/div>';\n  bindBack();\n  var stage = document.getElementById('stage');\n\n  function chipHTML(){\n    if (cfg.timer) return '<span class=\"chip\" id=\"tchip\">' + st.left + ' dtk<\/span>';\n    if (fbk === 'live') return '<span class=\"chip\" id=\"mchip\">Salah: ' + st.mistakes + '<\/span>';\n    return '<span class=\"chip\" id=\"mchip\">Periksa: ' + st.checks + 'x<\/span>';\n  }\n  function draw(){\n    var h = '<div class=\"status\">' + chipHTML() + '<\/div><div class=\"task\">' + cfg.task + '<\/div><div class=\"slots\" id=\"slots\">';\n    for (var i=0;i<n;i++){\n      var id = st.slots[i], cls = 'c';\n      if (id) {\n        cls += st.locked[i] ? ' locked' : ' filled';\n        if (!st.locked[i]) {\n          if (fbk === 'live') cls += (id === items[i].id ? ' ok' : ' bad');\n          else if (st.marks) cls += (st.marks[i] ? ' ok' : ' bad');\n        }\n      }\n      h += '<div class=\"slot\" data-i=\"' + i + '\"><div class=\"n\">' + (i+1) + '<\/div><div class=\"' + cls + '\">';\n      if (id) h += '<span>' + (cfg.labels && cfg.showLabels ? '<span class=\"lab\">' + cfg.labels[i] + '<\/span>' : '') + esc(byId[id].t) + (st.locked[i] ? ' <span class=\"lab\" style=\"display:inline\">(terkunci)<\/span>' : '') + '<\/span>';\n      else h += '<span class=\"lab\" style=\"color:var(--muted)\">Tap kartu di bawah<\/span>';\n      h += '<\/div><\/div>';\n    }\n    h += '<\/div><div class=\"opool' + (cfg.g2 ? ' g2' : '') + '\" id=\"opool\">';\n    var inPool = poolOrder.filter(function(id){ return st.slots.indexOf(id) < 0; });\n    if (!inPool.length) h += '<span class=\"empty\">Semua kartu sudah dipasang<\/span>';\n    inPool.forEach(function(id){ h += '<button class=\"ocard\" data-id=\"' + id + '\">' + esc(byId[id].t) + '<\/button>'; });\n    h += '<\/div><div class=\"row-btns\"><button class=\"btn alt\" id=\"rs\">Ulangi<\/button>' +\n         (fbk !== 'live' ? '<button class=\"btn\" id=\"ck\">Periksa<\/button>' : '') + '<\/div><div class=\"msg\" id=\"msg\"><\/div>';\n    stage.innerHTML = h;\n    document.getElementById('msg').textContent = st.msg;\n    document.getElementById('rs').onclick = function(){\n      if (st.done) return;\n      for (var i=0;i<n;i++) if (!st.locked[i]) st.slots[i] = null;\n      st.msg = ''; st.marks = null; draw();\n    };\n    var ck = document.getElementById('ck');\n    if (ck) ck.onclick = check;\n  }\n  function firstEmpty(){ for (var i=0;i<n;i++) if (st.slots[i] === null) return i; return -1; }\n  function allCorrect(){ for (var i=0;i<n;i++) if (st.slots[i] !== items[i].id) return false; return true; }\n\n  stage.addEventListener('click', function(e){\n    if (st.done) return;\n    var oc = e.target.closest('.ocard');\n    if (oc) {\n      var i = firstEmpty();\n      if (i < 0) return;\n      st.slots[i] = oc.dataset.id; st.msg = ''; st.marks = null;\n      if (fbk === 'live' && oc.dataset.id !== items[i].id) st.mistakes++;\n      draw();\n      if (fbk === 'live') {\n        if (allCorrect()) finish();\n        else if (firstEmpty() < 0) { st.msg = 'Tap kartu yang merah untuk mengembalikannya, lalu coba lagi.'; draw(); }\n      }\n      return;\n    }\n    var sl = e.target.closest('.slot');\n    if (sl) {\n      var j = +sl.dataset.i;\n      if (st.slots[j] && !st.locked[j]) { st.slots[j] = null; st.msg = ''; st.marks = null; draw(); }\n    }\n  });\n\n  function check(){\n    if (st.done) return;\n    if (firstEmpty() >= 0) { st.msg = 'Isi semua posisi dulu.'; draw(); return; }\n    st.checks++;\n    var ok = 0, marks = [];\n    for (var i=0;i<n;i++){ var m = st.slots[i] === items[i].id; marks.push(m); if (m) ok++; }\n    if (ok === n) { finish(); return; }\n    st.marks = fbk === 'marks' ? marks : null;\n    st.msg = ok + ' dari ' + n + ' posisi sudah benar. Coba lagi.';\n    draw();\n  }\n  function finish(){\n    if (st.done) return;\n    st.done = true; clearTimer();\n    var res = {mistakes:st.mistakes, checks:st.checks, left:st.left, ok:true};\n    if (cfg.reveal) {\n      var h = '<div class=\"reveal\"><b>Urutan yang benar<\/b><ol>';\n      items.forEach(function(it, i){ h += '<li>' + (cfg.labels ? '<b>' + cfg.labels[i] + ':<\/b> ' : '') + esc(it.t) + '<\/li>'; });\n      h += '<\/ol><\/div><div class=\"row-btns\"><button class=\"btn\" id=\"go\">Lanjut<\/button><\/div>';\n      stage.innerHTML = '<div class=\"status\"><span class=\"chip good\">Urutan benar<\/span><\/div>' + h;\n      document.getElementById('go').onclick = function(){ cfg.onDone(res); };\n    } else cfg.onDone(res);\n  }\n  if (cfg.timer) {\n    timerId = setInterval(function(){\n      if (st.done) return;\n      st.left--;\n      var c = document.getElementById('tchip');\n      if (c) { c.textContent = st.left + ' dtk'; c.className = 'chip' + (st.left <= 15 ? ' warn' : ''); }\n      if (st.left <= 0) { st.left = 0; st.done = true; clearTimer(); if (cfg.onTimeout) cfg.onTimeout({checks:st.checks}); }\n    }, 1000);\n  }\n  draw();\n}\n\n/* ===================== komponen: sortir ke kotak ===================== */\n/* cfg: {level,title,task,bins:[{id,label,short,sub}],cards:[{id,t,bin}],hideNames,feedback:'live'|'check',onDone(res)} */\nfunction runSorter(cfg){\n  clearTimer();\n  var st = {place:{}, sel:null, mistakes:0, checks:0, done:false, msg:'', marks:null};\n  var cards = shuffle(cfg.cards), byId = {};\n  cfg.cards.forEach(function(c){ byId[c.id] = c; });\n  var live = cfg.feedback === 'live';\n  view.innerHTML = barHTML(cfg.title, '') + '<div id=\"stage\"><\/div>';\n  bindBack();\n  var stage = document.getElementById('stage');\n\n  function draw(){\n    var h = '<div class=\"status\"><span class=\"chip\" id=\"mchip\">' + (live ? 'Salah: ' + st.mistakes : 'Periksa: ' + st.checks + 'x') + '<\/span><\/div>';\n    h += '<div class=\"task\">' + cfg.task + '<\/div>';\n    h += '<div class=\"spool\"><div class=\"box\" id=\"pool\">';\n    var rest = cards.filter(function(c){ return !st.place[c.id]; });\n    if (!rest.length) h += '<span class=\"empty\">Semua kartu sudah dipasang<\/span>';\n    rest.forEach(function(c){ h += '<button class=\"scard' + (st.sel === c.id ? ' sel' : '') + '\" data-id=\"' + c.id + '\">' + esc(c.t) + '<\/button>'; });\n    h += '<\/div><\/div><div id=\"bins\">';\n    cfg.bins.forEach(function(b){\n      h += '<div class=\"bin' + (st.sel ? ' target' : '') + '\" data-bin=\"' + b.id + '\"><div class=\"bl\">' + (cfg.hideNames ? b.short : b.label) +\n           (!cfg.hideNames && b.sub ? '<span class=\"bs\">' + b.sub + '<\/span>' : '') + '<\/div><div class=\"items\">';\n      cards.filter(function(c){ return st.place[c.id] === b.id; }).forEach(function(c){\n        var cls = 'scard';\n        if (live) cls += (c.bin === b.id ? ' ok' : ' bad');\n        else if (st.marks) cls += (c.bin === b.id ? ' ok' : ' bad');\n        h += '<button class=\"' + cls + '\" data-placed=\"' + c.id + '\">' + esc(c.t) + '<\/button>';\n      });\n      h += '<\/div><\/div>';\n    });\n    h += '<\/div>' + (live ? '' : '<div class=\"row-btns\"><button class=\"btn alt\" id=\"rs\">Ulangi<\/button><button class=\"btn\" id=\"ck\">Periksa<\/button><\/div>') +\n         '<div class=\"msg\" id=\"msg\"><\/div>';\n    stage.innerHTML = h;\n    document.getElementById('msg').textContent = st.msg;\n    var rs = document.getElementById('rs');\n    if (rs) rs.onclick = function(){ if (st.done) return; st.place = {}; st.sel = null; st.msg = ''; st.marks = null; draw(); };\n    var ck = document.getElementById('ck');\n    if (ck) ck.onclick = check;\n  }\n  function allPlaced(){ return cards.every(function(c){ return st.place[c.id]; }); }\n  function allRight(){ return cards.every(function(c){ return st.place[c.id] === c.bin; }); }\n\n  stage.addEventListener('click', function(e){\n    if (st.done) return;\n    var c = e.target.closest('#pool [data-id]');\n    if (c) { st.sel = (st.sel === c.dataset.id) ? null : c.dataset.id; draw(); return; }\n    var bin = e.target.closest('[data-bin]');\n    var pc = e.target.closest('[data-placed]');\n    if (pc && !st.sel) { delete st.place[pc.dataset.placed]; st.msg = ''; st.marks = null; draw(); return; }\n    if (bin && st.sel) {\n      var card = byId[st.sel];\n      st.place[card.id] = bin.dataset.bin;\n      if (live && card.bin !== bin.dataset.bin) st.mistakes++;\n      st.sel = null; st.msg = ''; st.marks = null;\n      draw();\n      if (live) {\n        if (allRight()) finish();\n        else if (allPlaced()) { st.msg = 'Tap kartu yang merah untuk memindahkannya, lalu coba lagi.'; draw(); }\n      }\n    }\n  });\n  function check(){\n    if (st.done) return;\n    if (!allPlaced()) { st.msg = 'Pasang semua kartu dulu.'; draw(); return; }\n    st.checks++;\n    var ok = cards.filter(function(c){ return st.place[c.id] === c.bin; }).length;\n    if (ok === cards.length) { finish(); return; }\n    st.marks = true;\n    st.msg = ok + ' dari ' + cards.length + ' kartu sudah di tempat yang benar.';\n    draw();\n  }\n  function finish(){\n    if (st.done) return;\n    st.done = true;\n    cfg.onDone({mistakes:st.mistakes, checks:st.checks});\n  }\n  draw();\n}\n\n/* ===================== Urutan Pengadaan ===================== */\nvar STEPS = [\n  {id:'p1', t:'Penetapan kebutuhan pengadaan'},\n  {id:'p2', t:'Pembentukan tim pengadaan'},\n  {id:'p3', t:'Penyusunan dokumen pengadaan'},\n  {id:'p4', t:'Pengumuman pengadaan'},\n  {id:'p5', t:'Evaluasi dan pemilihan penyedia'},\n  {id:'p6', t:'Pelaksanaan kontrak'},\n  {id:'p7', t:'Pengujian infrastruktur TI'},\n  {id:'p8', t:'Pengiriman dan penyerahan'}\n];\nfunction stepList(){\n  return '<ol>' + STEPS.map(function(s){ return '<li>' + esc(s.t) + '<\/li>'; }).join('') + '<\/ol>';\n}\nGAME = {\n  key:'pengadaan', title:'Urutan Pengadaan', emoji:'📋',\n  intro:'Susun tahapan pengadaan infrastruktur TI dari awal sampai serah terima.',\n  levels:[['Mudah','4 tahap, langsung ada tanda benar atau salah'],['Sedang','8 tahap, sebagian posisi terkunci'],['Sulit','8 tahap tanpa petunjuk, waktu 90 detik']],\n  foot:'Rujukan: Modul Manajemen Infrastruktur TI (Pusdiklat BPS, 2025), Bab B.',\n  start:function(level){\n    if (level === 1) {\n      var four = [STEPS[0], STEPS[3], STEPS[5], STEPS[7]];\n      runOrder({level:1, title:levelTitle(1), items:four, feedback:'live', g2:true,\n        task:'Urutkan 4 tahap pengadaan dari yang paling awal. Tap kartu untuk memasangnya ke posisi berikutnya.',\n        onDone:function(r){\n          var s = starsLow(r.mistakes, 0, 2); saveBest(1, s);\n          showResult({level:1, stars:s, title:'Urutan benar!', text: s === 3 ? 'Rapi. Tidak ada yang salah.' : 'Berhasil. Ulangi untuk tanpa salah.', stats:['Salah letak: ' + r.mistakes],\n            extra:'<div class=\"reveal\"><b>Delapan tahap lengkapnya<\/b>' + stepList() + '<\/div>'});\n        }});\n    } else if (level === 2) {\n      var idx = shuffle([0,1,2,3,4,5,6,7]).slice(0, 3);\n      runOrder({level:2, title:levelTitle(2), items:STEPS, locked:idx, feedback:'marks', g2:true,\n        task:'Urutkan 8 tahap pengadaan. Tiga posisi sudah terkunci sebagai petunjuk. Tap Periksa kalau sudah penuh.',\n        onDone:function(r){\n          var s = starsLow(r.checks, 2, 4); saveBest(2, s);\n          showResult({level:2, stars:s, title:'Urutan benar!', text: s === 3 ? 'Rapi. Alur pengadaan sudah lancar.' : 'Berhasil. Ulangi supaya lebih sedikit pemeriksaan.', stats:['Pemeriksaan: ' + r.checks + 'x']});\n        }});\n    } else {\n      runOrder({level:3, title:levelTitle(3), items:STEPS, feedback:'count', g2:true, timer:90,\n        task:'Urutkan 8 tahap pengadaan tanpa petunjuk sebelum waktu habis, lalu tap Periksa.',\n        onDone:function(r){\n          var s = starsBy(r.left, 45, 20, 1); saveBest(3, s);\n          showResult({level:3, stars:s, title:'Urutan benar!', text: s === 3 ? 'Cepat dan tepat. Alur pengadaan sudah di luar kepala.' : 'Berhasil. Ulangi untuk lebih cepat.', stats:['Sisa waktu: ' + r.left + ' dtk', 'Pemeriksaan: ' + r.checks + 'x']});\n        },\n        onTimeout:function(r){\n          showResult({level:3, stars:0, title:'Waktu habis', text:'Pelajari urutannya dulu, lalu coba lagi.', stats:['Pemeriksaan: ' + r.checks + 'x'],\n            extra:'<div class=\"reveal\"><b>Urutan yang benar<\/b>' + stepList() + '<\/div>'});\n        }});\n    }\n  }\n};\nshowMenu();\n\n<\/script>\n<\/body>\n<\/html>\n"},
  {key:'kepatuhan', title:'Kepatuhan dan Kematangan', emoji:'✅', tema:'Man TI', slide:'63-70', desc:'Skor kepatuhan, tingkat kematangan, dan kasus audit.', html:"<!DOCTYPE html>\n<html lang=\"id\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Kepatuhan dan Kematangan<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&display=swap\" rel=\"stylesheet\">\n<style>\n:root{\n  box-sizing:border-box;\n  padding-top:env(safe-area-inset-top,0px);\n  padding-bottom:env(safe-area-inset-bottom,0px);\n  --bg:#FFF9F3; --card:#FFFFFF; --ink:#182255; --muted:#566086;\n  --accent:#F79039; --accent-2:#FEBD26;\n  --peach:#FCDDC2; --peach-2:#FBCCA4; --line:#F3D3B6;\n  --ok:#14805A; --ok-bg:#DDF4EA; --bad:#C23A3A; --bad-bg:#FBE1E1;\n  --term:#101636; --term-ink:#D9F7E8;\n}\n@media (prefers-color-scheme: dark){\n  :root:not([data-theme=\"light\"]){\n    --bg:#121731; --card:#1B2347; --ink:#F4EFE8; --muted:#AAB1D3;\n    --peach:#2A3263; --peach-2:#36407A; --line:#3A4580;\n    --ok:#4CD6A0; --ok-bg:#12382C; --bad:#FF8A8A; --bad-bg:#44202A;\n    --term:#0A0E24;\n  }\n}\n:root[data-theme=\"dark\"]{\n  --bg:#121731; --card:#1B2347; --ink:#F4EFE8; --muted:#AAB1D3;\n  --peach:#2A3263; --peach-2:#36407A; --line:#3A4580;\n  --ok:#4CD6A0; --ok-bg:#12382C; --bad:#FF8A8A; --bad-bg:#44202A;\n  --term:#0A0E24;\n}\nhtml{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}\n*,*::before,*::after{box-sizing:inherit}\nbody{margin:0;min-height:100%;background:var(--bg);color:var(--ink);\n  font-family:Arial,\"Helvetica Neue\",sans-serif;font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}\nh1,h2,h3{font-family:Montserrat,Arial,sans-serif;margin:0;line-height:1.2}\nbutton{font:inherit;color:inherit;cursor:pointer}\nbutton:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent-2);outline-offset:2px}\n.app{max-width:720px;margin:0 auto;padding:16px 14px 28px}\n\n/* menu */\n.hero{background:var(--accent);color:#fff;border-radius:22px;padding:22px 20px 20px;position:relative;overflow:hidden}\n.hero h1{font-size:clamp(26px,7vw,34px);font-weight:800;color:#fff;padding-right:84px}\n.hero p{margin:8px 0 0;color:#FFF3E6;padding-right:84px}\n.hero .decor{position:absolute;right:14px;top:14px;font-size:58px;line-height:1;transform:rotate(-6deg)}\n.levels{display:grid;gap:12px;margin-top:16px}\n.lvl{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;text-align:left;\n  background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px 16px;width:100%}\n.lvl:hover{border-color:var(--accent)}\n.lvl .no{width:46px;height:46px;border-radius:50%;background:var(--peach);display:grid;place-items:center;\n  font-family:Montserrat,Arial,sans-serif;font-weight:800;font-size:20px}\n.lvl h2{font-size:17px}\n.lvl p{margin:3px 0 0;color:var(--muted);font-size:14px}\n.stars{font-size:20px;letter-spacing:2px;color:var(--accent-2);white-space:nowrap}\n.stars .off{color:var(--line)}\n.foot{margin-top:18px;color:var(--muted);font-size:13px}\n\n/* bar */\n.bar{display:flex;align-items:center;gap:10px;margin-bottom:12px}\n.back{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:8px 12px;font-weight:700}\n.bar h2{font-size:18px;flex:1}\n.chip{background:var(--peach);border-radius:999px;padding:6px 14px;font-weight:700;font-size:14px;white-space:nowrap}\n.chip.warn{background:var(--bad-bg);color:var(--bad)}\n.chip.good{background:var(--ok-bg);color:var(--ok)}\n.status{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}\n.task{background:var(--peach);border-radius:14px;padding:12px 14px;margin-bottom:12px;font-size:15.5px}\n.hint{margin:0 0 12px;color:var(--muted);font-size:14.5px}\n.btn{border:0;border-radius:14px;padding:12px 18px;font-weight:700;background:var(--accent);color:#fff;flex:1}\n.btn.alt{background:var(--card);color:var(--ink);border:2px solid var(--line)}\n.btn.dark{background:var(--ink);color:var(--bg)}\n.btn:disabled{opacity:.5;cursor:default}\n.row-btns{display:flex;gap:10px;margin-top:14px}\n.msg{margin-top:12px;min-height:22px;font-weight:700;text-align:center}\n\n/* quiz */\n.qcard{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px}\n.qcard h3{font-size:17px;margin-bottom:6px}\n.ctx{margin:0 0 10px;font-size:15px}\n.clue{background:var(--peach);border-radius:12px;padding:10px 12px;margin:0 0 10px;font-size:14.5px}\n.clue b{display:block;margin-bottom:2px}\n.opts{display:grid;gap:10px;margin-top:12px}\n.opts.cols2{grid-template-columns:1fr 1fr}\n.opt{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:12px 14px;text-align:left;font-weight:700;font-size:15px}\n.opt:hover:not(:disabled){border-color:var(--accent)}\n.opt.right{background:var(--ok-bg);border-color:var(--ok)}\n.opt.wrong{background:var(--bad-bg);border-color:var(--bad)}\n.fb{margin-top:14px;border-radius:14px;padding:12px 14px;font-size:14.5px}\n.fb.ok{background:var(--ok-bg)} .fb.bad{background:var(--bad-bg)}\n.fb b{display:block;margin-bottom:2px}\n\n/* sorter */\n.spool{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:6px 0 8px;margin-bottom:8px}\n.spool .box{border:2px dashed var(--line);border-radius:16px;background:var(--card);padding:8px;display:flex;flex-wrap:wrap;gap:6px;\n  justify-content:center;max-height:34vh;overflow:auto;min-height:56px;align-items:center}\n.scard{border:2px solid var(--peach-2);background:var(--peach);border-radius:12px;padding:7px 11px;font-weight:700;font-size:14px;text-align:left}\n.scard.sel{outline:3px solid var(--accent-2);transform:translateY(-2px);border-color:var(--accent)}\n.scard.ok{background:var(--ok-bg);border-color:var(--ok)}\n.scard.bad{background:var(--bad-bg);border-color:var(--bad)}\n.spool .empty{color:var(--muted);font-size:14px}\n.bin{border:2px solid var(--line);background:var(--card);border-radius:16px;padding:9px 11px 10px;margin-bottom:8px;cursor:pointer}\n.bin.target{border-color:var(--accent);background:var(--peach)}\n.bin .bl{font-weight:800;font-size:14.5px}\n.bin .bs{font-weight:400;color:var(--muted);font-size:12.5px;margin-left:6px}\n.bin .items{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;min-height:6px}\n\n/* order */\n.slots{display:grid;gap:8px}\n.slot{display:flex;gap:10px;align-items:stretch;min-height:46px}\n.slot .n{flex:0 0 34px;border-radius:10px;background:var(--peach);display:grid;place-items:center;font-weight:800}\n.slot .c{flex:1;border:2px dashed var(--line);border-radius:12px;padding:8px 12px;display:flex;align-items:center;text-align:left;\n  background:var(--card);font-size:14.5px;min-height:46px}\n.slot .c.filled{border-style:solid;border-color:var(--peach-2);background:var(--peach);font-weight:700;cursor:pointer}\n.slot .c.locked{background:var(--card);border-color:var(--ink);cursor:default}\n.slot .c.ok{background:var(--ok-bg);border-color:var(--ok)}\n.slot .c.bad{background:var(--bad-bg);border-color:var(--bad)}\n.slot .lab{display:block;font-size:12px;color:var(--muted);font-weight:400}\n.opool{margin-top:12px;display:grid;gap:8px;padding:10px;border:2px dashed var(--line);border-radius:16px;background:var(--card)}\n.opool.g2{grid-template-columns:1fr 1fr}\n.ocard{border:2px solid var(--peach-2);background:var(--peach);border-radius:12px;padding:9px 12px;font-weight:700;font-size:14px;text-align:left}\n.opool .empty{color:var(--muted);font-size:14px;grid-column:1/-1;text-align:center}\n.reveal{margin-top:12px;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 14px}\n.reveal ol{margin:6px 0 0;padding-left:20px}\n.reveal li{margin-bottom:6px;font-size:14.5px}\n\n/* result */\n.result{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:24px 18px;text-align:center}\n.result .stars{font-size:46px;margin:6px 0 4px}\n.result h2{font-size:22px}\n.result p{color:var(--muted);margin:6px auto 0;max-width:44ch}\n.stat{display:flex;justify-content:center;gap:10px;margin:14px 0 4px;flex-wrap:wrap}\n.stat span{background:var(--peach);border-radius:999px;padding:6px 14px;font-weight:700;font-size:14px}\n.result .row-btns{flex-wrap:wrap}\n.result .row-btns .btn{min-width:130px}\n.extra{margin-top:14px;text-align:left}\n.note{margin-top:14px;font-size:12.5px;color:var(--muted);text-align:left}\n@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}\n\n\n<\/style>\n<\/head>\n<body>\n<div class=\"app\" id=\"view\"><\/div>\n<script>\n/* ===================== util umum ===================== */\nvar GAME = null;\nvar view = document.getElementById('view');\nvar timerId = null;\nfunction clearTimer(){ if (timerId){ clearInterval(timerId); timerId = null; } }\nfunction shuffle(a){\n  a = a.slice();\n  for (var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }\n  return a;\n}\nfunction pick(a){ return a[Math.floor(Math.random()*a.length)]; }\nfunction esc(s){ return String(s).replace(/&/g,'&amp;').replace(/<\/g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;'); }\nfunction eqArr(a,b){ if (a.length !== b.length) return false; for (var i=0;i<a.length;i++){ if (a[i]!==b[i]) return false; } return true; }\n\nfunction loadBest(){\n  try { var r = localStorage.getItem('best_' + GAME.key); if (r) return JSON.parse(r); } catch(e){}\n  return {1:0,2:0,3:0};\n}\nfunction saveBest(level, stars){\n  try {\n    var b = loadBest();\n    if (stars > (b[level]||0)) { b[level] = stars; localStorage.setItem('best_' + GAME.key, JSON.stringify(b)); }\n  } catch(e){}\n}\nfunction starsHTML(n){\n  var s = '<span class=\"stars\" aria-label=\"' + n + ' dari 3 bintang\">';\n  for (var i=1;i<=3;i++) s += i<=n ? '★' : '<span class=\"off\">★<\/span>';\n  return s + '<\/span>';\n}\nfunction barHTML(title, chip){\n  return '<div class=\"bar\"><button class=\"back\" id=\"bk\">&larr; Menu<\/button><h2>' + title + '<\/h2>' + (chip||'') + '<\/div>';\n}\nfunction bindBack(){ var b = document.getElementById('bk'); if (b) b.onclick = showMenu; }\nfunction levelTitle(n){ return 'Level ' + n + ': ' + ['Mudah','Sedang','Sulit'][n-1]; }\n\n/* ===================== menu ===================== */\nfunction showMenu(){\n  clearTimer();\n  var best = loadBest(), h = '';\n  h += '<div class=\"hero\"><div class=\"decor\" aria-hidden=\"true\">' + GAME.emoji + '<\/div><h1>' + GAME.title + '<\/h1><p>' + GAME.intro + '<\/p><\/div><div class=\"levels\">';\n  GAME.levels.forEach(function(l, i){\n    h += '<button class=\"lvl\" data-l=\"' + (i+1) + '\"><span class=\"no\">' + (i+1) + '<\/span><span><h2>' + l[0] + '<\/h2><p>' + l[1] + '<\/p><\/span>' + starsHTML(best[i+1]||0) + '<\/button>';\n  });\n  h += '<\/div><p class=\"foot\">Semua level terbuka. Mulai dari mana saja. ' + GAME.foot + '<\/p>';\n  view.innerHTML = h;\n  Array.prototype.forEach.call(view.querySelectorAll('.lvl'), function(b){\n    b.addEventListener('click', function(){ GAME.start(+b.dataset.l); });\n  });\n}\n\n/* ===================== hasil ===================== */\nfunction showResult(r){\n  clearTimer();\n  var h = '<div class=\"result\">' + starsHTML(r.stars) + '<h2>' + r.title + '<\/h2><p>' + r.text + '<\/p>';\n  if (r.stats && r.stats.length) h += '<div class=\"stat\">' + r.stats.map(function(s){ return '<span>' + s + '<\/span>'; }).join('') + '<\/div>';\n  if (r.extra) h += '<div class=\"extra\">' + r.extra + '<\/div>';\n  h += '<div class=\"row-btns\"><button class=\"btn alt\" id=\"rm\">Menu<\/button><button class=\"btn\" id=\"ra\">Main lagi<\/button>' +\n       (r.level < 3 && r.stars > 0 ? '<button class=\"btn dark\" id=\"rn\">Level ' + (r.level+1) + '<\/button>' : '') + '<\/div>';\n  if (r.note) h += '<p class=\"note\">' + r.note + '<\/p>';\n  view.innerHTML = h + '<\/div>';\n  document.getElementById('rm').onclick = showMenu;\n  document.getElementById('ra').onclick = function(){ GAME.start(r.level); };\n  var rn = document.getElementById('rn');\n  if (rn) rn.onclick = function(){ GAME.start(r.level + 1); };\n}\nfunction starsBy(v, hi, mid, lo){ return v >= hi ? 3 : (v >= mid ? 2 : (v >= lo ? 1 : 0)); }\nfunction starsLow(v, a, b){ return v <= a ? 3 : (v <= b ? 2 : 1); }   /* makin kecil makin baik */\n\n/* ===================== komponen: kuis pilihan ===================== */\n/* cfg: {level,title,qs:[{ctx,clue,cluelabel,prompt,opts:[{k,t,fb}],ans,why}],perQ,cols,finish(score,total)} */\nfunction runQuiz(cfg){\n  clearTimer();\n  var qs = cfg.qs, idx = 0, score = 0, answered = false, left = 0;\n  function render(){\n    clearTimer(); answered = false;\n    var q = qs[idx];\n    var h = barHTML(cfg.title, '<span class=\"chip\">Soal ' + (idx+1) + '/' + qs.length + '<\/span>');\n    h += '<div class=\"status\"><span class=\"chip\">Skor: ' + score + '<\/span>' + (cfg.perQ ? '<span class=\"chip\" id=\"tchip\">' + cfg.perQ + ' dtk<\/span>' : '') + '<\/div>';\n    h += '<div class=\"qcard\">';\n    if (q.ctx) h += '<p class=\"ctx\">' + q.ctx + '<\/p>';\n    if (q.clue) h += '<div class=\"clue\"><b>' + (q.cluelabel || 'Temuan') + '<\/b>' + q.clue + '<\/div>';\n    h += '<h3>' + q.prompt + '<\/h3><div class=\"opts' + (cfg.cols === 2 ? ' cols2' : '') + '\">';\n    q.opts.forEach(function(o){ h += '<button class=\"opt\" data-k=\"' + o.k + '\">' + o.t + '<\/button>'; });\n    h += '<\/div><div id=\"fb\"><\/div><\/div>';\n    view.innerHTML = h;\n    bindBack();\n    Array.prototype.forEach.call(view.querySelectorAll('.opt'), function(b){\n      b.addEventListener('click', function(){ answer(b.dataset.k); });\n    });\n    if (cfg.perQ) {\n      left = cfg.perQ;\n      timerId = setInterval(function(){\n        left--;\n        var c = document.getElementById('tchip');\n        if (c) { c.textContent = left + ' dtk'; c.className = 'chip' + (left <= 5 ? ' warn' : ''); }\n        if (left <= 0) { clearTimer(); answer(null); }\n      }, 1000);\n    }\n  }\n  function answer(k){\n    if (answered) return;\n    answered = true; clearTimer();\n    var q = qs[idx];\n    var right = (k !== null && String(k) === String(q.ans));\n    if (right) score++;\n    var chosen = null, correct = null;\n    q.opts.forEach(function(o){ if (String(o.k) === String(k)) chosen = o; if (String(o.k) === String(q.ans)) correct = o; });\n    Array.prototype.forEach.call(view.querySelectorAll('.opt'), function(b){\n      b.disabled = true;\n      if (String(b.dataset.k) === String(q.ans)) b.classList.add('right');\n      else if (k !== null && b.dataset.k === String(k)) b.classList.add('wrong');\n    });\n    var txt = '';\n    if (k === null) txt += 'Waktu habis. ';\n    if (!right && chosen && chosen.fb) txt += chosen.fb + ' ';\n    if (!right && correct) txt += 'Jawaban tepat: ' + correct.t + '. ';\n    if (right && correct && correct.fb) txt += correct.fb + ' ';\n    if (q.why) txt += q.why;\n    var last = idx === qs.length - 1;\n    document.getElementById('fb').innerHTML =\n      '<div class=\"fb ' + (right ? 'ok' : 'bad') + '\"><b>' + (right ? 'Benar' : (k === null ? 'Waktu habis' : 'Belum tepat')) + '<\/b>' + txt + '<\/div>' +\n      '<div class=\"row-btns\"><button class=\"btn\" id=\"nx\">' + (last ? 'Lihat hasil' : 'Lanjut') + '<\/button><\/div>';\n    var nx = document.getElementById('nx');\n    nx.onclick = function(){ if (last) cfg.finish(score, qs.length); else { idx++; render(); } };\n    nx.focus();\n  }\n  render();\n}\n\n/* ===================== komponen: urutkan ===================== */\n/* cfg: {level,title,task,items:[{id,t}] (urutan benar),labels,locked:[idx],feedback:'live'|'marks'|'count',timer,g2,reveal,\n         onDone(res),onTimeout(res)} */\nfunction runOrder(cfg){\n  clearTimer();\n  var items = cfg.items, n = items.length, byId = {};\n  items.forEach(function(it){ byId[it.id] = it; });\n  var st = {slots:[], locked:{}, done:false, mistakes:0, checks:0, left:cfg.timer || 0, msg:'', marks:null};\n  for (var i=0;i<n;i++) st.slots.push(null);\n  (cfg.locked || []).forEach(function(i){ st.slots[i] = items[i].id; st.locked[i] = true; });\n  var poolOrder = shuffle(items.map(function(it){ return it.id; })).filter(function(id){ return st.slots.indexOf(id) < 0; });\n  var fbk = cfg.feedback;\n\n  view.innerHTML = barHTML(cfg.title, '') + '<div id=\"stage\"><\/div>';\n  bindBack();\n  var stage = document.getElementById('stage');\n\n  function chipHTML(){\n    if (cfg.timer) return '<span class=\"chip\" id=\"tchip\">' + st.left + ' dtk<\/span>';\n    if (fbk === 'live') return '<span class=\"chip\" id=\"mchip\">Salah: ' + st.mistakes + '<\/span>';\n    return '<span class=\"chip\" id=\"mchip\">Periksa: ' + st.checks + 'x<\/span>';\n  }\n  function draw(){\n    var h = '<div class=\"status\">' + chipHTML() + '<\/div><div class=\"task\">' + cfg.task + '<\/div><div class=\"slots\" id=\"slots\">';\n    for (var i=0;i<n;i++){\n      var id = st.slots[i], cls = 'c';\n      if (id) {\n        cls += st.locked[i] ? ' locked' : ' filled';\n        if (!st.locked[i]) {\n          if (fbk === 'live') cls += (id === items[i].id ? ' ok' : ' bad');\n          else if (st.marks) cls += (st.marks[i] ? ' ok' : ' bad');\n        }\n      }\n      h += '<div class=\"slot\" data-i=\"' + i + '\"><div class=\"n\">' + (i+1) + '<\/div><div class=\"' + cls + '\">';\n      if (id) h += '<span>' + (cfg.labels && cfg.showLabels ? '<span class=\"lab\">' + cfg.labels[i] + '<\/span>' : '') + esc(byId[id].t) + (st.locked[i] ? ' <span class=\"lab\" style=\"display:inline\">(terkunci)<\/span>' : '') + '<\/span>';\n      else h += '<span class=\"lab\" style=\"color:var(--muted)\">Tap kartu di bawah<\/span>';\n      h += '<\/div><\/div>';\n    }\n    h += '<\/div><div class=\"opool' + (cfg.g2 ? ' g2' : '') + '\" id=\"opool\">';\n    var inPool = poolOrder.filter(function(id){ return st.slots.indexOf(id) < 0; });\n    if (!inPool.length) h += '<span class=\"empty\">Semua kartu sudah dipasang<\/span>';\n    inPool.forEach(function(id){ h += '<button class=\"ocard\" data-id=\"' + id + '\">' + esc(byId[id].t) + '<\/button>'; });\n    h += '<\/div><div class=\"row-btns\"><button class=\"btn alt\" id=\"rs\">Ulangi<\/button>' +\n         (fbk !== 'live' ? '<button class=\"btn\" id=\"ck\">Periksa<\/button>' : '') + '<\/div><div class=\"msg\" id=\"msg\"><\/div>';\n    stage.innerHTML = h;\n    document.getElementById('msg').textContent = st.msg;\n    document.getElementById('rs').onclick = function(){\n      if (st.done) return;\n      for (var i=0;i<n;i++) if (!st.locked[i]) st.slots[i] = null;\n      st.msg = ''; st.marks = null; draw();\n    };\n    var ck = document.getElementById('ck');\n    if (ck) ck.onclick = check;\n  }\n  function firstEmpty(){ for (var i=0;i<n;i++) if (st.slots[i] === null) return i; return -1; }\n  function allCorrect(){ for (var i=0;i<n;i++) if (st.slots[i] !== items[i].id) return false; return true; }\n\n  stage.addEventListener('click', function(e){\n    if (st.done) return;\n    var oc = e.target.closest('.ocard');\n    if (oc) {\n      var i = firstEmpty();\n      if (i < 0) return;\n      st.slots[i] = oc.dataset.id; st.msg = ''; st.marks = null;\n      if (fbk === 'live' && oc.dataset.id !== items[i].id) st.mistakes++;\n      draw();\n      if (fbk === 'live') {\n        if (allCorrect()) finish();\n        else if (firstEmpty() < 0) { st.msg = 'Tap kartu yang merah untuk mengembalikannya, lalu coba lagi.'; draw(); }\n      }\n      return;\n    }\n    var sl = e.target.closest('.slot');\n    if (sl) {\n      var j = +sl.dataset.i;\n      if (st.slots[j] && !st.locked[j]) { st.slots[j] = null; st.msg = ''; st.marks = null; draw(); }\n    }\n  });\n\n  function check(){\n    if (st.done) return;\n    if (firstEmpty() >= 0) { st.msg = 'Isi semua posisi dulu.'; draw(); return; }\n    st.checks++;\n    var ok = 0, marks = [];\n    for (var i=0;i<n;i++){ var m = st.slots[i] === items[i].id; marks.push(m); if (m) ok++; }\n    if (ok === n) { finish(); return; }\n    st.marks = fbk === 'marks' ? marks : null;\n    st.msg = ok + ' dari ' + n + ' posisi sudah benar. Coba lagi.';\n    draw();\n  }\n  function finish(){\n    if (st.done) return;\n    st.done = true; clearTimer();\n    var res = {mistakes:st.mistakes, checks:st.checks, left:st.left, ok:true};\n    if (cfg.reveal) {\n      var h = '<div class=\"reveal\"><b>Urutan yang benar<\/b><ol>';\n      items.forEach(function(it, i){ h += '<li>' + (cfg.labels ? '<b>' + cfg.labels[i] + ':<\/b> ' : '') + esc(it.t) + '<\/li>'; });\n      h += '<\/ol><\/div><div class=\"row-btns\"><button class=\"btn\" id=\"go\">Lanjut<\/button><\/div>';\n      stage.innerHTML = '<div class=\"status\"><span class=\"chip good\">Urutan benar<\/span><\/div>' + h;\n      document.getElementById('go').onclick = function(){ cfg.onDone(res); };\n    } else cfg.onDone(res);\n  }\n  if (cfg.timer) {\n    timerId = setInterval(function(){\n      if (st.done) return;\n      st.left--;\n      var c = document.getElementById('tchip');\n      if (c) { c.textContent = st.left + ' dtk'; c.className = 'chip' + (st.left <= 15 ? ' warn' : ''); }\n      if (st.left <= 0) { st.left = 0; st.done = true; clearTimer(); if (cfg.onTimeout) cfg.onTimeout({checks:st.checks}); }\n    }, 1000);\n  }\n  draw();\n}\n\n/* ===================== komponen: sortir ke kotak ===================== */\n/* cfg: {level,title,task,bins:[{id,label,short,sub}],cards:[{id,t,bin}],hideNames,feedback:'live'|'check',onDone(res)} */\nfunction runSorter(cfg){\n  clearTimer();\n  var st = {place:{}, sel:null, mistakes:0, checks:0, done:false, msg:'', marks:null};\n  var cards = shuffle(cfg.cards), byId = {};\n  cfg.cards.forEach(function(c){ byId[c.id] = c; });\n  var live = cfg.feedback === 'live';\n  view.innerHTML = barHTML(cfg.title, '') + '<div id=\"stage\"><\/div>';\n  bindBack();\n  var stage = document.getElementById('stage');\n\n  function draw(){\n    var h = '<div class=\"status\"><span class=\"chip\" id=\"mchip\">' + (live ? 'Salah: ' + st.mistakes : 'Periksa: ' + st.checks + 'x') + '<\/span><\/div>';\n    h += '<div class=\"task\">' + cfg.task + '<\/div>';\n    h += '<div class=\"spool\"><div class=\"box\" id=\"pool\">';\n    var rest = cards.filter(function(c){ return !st.place[c.id]; });\n    if (!rest.length) h += '<span class=\"empty\">Semua kartu sudah dipasang<\/span>';\n    rest.forEach(function(c){ h += '<button class=\"scard' + (st.sel === c.id ? ' sel' : '') + '\" data-id=\"' + c.id + '\">' + esc(c.t) + '<\/button>'; });\n    h += '<\/div><\/div><div id=\"bins\">';\n    cfg.bins.forEach(function(b){\n      h += '<div class=\"bin' + (st.sel ? ' target' : '') + '\" data-bin=\"' + b.id + '\"><div class=\"bl\">' + (cfg.hideNames ? b.short : b.label) +\n           (!cfg.hideNames && b.sub ? '<span class=\"bs\">' + b.sub + '<\/span>' : '') + '<\/div><div class=\"items\">';\n      cards.filter(function(c){ return st.place[c.id] === b.id; }).forEach(function(c){\n        var cls = 'scard';\n        if (live) cls += (c.bin === b.id ? ' ok' : ' bad');\n        else if (st.marks) cls += (c.bin === b.id ? ' ok' : ' bad');\n        h += '<button class=\"' + cls + '\" data-placed=\"' + c.id + '\">' + esc(c.t) + '<\/button>';\n      });\n      h += '<\/div><\/div>';\n    });\n    h += '<\/div>' + (live ? '' : '<div class=\"row-btns\"><button class=\"btn alt\" id=\"rs\">Ulangi<\/button><button class=\"btn\" id=\"ck\">Periksa<\/button><\/div>') +\n         '<div class=\"msg\" id=\"msg\"><\/div>';\n    stage.innerHTML = h;\n    document.getElementById('msg').textContent = st.msg;\n    var rs = document.getElementById('rs');\n    if (rs) rs.onclick = function(){ if (st.done) return; st.place = {}; st.sel = null; st.msg = ''; st.marks = null; draw(); };\n    var ck = document.getElementById('ck');\n    if (ck) ck.onclick = check;\n  }\n  function allPlaced(){ return cards.every(function(c){ return st.place[c.id]; }); }\n  function allRight(){ return cards.every(function(c){ return st.place[c.id] === c.bin; }); }\n\n  stage.addEventListener('click', function(e){\n    if (st.done) return;\n    var c = e.target.closest('#pool [data-id]');\n    if (c) { st.sel = (st.sel === c.dataset.id) ? null : c.dataset.id; draw(); return; }\n    var bin = e.target.closest('[data-bin]');\n    var pc = e.target.closest('[data-placed]');\n    if (pc && !st.sel) { delete st.place[pc.dataset.placed]; st.msg = ''; st.marks = null; draw(); return; }\n    if (bin && st.sel) {\n      var card = byId[st.sel];\n      st.place[card.id] = bin.dataset.bin;\n      if (live && card.bin !== bin.dataset.bin) st.mistakes++;\n      st.sel = null; st.msg = ''; st.marks = null;\n      draw();\n      if (live) {\n        if (allRight()) finish();\n        else if (allPlaced()) { st.msg = 'Tap kartu yang merah untuk memindahkannya, lalu coba lagi.'; draw(); }\n      }\n    }\n  });\n  function check(){\n    if (st.done) return;\n    if (!allPlaced()) { st.msg = 'Pasang semua kartu dulu.'; draw(); return; }\n    st.checks++;\n    var ok = cards.filter(function(c){ return st.place[c.id] === c.bin; }).length;\n    if (ok === cards.length) { finish(); return; }\n    st.marks = true;\n    st.msg = ok + ' dari ' + cards.length + ' kartu sudah di tempat yang benar.';\n    draw();\n  }\n  function finish(){\n    if (st.done) return;\n    st.done = true;\n    cfg.onDone({mistakes:st.mistakes, checks:st.checks});\n  }\n  draw();\n}\n\n/* ===================== Kepatuhan dan Kematangan ===================== */\nvar K3_PERQ = 30;   /* detik per soal di Level 3 */\n/* Data soal disalin dari TAMBAH_GAME_MANTI_3_4.md. Hanya teks PENGECOH 6 soal bank yang diperpanjang agar jawaban benar tidak selalu opsi terpendek atau terpanjang. */\n/* helper kuis: bentuk satu soal untuk runQuiz. Kunci opsi berupa huruf. */\nfunction mkQ(ctx, prompt, optTexts, ansText, why, fixed){\n  var texts = fixed ? optTexts.slice() : shuffle(optTexts);\n  var opts = texts.map(function(t, i){ return {k:String.fromCharCode(97 + i), t:t}; });\n  var hit = opts.filter(function(o){ return o.t === ansText; });\n  if (hit.length !== 1) throw new Error('Jawaban tidak ditemukan tepat satu kali: ' + ansText);\n  return {ctx:ctx, prompt:prompt, opts:opts, ans:hit[0].k, why:why};\n}\n\nvar K3_KAT = [\n  {id:'sangat', label:'Sangat patuh',                sub:'90-100%', short:'90-100%'},\n  {id:'patuh',  label:'Patuh',                       sub:'75-89%',  short:'75-89%'},\n  {id:'cukup',  label:'Cukup patuh',                 sub:'60-74%',  short:'60-74%'},\n  {id:'tidak',  label:'Tidak patuh / risiko tinggi', sub:'<60%',    short:'<60%'}\n];\nfunction k3Kategori(p){ return p >= 90 ? 'sangat' : (p >= 75 ? 'patuh' : (p >= 60 ? 'cukup' : 'tidak')); }\nfunction k3Nama(id){ return K3_KAT.filter(function(k){ return k.id === id; })[0].label; }\n\n/* Level 1: kartu skor. Ambil 2 acak per kategori (8 kartu). Sengaja tanpa nilai batas (90, 75, 60). */\nvar K3_SKOR = {\n  sangat:[91, 93, 96, 98],\n  patuh: [77, 80, 82, 86],\n  cukup: [62, 65, 68, 72],\n  tidak: [41, 48, 52, 57]\n};\nfunction k3L1Cards(){\n  var out = [], n = 0;\n  Object.keys(K3_SKOR).forEach(function(kat){\n    shuffle(K3_SKOR[kat]).slice(0, 2).forEach(function(v){ out.push({id:'c' + (n++), t:v + '%', bin:kat}); });\n  });\n  return out;\n}\n\n/* Level 2: dua ronde urutan. Susunan array = urutan benar. name dipakai hanya di layar \"Urutan yang benar\". */\nvar K3_MATURITY = [\n  {id:'m1', t:'Proses belum terdokumentasi, ketergantungan tinggi pada individu, kontrol minim', name:'Level 1: Initial (Awal)'},\n  {id:'m2', t:'Proses terdokumentasi dan konsisten, pengelolaan dasar dan pengendalian risiko mulai ada', name:'Level 2: Managed (Terorganisir)'},\n  {id:'m3', t:'Proses formal dan menjadi standar organisasi', name:'Level 3: Defined (Terdefinisi)'},\n  {id:'m4', t:'Pengukuran dan analisis data dilakukan secara rutin', name:'Level 4: Quantitatively Managed'},\n  {id:'m5', t:'Perbaikan berkelanjutan dan inovasi proaktif', name:'Level 5: Optimizing'}\n];\nvar K3_LANGKAH = [\n  {id:'e1', t:'Pengumpulan data dan dokumen', name:'Langkah 1'},\n  {id:'e2', t:'Penilaian tingkat kematangan', name:'Langkah 2'},\n  {id:'e3', t:'Menilai kepatuhan terhadap standar dan regulasi', name:'Langkah 3'},\n  {id:'e4', t:'Analisis dan pelaporan hasil', name:'Langkah 4'}\n];\n\n/* Level 3: bank soal. a = jawaban benar, o = opsi khusus (bila tidak ada, pakai K3_OPTS), w = penjelasan. */\nvar K3_OPTS = {\n  level:['Initial (Awal)', 'Managed (Terorganisir)', 'Defined (Terdefinisi)', 'Quantitatively Managed', 'Optimizing'],\n  langkah:['Pengumpulan data dan dokumen', 'Penilaian tingkat kematangan', 'Menilai kepatuhan terhadap standar dan regulasi', 'Analisis dan pelaporan hasil']\n};\nvar K3_FIXED = {level:true, langkah:true};\nvar K3_ASK = {level:'Tingkat kematangan yang paling sesuai?', langkah:'Termasuk langkah evaluasi yang mana?'};\nvar K3_BANK = {\n  level:[\n    {p:'Pengelolaan server hanya berjalan karena satu admin yang hafal caranya. Tidak ada dokumen prosedur dan kontrol minim.', a:'Initial (Awal)', w:'Ciri Initial: proses belum terdokumentasi, bergantung pada individu, kontrol minim.'},\n    {p:'Prosedur backup sudah terdokumentasi dan dijalankan konsisten, dan pengendalian risiko dasar mulai ada.', a:'Managed (Terorganisir)', w:'Ciri Managed: proses terdokumentasi dan konsisten, pengelolaan dasar dan pengendalian risiko mulai ada.'},\n    {p:'Seluruh unit mengikuti prosedur formal yang sudah menjadi standar organisasi.', a:'Defined (Terdefinisi)', w:'Ciri Defined: proses formal dan menjadi standar organisasi.'},\n    {p:'Waktu pemulihan layanan dan kapasitas server diukur dan dianalisis secara rutin.', a:'Quantitatively Managed', w:'Ciri Quantitatively Managed: pengukuran dan analisis data dilakukan rutin.'},\n    {p:'Hasil evaluasi dipakai terus-menerus untuk perbaikan dan inovasi proaktif.', a:'Optimizing', w:'Ciri Optimizing: perbaikan berkelanjutan dan inovasi proaktif.'}\n  ],\n  langkah:[\n    {p:'Tim mengumpulkan data dan dokumen pendukung dari unit yang diperiksa.', a:'Pengumpulan data dan dokumen', w:'Ini langkah 1 evaluasi hasil pemeriksaan kepatuhan.'},\n    {p:'Tim menilai proses TI memakai model tingkat kematangan.', a:'Penilaian tingkat kematangan', w:'Ini langkah 2: penilaian tingkat kematangan.'},\n    {p:'Tim membandingkan kondisi unit dengan ISO 27001 dan ketentuan pemerintah.', a:'Menilai kepatuhan terhadap standar dan regulasi', w:'Ini langkah 3: menilai kepatuhan terhadap standar dan regulasi.'},\n    {p:'Tim menganalisis hasil penilaian, lalu menyusun laporan beserta rekomendasi peningkatan.', a:'Analisis dan pelaporan hasil', w:'Ini langkah 4. Output evaluasi berupa gambaran kondisi tata kelola TI dan rekomendasi peningkatan.'}\n  ],\n  kasus:[\n    {p:'Sebuah unit kerja memperoleh skor kepatuhan 82% dengan satu temuan minor: dokumentasi SOP incident response belum lengkap. Kategori dan rekomendasi yang tepat?',\n     a:'Patuh; lengkapi dokumentasi SOP sebelum audit berikutnya',\n     o:['Patuh; lengkapi dokumentasi SOP sebelum audit berikutnya', 'Sangat patuh; tidak perlu tindakan apa pun pada audit berikutnya', 'Cukup patuh; ganti seluruh perangkat server lalu audit ulang', 'Tidak patuh; hentikan operasional unit sampai audit ulang'],\n     w:'Skor 82% masuk kategori Patuh (75-89%). Temuan minornya ditindaklanjuti dengan melengkapi dokumentasi SOP sebelum audit berikutnya.'},\n    {p:'Pada studi kasus audit kepatuhan berbasis COBIT, checklist mencakup aspek apa saja?',\n     a:'Kontrol akses, backup data, dan incident response',\n     o:['Kontrol akses, backup data, dan incident response', 'Harga perangkat, jumlah pegawai, dan luas gedung', 'Jumlah aplikasi, jumlah vendor, dan jumlah proyek', 'Kecepatan internet, jumlah printer, dan jadwal rapat'],\n     w:'Checklist studi kasus mencakup kontrol akses, backup data, dan incident response.'}\n  ],\n  reviu:[\n    {p:'Mana yang BUKAN bagian dari proses reviu kebijakan infrastruktur TI?', a:'Membeli perangkat baru untuk setiap unit',\n     o:['Membeli perangkat baru untuk setiap unit', 'Menilai keselarasan kebijakan dengan strategi organisasi', 'Mengevaluasi roadmap dan program TI', 'Mengidentifikasi isu, duplikasi, atau kebutuhan revisi'],\n     w:'Reviu menilai keselarasan dengan strategi, mengevaluasi roadmap dan program TI, serta mengidentifikasi isu, duplikasi, atau kebutuhan revisi. Pembelian perangkat bukan bagiannya.'},\n    {p:'Siapa yang dilibatkan untuk mengesahkan perubahan kebijakan hasil reviu?', a:'Komite TI',\n     o:['Komite TI', 'Vendor perangkat', 'Seluruh pengguna akhir', 'Penyedia internet'],\n     w:'Reviu melibatkan komite TI untuk pengesahan perubahan.'},\n    {p:'Kapan reviu kebijakan infrastruktur TI dilakukan?', a:'Secara berkala agar kebijakan tetap up-to-date',\n     o:['Secara berkala agar kebijakan tetap up-to-date', 'Hanya saat terjadi insiden besar di unit', 'Hanya sekali, yaitu saat kebijakan pertama dibuat', 'Hanya saat terjadi pergantian vendor layanan'],\n     w:'Reviu dilakukan secara berkala agar kebijakan tetap up-to-date, efisien, dan mendukung transformasi digital.'}\n  ],\n  renstra:[\n    {p:'Analisis apa yang dipakai untuk mengetahui kekuatan dan kelemahan pada evaluasi perencanaan strategis TI?', a:'Analisis SWOT',\n     o:['Analisis SWOT', 'Analisis log akses', 'Analisis bandwidth', 'Analisis harga pasar'],\n     w:'Evaluasi kebijakan dan perencanaan strategis TI memakai analisis SWOT untuk melihat kekuatan dan kelemahan.'},\n    {p:'Framework apa yang dipakai menilai kesiapan infrastruktur dan tata kelola pada evaluasi kebijakan dan perencanaan strategis TI?', a:'COBIT',\n     o:['COBIT', 'Scrum', 'Kanban', 'Model OSI'],\n     w:'Kesiapan infrastruktur dan tata kelola dinilai berdasarkan framework COBIT.'},\n    {p:'Mana yang termasuk fokus evaluasi kebijakan dan perencanaan strategis TI?', a stikan seluruh aspek TI sesuai kebijakan internal dan regulasi eksternal yang berlaku.'}\n  ]\n};\n\n/* Soal hitung skor: dibangkitkan, bukan dari bank. n kontrol dipilih dari {10,20,25,50} supaya persen selalu bilangan bulat. */\nfunction k3SkorQ(kat){\n  var combos = [];\n  [10, 20, 25, 50].forEach(function(n){\n    for (var m = 0; m <= n; m++) { var pct = m * (100 / n); if (k3Kategori(pct) === kat) combos.push({n:n, m:m, pct:pct}); }\n  });\n  var c = pick(combos);\n  var names = K3_KAT.map(function(k){ return k.label; });\n  var range = K3_KAT.filter(function(k){ return k.id === kat; })[0].sub;\n  return mkQ('Sebuah unit kerja memenuhi ' + c.m + ' dari ' + c.n + ' kontrol pada checklist kepatuhan berbasis COBIT.',\n    'Skor kepatuhannya termasuk kategori apa?', names, k3Nama(kat),\n    c.m + ' / ' + c.n + ' x 100% = ' + c.pct + '%, masuk kategori ' + k3Nama(kat) + ' (' + range + ').', true);\n}\nfunction k3Bank(fam){\n  var e = pick(K3_BANK[fam]);\n  var opts = e.o || K3_OPTS[fam];\n  var fixed = !!K3_FIXED[fam];\n  return K3_ASK[fam] ? mkQ(e.p, K3_ASK[fam], opts, e.a, e.w, fixed) : mkQ(null, e.p, opts, e.a, e.w, fixed);\n}\n/* 8 soal: 2 hitung skor (kategori berbeda) + 1 dari tiap keluarga lain. */\nfunction k3BuildL3(){\n  var cats = shuffle(['sangat', 'patuh', 'cukup', 'tidak']).slice(0, 2);\n  var qs = cats.map(k3SkorQ);\n  ['level', 'langkah', 'kasus', 'reviu', 'renstra', 'kerangka'].forEach(function(f){ qs.push(k3Bank(f)); });\n  return shuffle(qs);\n}\n\n\nGAME = {\n  key:'kepatuhan', title:'Kepatuhan dan Kematangan', emoji:'✅',\n  intro:'Nilai skor kepatuhan, urutkan tingkat kematangan, dan baca kasus audit kepatuhan infrastruktur TI.',\n  levels:[['Mudah','Cocokkan 8 skor ke 4 kategori kepatuhan, langsung ada tanda benar atau salah'],\n          ['Sedang','Urutkan 5 tingkat kematangan dan 4 langkah evaluasi'],\n          ['Sulit','8 soal acak: hitung skor, baca kasus, reviu dan evaluasi kebijakan (' + K3_PERQ + ' detik per soal)']],\n  foot:'Rujukan: Slide Manajemen Infrastruktur TI hal. 63-70.',\n  start:function(level){\n    if (level === 1) {\n      runSorter({level:1, title:levelTitle(1), feedback:'live', bins:K3_KAT, cards:k3L1Cards(),\n        task:'Tap skor, lalu tap kategori kepatuhan yang tepat. Tap kartu di kotak untuk memindahkannya.',\n        onDone:function(r){\n          var s = starsLow(r.mistakes, 1, 4); saveBest(1, s);\n          showResult({level:1, stars:s, title:'Semua skor tepat!', text: s === 3 ? 'Rapi. Kategori kepatuhan sudah hafal.' : 'Berhasil. Ulangi untuk lebih tepat.', stats:['Salah letak: ' + r.mistakes]});\n        }});\n    } else if (level === 2) {\n      var checks = 0;\n      var round2 = function(){\n        runOrder({level:2, title:levelTitle(2) + ' (2/2)', items:K3_LANGKAH.map(function(x){ return {id:x.id, t:x.t}; }),\n          labels:K3_LANGKAH.map(function(x){ return x.name; }), showLabels:false, feedback:'marks', reveal:true,\n          task:'Urutkan 4 langkah evaluasi hasil pemeriksaan kepatuhan dari yang paling awal, lalu tap Periksa.',\n          onDone:function(r){\n            checks += r.checks;\n            var s = starsLow(checks, 2, 4); saveBest(2, s);\n            showResult({level:2, stars:s, title:'Dua urutan benar!', text: s === 3 ? 'Rapi. Level kematangan dan langkah evaluasi sudah lancar.' : 'Berhasil. Ulangi supaya sekali jalan.', stats:['Pemeriksaan: ' + checks + 'x']});\n          }});\n      };\n      runOrder({level:2, title:levelTitle(2) + ' (1/2)', items:K3_MATURITY.map(function(x){ return {id:x.id, t:x.t}; }),\n        labels:K3_MATURITY.map(function(x){ return x.name; }), showLabels:false, feedback:'marks', reveal:true,\n        task:'Urutkan ciri-ciri ini dari tingkat kematangan paling rendah (Level 1) sampai paling tinggi (Level 5), lalu tap Periksa.',\n        onDone:function(r){ checks = r.checks; round2(); }});\n    } else {\n      runQuiz({level:3, title:levelTitle(3), qs:k3BuildL3(), perQ:K3_PERQ,\n        finish:function(score, total){\n          var s = starsBy(score, 7, 5, 3); saveBest(3, s);\n          showResult({level:3, stars:s, title:'Skor ' + score + ' dari ' + total,\n            text: s === 3 ? 'Hampir sempurna. Kategori, level, dan kasus kepatuhan sudah tajam.' : (s >= 1 ? 'Bagus. Ulangi dan hafalkan rentang kategori serta ciri tiap level.' : 'Ulangi dulu Level 1 dan 2, lalu coba lagi.'),\n            stats:[], note:'Soal hitung skor memakai asumsi sederhana: skor = kontrol terpenuhi dibagi total kontrol x 100%.'});\n        }});\n    }\n  }\n};\nshowMenu();\n\n<\/script>\n<\/body>\n<\/html>\n"}

})();

function esc(s){ return String(s).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function gameByKey(k){ return GAMES.filter(function(g){ return g.key === k; })[0]; }

/* ---------- data lokal: log + antrean kirim ---------- */
var log = LS.get('pk_log', []);       /* semua hasil (untuk CSV & progres) */
var queue = LS.get('pk_queue', []);   /* belum terkirim ke Sheet */
var syncState = '';

function flush(){
  if (!SHEET_URL || !queue.length) { render(); return Promise.resolve(); }
  var batch = queue.slice();
  syncState = 'sending'; render();
  return fetch(SHEET_URL, {method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify({rows:batch})})
    .then(function(){
      var ids = {}; batch.forEach(function(r){ ids[r.id] = 1; });
      queue = queue.filter(function(r){ return !ids[r.id]; });
      LS.set('pk_queue', queue); syncState = 'ok'; render();
    })
    .catch(function(){ syncState = 'fail'; render(); });
}
function record(r){
  var row = {id:Date.now() + '-' + Math.random().toString(36).slice(2,7), waktu:new Date().toISOString(), nama:player, kelas:KELAS,
    game:current.title, tema:current.tema, level:r.level, bintang:r.stars, hasil:r.title, detail:r.stats};
  log.push(row); queue.push(row);
  LS.set('pk_log', log); LS.set('pk_queue', queue);
  flush();
}
window.addEventListener('message', function(e){
  if (e.source !== frame.contentWindow || !e.data || !e.data.quizResult || !current || !player) return;

});

function best(gk){
  var b = {1:0,2:0,3:0};
  log.forEach(function(r){ if (r.nama === player && (r.kelas || '-') === KELAS && r.game === gameByKey(gk).title && r.bintang > (b[r.level]||0)) b[r.level] = r.bintang; });
  return b;
}
function starsHTML(n){ var s = ''; for (var i=1;i<=3;i++) s += i<=n ? '★' : '<span class="off">★</span>'; return '<span class="stars">' + s + '</span>'; }
function totalStars(){ return GAMES.reduce(function(t,g){ var b = best(g.key); return t + b[1] + b[2] + b[3]; }, 0); }

    '<form class="card" id="f"><label for="nm">Nama kamu</label><input type="text" id="nm" maxlength="60" autocomplete="name" placeholder="Nama lengkap" value="' + esc(LS.get('pk_lastname','')) + '">' +

function downloadCSV(){
  var cols = ['waktu','kelas','nama','game','tema','level','bintang','hasil','detail'];

    return cols.map(function(c){ var v = String(r[c] == null ? (c === 'kelas' ? '-' : '') : r[c]); if (/^[=+\-@]/.test(v)) v = "'" + v; return '"' + v.replace(/"/g,'""') + '"'; }).join(',');
  }));
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿' + rows.join('\n')], {type:'text/csv'}));

}

/* ---------- avatar karakter (deterministik dari nama, konsisten di semua layar) ---------- */
var AVATARS = ['🦊','🐼','🐯','🦁','🐸','🐙','🦄','🐲','🦉','🐧','🐨','🐵','🐰','🐻','🦖','🐳'];
var AVBG = ['#FCDDC2','#CDEFE0','#D9E0FF','#FFD6E2','#FFF0B8','#E4D9FF','#CFEFFA','#FAD0D0'];
function avatar(nama, px){
  var h = 5381, t = String(nama).trim().toLowerCase();
  for (var i=0;i<t.length;i++) h = ((h << 5) + h + t.charCodeAt(i)) >>> 0;
  return '<span class="av" style="width:' + px + 'px;height:' + px + 'px;font-size:' + Math.round(px*.58) + 'px;background:' + AVBG[(h >>> 4) % AVBG.length] + '" aria-hidden="true">' + AVATARS[h % AVATARS.length] + '</span>';
}

/* ---------- baca data dari Google Sheet via JSONP (tanpa masalah CORS) ---------- */
function jsonp(params, ms){
  return new Promise(function(resolve, reject){
    if (!SHEET_URL) return reject(new Error('belum_dikonfigurasi'));
    var cb = '__pk' + Date.now() + Math.floor(Math.random()*1e4), sc = document.createElement('script'), done = false;
    function end(){ done = true; clearTimeout(tm); try{ delete window[cb]; }catch(e){ window[cb] = undefined; } sc.remove(); }
    var tm = setTimeout(function(){ if (!done){ end(); reject(new Error('timeout')); } }, ms || 12000);
    window[cb] = function(d){ if (!done){ end(); resolve(d); } };
    sc.onerror = function(){ if (!done){ end(); reject(new Error('gagal')); } };
    var q = Object.keys(params).map(function(k){ return encodeURIComponent(k) + '=' + encodeURIComponent(params[k]); }).join('&');
    sc.src = SHEET_URL + (SHEET_URL.indexOf('?') < 0 ? '?' : '&') + q + '&callback=' + cb;
    document.head.appendChild(sc);
  });
}

      h += '<div class="rows">';
      t.slice(3).forEach(function(r){
        h += '<div class="rrow' + (r.nama.trim().toLowerCase() === me ? ' me' : '') + '"><span class="rk">' + r.rank + '</span>' + avatar(r.nama, 38) +
             '<span class="nm" title="' + esc(r.nama) + '">' + esc(r.nama) + '</span><span class="pt">' + r.poin + '</span></div>';
      });
      h += '</div>';
    }
    if (d.saya) h += '<div class="saya">Posisimu: #' + d.saya.rank + ' dari ' + d.peserta + ' peserta · ' + d.saya.poin + ' poin</div>';
    else h += '<div class="saya">Kamu belum punya poin di kelas ini. Selesaikan satu level dulu.</div>';
  } else if (d) h += '<div class="kosong">Belum ada skor di kelas ini.</div>';
  else h += '<div class="kosong">Belum ada data. Tekan <b>Tarik data</b> untuk melihat peringkat.</div>';
  h += '<div class="lbact"><button class="btn" id="lbgo">Tarik data</button></div>';
  h += '<p class="lbmeta" id="lbmsg">' + (msg || (c ? 'Terakhir diperbarui ' + new Date(c.at).toLocaleTimeString('id-ID') : '')) + '</p>';
  app.innerHTML = h;
  document.getElementById('lbbk').onclick = render;
  document.getElementById('lbgo').onclick = tarikLB;
}
function tarikLB(){
  var now = Date.now();
  if (lbBusy) return;
  if (now - lbLast < 8000) { document.getElementById('lbmsg').textContent = 'Tunggu sebentar sebelum menarik data lagi.'; return; }
  lbBusy = true; lbLast = now;
  var btn = document.getElementById('lbgo'); btn.disabled = true; btn.textContent = 'Menarik data...';
  jsonp({action:'top', kelas:KELAS, nama:player}).then(function(d){
    if (!d || !d.ok) throw new Error('server');
    LS.set(lbKey(), {data:d, at:Date.now()});
    lbBusy = false; renderLB();
  }).catch(function(e){
    lbBusy = false; renderLB(e.message === 'belum_dikonfigurasi' ? 'Google Sheet belum dikonfigurasi.' :
      'Tidak ada respons dari server. Coba lagi, atau minta admin memastikan Code.gs terbaru sudah di-deploy.');
  });
}

/* ---------- main game dalam iframe ---------- */
function open(k){
  current = gameByKey(k);
  /* progres bawaan tiap game (localStorage) dikosongkan agar tidak bocor antar pemain */
  try{ Object.keys(localStorage).forEach(function(x){ if (/^best_|^kabel_utp_best$/.test(x)) localStorage.removeItem(x); }); }catch(e){}
  document.getElementById('ptitle').textContent = current.emoji + ' ' + current.title;
  frame.srcdoc = current.html.replace(/<\/body>/i, function(m){ return HOOK + m; });
  app.classList.add('hidden'); play.classList.remove('hidden');
}
document.getElementById('pback').onclick = function(){
  play.classList.add('hidden'); app.classList.remove('hidden'); frame.srcdoc = ''; current = null; render();
};

try{ player = sessionStorage.getItem('pk_player') || null; }catch(e){}
render(); flush();
</script>
