<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Admin Game Prakom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFF9F3;--card:#fff;--ink:#182255;--muted:#566086;--accent:#F79039;--accent-2:#FEBD26;--peach:#FCDDC2;--line:#F3D3B6;--ok:#14805A;--bad:#C23A3A}
@media (prefers-color-scheme:dark){:root{--bg:#121731;--card:#1B2347;--ink:#F4EFE8;--muted:#AAB1D3;--peach:#2A3263;--line:#3A4580;--ok:#4CD6A0;--bad:#FF8A8A}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 Arial,sans-serif}
h1,h2,h3{font-family:Montserrat,Arial,sans-serif;margin:0;line-height:1.2}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent-2);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding:16px 14px 40px}
.hero{background:var(--accent);color:#fff;border-radius:20px;padding:18px 20px}
.hero h1{font-size:clamp(22px,5vw,30px);font-weight:800}
.hero p{margin:6px 0 0;color:#FFF3E6}
.card{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px;margin-top:14px}
label{font-weight:700;display:block;margin-bottom:6px}
input[type=password],input[type=text],select{width:100%;border:2px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px}
.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:700;background:var(--accent);color:#fff}
.btn.alt{background:var(--card);color:var(--ink);border:2px solid var(--line)}
.btn:disabled{opacity:.55;cursor:default}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-top:14px}
.bar>div{flex:1;min-width:160px}
.bar .btn{flex:none}
.err{color:var(--bad);font-weight:700;margin:8px 0 0;min-height:20px}
.meta{color:var(--muted);font-size:13px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:14px}
.stat{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px}
.stat b{display:block;font:800 26px Montserrat,Arial,sans-serif}
.stat span{color:var(--muted);font-size:13px}
.av{display:inline-grid;place-items:center;border-radius:50%;line-height:1;flex:none}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:640px}
th,td{text-align:left;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-size:12px;text-transform:uppercase;position:sticky;top:0;background:var(--card)}
td.n{text-align:right;font-variant-numeric:tabular-nums}
td.nm .w{display:flex;align-items:center;gap:8px}
.top3 td:first-child{font-weight:800}
.hidden{display:none!important}
h2{font-size:17px;margin-bottom:8px}
.pill{background:var(--peach);border-radius:999px;padding:2px 10px;font-weight:700;font-size:12px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
var SHEET_URL = 'https://script.google.com/macros/s/AKfycbz7GzWQU0UNbt2i6LUE6O8OlJQtdGO-dCge2GpV6XD8WBZWWtuXEPL_R9MVFnvA3NDXUg/exec';
var app = document.getElementById('app'), DATA = null, TOKEN = '', FILTER = '*';
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
var AVATARS = ['🦊','🐼','🐯','🦁','🐸','🐙','🦄','🐲','🦉','🐧','🐨','🐵','🐰','🐻','🦖','🐳'];
var AVBG = ['#FCDDC2','#CDEFE0','#D9E0FF','#FFD6E2','#FFF0B8','#E4D9FF','#CFEFFA','#FAD0D0'];
function avatar(nama, px){
  var h = 5381, t = String(nama).trim().toLowerCase();
  for (var i=0;i<t.length;i++) h = ((h << 5) + h + t.charCodeAt(i)) >>> 0;
  return '<span class="av" style="width:' + px + 'px;height:' + px + 'px;font-size:' + Math.round(px*.58) + 'px;background:' + AVBG[(h >>> 4) % AVBG.length] + '" aria-hidden="true">' + AVATARS[h % AVATARS.length] + '</span>';
}
function jsonp(params, ms){
  return new Promise(function(resolve, reject){
    if (!SHEET_URL) return reject(new Error('belum_dikonfigurasi'));
    var cb = '__pk' + Date.now() + Math.floor(Math.random()*1e4), sc = document.createElement('script'), done = false;
    function end(){ done = true; clearTimeout(tm); try{ delete window[cb]; }catch(e){ window[cb] = undefined; } sc.remove(); }
    var tm = setTimeout(function(){ if (!done){ end(); reject(new Error('timeout')); } }, ms || 20000);
    window[cb] = function(d){ if (!done){ end(); resolve(d); } };
    sc.onerror = function(){ if (!done){ end(); reject(new Error('gagal')); } };
    var q = Object.keys(params).map(function(k){ return encodeURIComponent(k) + '=' + encodeURIComponent(params[k]); }).join('&');
    sc.src = SHEET_URL + (SHEET_URL.indexOf('?') < 0 ? '?' : '&') + q + '&callback=' + cb;
    document.head.appendChild(sc);
  });
}
var PESAN = {
  admin_belum_diatur:'Token admin belum dibuat. Di Apps Script jalankan fungsi buatTokenAdmin, lalu ambil token dari Execution log.',
  token_terlalu_pendek:'Token di server terlalu pendek (minimal 6 karakter). Perbarui ADMIN_TOKEN di Script Properties.',
  terkunci:'Terlalu banyak token salah. Tunggu sekitar 10 menit lalu coba lagi.',
  token_salah:'Token salah.', server_error:'Server error. Cek Executions di Apps Script.', aksi_tidak_dikenal:'Code.gs di server belum versi terbaru. Deploy New version.',
  timeout:'Tidak ada respons. Pastikan Code.gs terbaru sudah di-deploy (Deploy > Manage deployments > New version).', gagal:'Gagal terhubung ke server.',
  belum_dikonfigurasi:'SHEET_URL belum diisi di halaman ini.'
};
function login(msg){
  app.innerHTML = '<div class="hero"><h1>Admin Game Prakom</h1><p>Rekap peserta, peringkat per kelas, dan aktivitas terbaru.</p></div>' +
    '<form class="card" id="f" autocomplete="off"><label for="tk">Token admin</label><input type="password" id="tk" placeholder="Tempel token dari Apps Script" autocomplete="off">' +
    '<p class="err" id="er">' + esc(msg || '') + '</p><button class="btn" type="submit" style="width:100%;margin-top:6px">Masuk</button></form>';
  var tk = document.getElementById('tk'); tk.focus();
  document.getElementById('f').onsubmit = function(e){
    e.preventDefault(); TOKEN = tk.value.trim();
    if (!TOKEN) { document.getElementById('er').textContent = 'Isi token dulu.'; return; }
    tarik();
  };
}
function tarik(){
  var b = document.getElementById('tarik'); if (b){ b.disabled = true; b.textContent = 'Menarik...'; }
  jsonp({action:'admin', token:TOKEN}).then(function(d){
    if (!d || !d.ok) { var er = d && d.error; if (er === 'token_salah' || !DATA) { try{ sessionStorage.removeItem('pk_admin'); }catch(e){} DATA = null; TOKEN = ''; return login(PESAN[er] || 'Gagal.'); } return render(PESAN[er]); }
    try{ sessionStorage.setItem('pk_admin', TOKEN); }catch(e){}
    DATA = d; render();
  }).catch(function(e){ if (DATA) render(PESAN[e.message] || 'Gagal.'); else login(PESAN[e.message] || 'Gagal.'); });
}
function rows(){
  var p = DATA.peserta.filter(function(x){ return FILTER === '*' || x.kelas === FILTER; });
  return p.map(function(x, i){ var o = Object.assign({}, x); o.rank = i + 1; return o; });   // urutan dari server sudah menurut skor
}
function render(msg){
  var r = rows(), k = DATA.kelas, h = '';
  var tot = r.reduce(function(a,x){ a.s += x.selesai; a.p += x.percobaan; return a; }, {s:0,p:0});
  h += '<div class="hero"><h1>Admin Game Prakom</h1><p>Diperbarui ' + new Date(DATA.diperbarui).toLocaleTimeString('id-ID') + '</p></div>';
  h += '<div class="bar"><div><label for="kf">Kelas</label><select id="kf"><option value="*">Semua kelas</option>' +
       k.map(function(x){ return '<option value="' + esc(x) + '"' + (x === FILTER ? ' selected' : '') + '>' + (x === '-' ? '(tanpa kelas)' : esc(x)) + '</option>'; }).join('') + '</select></div>' +
       '<button class="btn" id="tarik">Tarik data</button><button class="btn alt" id="csv">Unduh CSV</button><button class="btn alt" id="out">Keluar</button></div>';
  h += '<p class="err" id="er">' + esc(msg || '') + '</p>';
  h += '<div class="stats"><div class="stat"><b>' + r.length + '</b><span>Peserta</span></div><div class="stat"><b>' + tot.s + '</b><span>Level selesai</span></div>' +
       '<div class="stat"><b>' + tot.p + '</b><span>Percobaan</span></div><div class="stat"><b>' + (FILTER === '*' ? DATA.ringkasan.kelas : 1) + '</b><span>Kelas</span></div></div>';
  h += '<div class="card"><h2>Peringkat' + (FILTER === '*' ? ' (semua kelas)' : ' · Kelas ' + esc(FILTER === '-' ? '(tanpa kelas)' : FILTER)) + '</h2>';
  if (!r.length) h += '<p class="meta">Belum ada data.</p>';
  else {
    h += '<div class="tw"><table><thead><tr><th>#</th><th>Nama</th><th>Kelas</th><th class="n">Poin</th><th class="n">Bintang</th><th class="n">Level</th><th class="n">Coba</th><th class="n">Bonus</th><th class="n">Penalti</th>' +
         DATA.games.map(function(g){ return '<th class="n" title="' + esc(g) + '">' + esc(g.length > 12 ? g.slice(0,11) + '…' : g) + '</th>'; }).join('') + '</tr></thead><tbody>';
    r.forEach(function(x){
      h += '<tr' + (x.rank <= 3 ? ' class="top3"' : '') + '><td>' + (x.rank === 1 ? '🥇' : x.rank === 2 ? '🥈' : x.rank === 3 ? '🥉' : x.rank) + '</td><td class="nm"><div class="w">' + avatar(x.nama, 28) + esc(x.nama) + '</div></td><td><span class="pill">' + esc(x.kelas) + '</span></td>' +
           '<td class="n"><b>' + x.poin + '</b></td><td class="n">' + x.bintang + '</td><td class="n">' + x.selesai + '</td><td class="n">' + x.percobaan + '</td><td class="n">' + x.bonus + '</td><td class="n">-' + x.penalti + '</td>' +
           DATA.games.map(function(g){ return '<td class="n">' + (x.perGame[g] || 0) + '</td>'; }).join('') + '</tr>';
    });
    h += '</tbody></table></div>';
  }
  h += '</div>';
  var tb = DATA.terbaru.filter(function(x){ return FILTER === '*' || x.kelas === FILTER; });
  h += '<div class="card"><h2>Aktivitas terbaru</h2>';
  if (!tb.length) h += '<p class="meta">Belum ada aktivitas.</p>';
  else {
    h += '<div class="tw"><table><thead><tr><th>Waktu</th><th>Nama</th><th>Kelas</th><th>Game</th><th class="n">Level</th><th class="n">Bintang</th></tr></thead><tbody>';
    tb.forEach(function(x){ h += '<tr><td>' + (x.waktu ? new Date(x.waktu).toLocaleString('id-ID') : '') + '</td><td>' + esc(x.nama) + '</td><td>' + esc(x.kelas) + '</td><td>' + esc(x.game) + '</td><td class="n">' + esc(x.level) + '</td><td class="n">' + esc(x.bintang) + '</td></tr>'; });
    h += '</tbody></table></div>';
  }
  h += '</div><p class="meta">Poin = 10 per bintang terbaik per game dan level, +5 bonus jika percobaan pertama langsung 3 bintang, -1 per percobaan ulang. Data asli ada di tab Log pada Google Sheet.</p>';
  app.innerHTML = h;
  document.getElementById('kf').onchange = function(){ FILTER = this.value; render(); };
  document.getElementById('tarik').onclick = tarik;
  document.getElementById('csv').onclick = csv;
  document.getElementById('out').onclick = function(){ try{ sessionStorage.removeItem('pk_admin'); }catch(e){} DATA = null; TOKEN = ''; login(); };
}
function csv(){
  var cols = ['rank','kelas','nama','poin','bintang','selesai','percobaan','bonus','penalti'].concat(DATA.games);
  var out = [cols.join(',')].concat(rows().map(function(x){
    return cols.map(function(c){ var v = DATA.games.indexOf(c) >= 0 ? (x.perGame[c] || 0) : x[c]; v = String(v == null ? '' : v); if (/^[=+\-@]/.test(v) && isNaN(Number(v))) v = "'" + v; return '"' + v.replace(/"/g,'""') + '"'; }).join(',');
  }));
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿' + out.join('\n')], {type:'text/csv'}));
  a.download = 'peringkat-' + (FILTER === '*' ? 'semua' : FILTER) + '.csv'; document.body.appendChild(a); a.click(); a.remove();
}
try{ TOKEN = sessionStorage.getItem('pk_admin') || ''; }catch(e){}
if (TOKEN) tarik(); else login();
</script>
</body>
</html>
